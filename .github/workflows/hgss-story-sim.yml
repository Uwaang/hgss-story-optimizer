      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Run resource and player-policy hard-boss oracle
        run: |
          mkdir -p results
          node src/cli.mjs boss-local-resource-policy-probe --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --targets=${{ matrix.targets }} --runs=10 --top-per-boss=8 --candidate-cap=10 > results/resource-policy-oracle-${{ matrix.label }}.json
      - name: Upload resource policy oracle
        uses: actions/upload-artifact@v4
