name: HGSS story simulator

on:
  push:
    branches:
      - feature/hgss-story-sim
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  pull_request:
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          node --check src/hgss-data.mjs
          node --check src/exp-budget.mjs
          node --check src/acquisition.mjs
          node --check src/availability.mjs
          node --check src/battle.mjs
          node --check src/cli.mjs
      - name: Validate source-backed availability
        run: npm run validate
      - name: Growth EXP table smoke test
        run: npm run exp-smoke
      - name: Natural EXP budget smoke test
        run: npm run exp-budget-smoke
      - name: Map-level acquisition timing smoke test
        run: npm run exp-segment-smoke
      - name: EXP allocator smoke test
        run: npm run exp-allocator-smoke
      - name: EXP envelope comparison smoke test
        run: npm run exp-envelope-smoke
      - name: Legacy top-team EXP envelope probe
        run: npm run exp-envelope -- --version=HEARTGOLD --team=Cyndaquil,Slowpoke,Tauros,Goldeen,Dunsparce,Lapras --resources=all --spend-policy=natural --runs=1
      - name: Capture-search cost smoke test
        run: npm run capture-smoke
      - name: EXP-aware real-battle smoke test
        run: npm run exp-route-smoke
      - name: Resource profile smoke test
        run: npm run resource-smoke
      - name: Natural money and coin budget smoke test
        run: npm run resource-budget-smoke
      - name: Move scoring penalty smoke test
        run: npm run move-score-smoke
      - name: Resource monotonicity smoke test
        run: npm run resource-monotonic-smoke
      - name: Starter-specific story route smoke test
        run: npm run route-smoke
      - name: HGSS battle smoke test
        run: npm run smoke
      - name: Player matchup switching smoke test
        run: npm run switch-smoke
      - name: Reusable tutor timing smoke test
        run: npm run tutor-smoke
      - name: Reusable HM timing smoke test
        run: npm run hm-smoke
      - name: Single-use TM ownership smoke test
        run: npm run tm-smoke
      - name: Purchasable TM cost smoke test
        run: npm run shop-tm-smoke
      - name: Full Johto route smoke test
        run: npm run simulate -- --runs=1
      - name: Canonical acquisition pool smoke test
        run: |
          npm run pool -- --version=HEARTGOLD
          npm run pool -- --version=SOULSILVER
      - name: Generated-pool search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --runs=1 --limit=2 --team-size=6
      - name: Beam-search smoke test
        run: npm run search -- --strategy=beam --starter=Cyndaquil --runs=1 --screen-runs=1 --beam-width=2 --candidate-cap=5 --team-size=3
      - name: Search convergence smoke test
        run: npm run convergence -- --version=HEARTGOLD --starter=Cyndaquil --resources=core --exp-profile=major --runs=1 --screen-runs=1 --final-runs=1 --beam-widths=1,2 --candidate-caps=3,4 --team-size=3
      - name: EXP-budgeted beam-search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --strategy=beam --starter=Cyndaquil --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=none --runs=1 --screen-runs=1 --final-runs=1 --beam-width=2 --candidate-cap=5 --team-size=3
      - name: Preliminary starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize]')
        run: npm run optimize -- --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/preliminary.json
      - name: Upload preliminary optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-preliminary-optimization
          path: hgss_story_sim/results/preliminary.json
          if-no-files-found: error
      - name: Core-resource starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-core]')
        run: npm run optimize -- --resources=core --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/core.json
      - name: Upload core-resource optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-core]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-core-optimization
          path: hgss_story_sim/results/core.json
          if-no-files-found: error
      - name: Major-only EXP lower-bound optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=major --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-major.json
      - name: Upload major-only EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-major-optimization
          path: hgss_story_sim/results/exp-major.json
          if-no-files-found: error
      - name: Normal-route EXP starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-normal-route.json
      - name: Upload normal-route EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-normal-route-optimization
          path: hgss_story_sim/results/exp-normal-route.json
          if-no-files-found: error
      - name: Natural-EXP starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-natural.json
      - name: Upload natural-EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-natural-optimization
          path: hgss_story_sim/results/exp-natural.json
          if-no-files-found: error
      - name: Paid-grind starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=ace-paid --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-ace-paid.json
      - name: Upload paid-grind optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-ace-paid-optimization
          path: hgss_story_sim/results/exp-ace-paid.json
          if-no-files-found: error

  convergence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[convergence]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run current-vs-expanded convergence benchmark
        run: |
          mkdir -p results
          npm run convergence -- --version=HEARTGOLD --starter=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --exp-allocator=balanced --runs=1 --screen-runs=1 --final-runs=2 --pairs=4:16,8:24 --team-size=6 > results/convergence-hg-cyndaquil.json
      - name: Upload convergence benchmark
        uses: actions/upload-artifact@v4
        with:
          name: hgss-convergence-hg-cyndaquil
          path: hgss_story_sim/results/convergence-hg-cyndaquil.json
          if-no-files-found: error
