          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Lv62 one-slot neighborhood search
        run: |
          mkdir -p results
          node src/cli.mjs red-min-grind-local-swap-search \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --level=62 \
            --team=Typhlosion,Quagsire,Tyranitar,Corsola,Rhyperior,Cloyster \
            --candidate-cap=84 \
            --screen-runs=4 \
            --finalist-cap=20 \
            --final-runs=100 \
            --target-win-rate=0.5 \
            > results/red-local-swap-hg-cyndaquil-lv62.json
      - name: Upload local Red neighborhood result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-local-swap-hg-cyndaquil-lv62
          path: hgss_story_sim/results/red-local-swap-hg-cyndaquil-lv62.json
          if-no-files-found: error

  allocator_depth_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'allocator-depth-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('hgss_story_sim/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Cache pinned pret source data
        uses: actions/cache@v4
        with:
          path: hgss_story_sim/.cache/source
          key: pret-source-v1-${{ runner.os }}-${{ hashFiles('hgss_story_sim/config/story-bosses.json') }}
          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Compare baseline and top-two depth allocator
        run: |
          mkdir -p results
          node src/cli.mjs allocator-depth-compare --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=10 --resources=all --spend-policy=natural --objective=story-clear > results/allocator-depth-${{ matrix.label }}.json
      - name: Upload allocator depth comparison
        uses: actions/upload-artifact@v4
        with:
          name: hgss-allocator-depth-${{ matrix.label }}
          path: hgss_story_sim/results/allocator-depth-${{ matrix.label }}.json
          if-no-files-found: error

  allocator_saturation_matrix_6:
