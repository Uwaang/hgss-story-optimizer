name: HGSS story simulator

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HGSS_SOURCE_CACHE_DIR: ${{ github.workspace }}/hgss_story_sim/.cache/source

concurrency:
  group: hgss-story-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  pull_request:
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Manual experiment to run
        required: false
        default: default
        type: choice
        options:
          - default
          - red-min-grind-pilot
          - red-model-sanity
          - red-focused-search
          - red-local-swap-search
          - red-min-grind-matrix
          - allocator-story-matrix
          - allocator-saturation-matrix
          - allocator-depth-matrix
          - team-ablation
          - team-usage
          - meaningful-six-refinement
          - boss-interaction-pilot
          - boss-interaction-matrix
          - counterfactual-specialist-matrix
          - boss-local-oracle-matrix
          - resource-policy-oracle-matrix
          - red-policy-confirm
          - activation-pilot
          - activation-soft-sweep
          - member-contribution-pilot
          - contribution-candidate-probe
          - abra-slot-refinement
          - meaningful-six-pilot
          - meaningful-six-refinement

jobs:
  red_min_grind_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-min-grind-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('hgss_story_sim/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Cache pinned pret source data
        uses: actions/cache@v4
        with:
          path: hgss_story_sim/.cache/source
          key: pret-source-v1-${{ runner.os }}-${{ hashFiles('hgss_story_sim/config/story-bosses.json') }}
          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Search minimum-grind Red team
        run: |
          mkdir -p results
          node src/cli.mjs red-min-grind-ga-search --version=${{ matrix.version }} --starter=${{ matrix.starter }} --level-min=45 --level-max=100 --level-step=5 --candidate-cap=60 --population=14 --generations=3 --search-runs=1 --finalist-cap=12 --final-runs=30 --target-win-rate=0.5 > results/red-min-grind-${{ matrix.label }}.json
      - name: Validate best observed 50 percent team at 100 runs
        shell: bash
        run: |
          FILE=results/red-min-grind-${{ matrix.label }}.json
          TEAM=$(node -e "const d=require('./' + process.argv[1]); const v=d.bestByTarget?.['0.5']; if(v) process.stdout.write(v.team.map(x=>x.species).join(','));" "$FILE")
          LEVEL=$(node -e "const d=require('./' + process.argv[1]); const v=d.bestByTarget?.['0.5']; if(v) process.stdout.write(String(v.commonLevel));" "$FILE")
          if [ -n "$TEAM" ] && [ -n "$LEVEL" ]; then
            node src/cli.mjs red-min-grind-validate --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team="$TEAM" --level="$LEVEL" --runs=100 > results/red-min-grind-${{ matrix.label }}-validate100.json
          else
            echo '{"status":"no-50-percent-finalist"}' > results/red-min-grind-${{ matrix.label }}-validate100.json
          fi
      - name: Upload Red minimum-grind matrix result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-min-grind-${{ matrix.label }}
          path: hgss_story_sim/results/red-min-grind-${{ matrix.label }}*.json
          if-no-files-found: error

  red_min_grind_pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-min-grind-pilot'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('hgss_story_sim/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Cache pinned pret source data
        uses: actions/cache@v4
        with:
          path: hgss_story_sim/.cache/source
          key: pret-source-v1-${{ runner.os }}-${{ hashFiles('hgss_story_sim/config/story-bosses.json') }}
          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Search HG Cyndaquil minimum-grind Red team
        run: |
          mkdir -p results
          node src/cli.mjs red-min-grind-ga-search --version=HEARTGOLD --starter=Cyndaquil --level-min=45 --level-max=100 --level-step=5 --candidate-cap=60 --population=14 --generations=3 --search-runs=1 --finalist-cap=12 --final-runs=30 --target-win-rate=0.5 --refine-population=22 --refine-generations=4 --refine-runs=1 --refine-level-cap=3 > results/red-min-grind-hg-cyndaquil.json
      - name: Upload Red minimum-grind pilot
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-min-grind-hg-cyndaquil
          path: hgss_story_sim/results/red-min-grind-hg-cyndaquil.json
          if-no-files-found: error

  red_model_sanity:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-model-sanity'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('hgss_story_sim/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Cache pinned pret source data
        uses: actions/cache@v4
        with:
          path: hgss_story_sim/.cache/source
          key: pret-source-v1-${{ runner.os }}-${{ hashFiles('hgss_story_sim/config/story-bosses.json') }}
          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Calibrate Red player model at low levels
        run: |
          mkdir -p results
          node src/cli.mjs red-battle-model-sanity --version=HEARTGOLD --starter=Cyndaquil --levels=50,55,60,65,70 --runs=5 > results/red-battle-model-sanity-hg-cyndaquil.json
      - name: Upload Red player-model sanity
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-battle-model-sanity-hg-cyndaquil
          path: hgss_story_sim/results/red-battle-model-sanity-hg-cyndaquil.json
          if-no-files-found: error

  red_focused_search:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-focused-search'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('hgss_story_sim/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Cache pinned pret source data
        uses: actions/cache@v4
        with:
          path: hgss_story_sim/.cache/source
          key: pret-source-v1-${{ runner.os }}-${{ hashFiles('hgss_story_sim/config/story-bosses.json') }}
          restore-keys: |
            pret-source-v1-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Focused Lv60-65 Red search with 100-run finalists
        run: |
          mkdir -p results
          node src/cli.mjs red-min-grind-ga-search \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --level-min=60 \
            --level-max=65 \
            --level-step=1 \
            --candidate-cap=84 \
            --population=28 \
            --generations=6 \
            --search-runs=2 \
            --cross-level-population=22 \
            --cross-level-generations=4 \
            --cross-level-runs=2 \
            --cross-level-seed-cap=6 \
            --refine-population=40 \
            --refine-generations=7 \
            --refine-runs=2 \
            --refine-level-cap=6 \
            --finalist-cap=18 \
            --final-runs=100 \
            --target-win-rate=0.5 \
            > results/red-focused-hg-cyndaquil-lv60-65.json
      - name: Revalidate previous Lv57 winner at 100 runs
        continue-on-error: true
        run: |
          node src/cli.mjs red-min-grind-validate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --team=Typhlosion,Quagsire,Tyranitar,Magneton,Ampharos,Rhyperior \
            --level=57 \
            --runs=100 \
            > results/red-known-lv57-validate100.json
      - name: Project current Lv65 winner to Lv63
        continue-on-error: true
        run: |
          node src/cli.mjs red-min-grind-validate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --team=Typhlosion,Houndoom,Tyranitar,Quagsire,Wormadam,Hitmonlee \
            --level=63 \
            --runs=100 \
            > results/red-current-winner-lv63-validate100.json
      - name: Project current Lv65 winner to Lv64
        continue-on-error: true
        run: |
          node src/cli.mjs red-min-grind-validate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --team=Typhlosion,Houndoom,Tyranitar,Quagsire,Wormadam,Hitmonlee \
            --level=64 \
            --runs=100 \
            > results/red-current-winner-lv64-validate100.json
      - name: Revalidate current Lv65 winner at 100 runs
        continue-on-error: true
        run: |
          node src/cli.mjs red-min-grind-validate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --team=Typhlosion,Houndoom,Tyranitar,Quagsire,Wormadam,Hitmonlee \
            --level=65 \
            --runs=100 \
            > results/red-current-winner-lv65-validate100.json
      - name: Upload focused Red search
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-focused-hg-cyndaquil-lv60-65
          path: hgss_story_sim/results/red-*.json
          if-no-files-found: error

  red_local_swap_search:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-local-swap-search'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
