          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
