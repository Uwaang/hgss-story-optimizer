name: HGSS story simulator

on:
  push:
    branches:
      - feature/hgss-story-sim
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  pull_request:
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          node --check src/hgss-data.mjs
          node --check src/acquisition.mjs
          node --check src/battle.mjs
          node --check src/cli.mjs
      - name: HGSS battle smoke test
        run: npm run smoke
      - name: Full Johto route smoke test
        run: npm run simulate -- --runs=1
      - name: Canonical acquisition pool smoke test
        run: |
          npm run pool -- --version=HEARTGOLD
          npm run pool -- --version=SOULSILVER
      - name: Generated-pool search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --runs=1 --limit=2 --team-size=6
