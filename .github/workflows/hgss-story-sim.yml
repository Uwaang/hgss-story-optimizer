name: HGSS story simulator

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  pull_request:
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Manual experiment to run
        required: false
        default: default
        type: choice
        options:
          - default
          - allocator-story-matrix
          - allocator-saturation-matrix
          - allocator-depth-matrix
          - team-ablation
          - team-usage
          - meaningful-six-refinement
          - boss-interaction-pilot
          - boss-interaction-matrix
          - counterfactual-specialist-matrix
          - boss-local-oracle-matrix
          - resource-policy-oracle-matrix
          - red-policy-confirm
          - activation-pilot
          - activation-soft-sweep
          - member-contribution-pilot
          - contribution-candidate-probe
          - abra-slot-refinement
          - meaningful-six-pilot
          - meaningful-six-refinement

jobs:
  allocator_depth_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'allocator-depth-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare baseline and top-two depth allocator
        run: |
          mkdir -p results
          node src/cli.mjs allocator-depth-compare --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=10 --resources=all --spend-policy=natural --objective=story-clear > results/allocator-depth-${{ matrix.label }}.json
      - name: Upload allocator depth comparison
        uses: actions/upload-artifact@v4
        with:
          name: hgss-allocator-depth-${{ matrix.label }}
          path: hgss_story_sim/results/allocator-depth-${{ matrix.label }}.json
          if-no-files-found: error

  allocator_saturation_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'allocator-saturation-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Compare baseline and saturation allocator
        run: |
          mkdir -p results
          node src/cli.mjs allocator-saturation-compare --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=10 --resources=all --spend-policy=natural --objective=story-clear > results/allocator-saturation-${{ matrix.label }}.json
      - name: Upload allocator saturation comparison
        uses: actions/upload-artifact@v4
        with:
          name: hgss-allocator-saturation-${{ matrix.label }}
          path: hgss_story_sim/results/allocator-saturation-${{ matrix.label }}.json
          if-no-files-found: error

  red_policy_confirm_2:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'red-policy-confirm'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            label: hg
          - version: SOULSILVER
            label: ss
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Confirm Cyndaquil Red Larvitar policy signal
        run: |
          mkdir -p results
          node src/cli.mjs boss-local-resource-policy-probe --version=${{ matrix.version }} --starter=Cyndaquil --team=Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish --targets=Red --candidates=Larvitar --runs=50 --top-per-boss=1 --candidate-cap=1 > results/red-policy-confirm-${{ matrix.label }}.json
      - name: Upload Red policy confirmation
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-policy-confirm-${{ matrix.label }}
          path: hgss_story_sim/results/red-policy-confirm-${{ matrix.label }}.json
          if-no-files-found: error

  resource_policy_oracle_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'resource-policy-oracle-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            targets: Lance,Red
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            targets: Lance,Red
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            targets: Red
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            targets: Red
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            targets: Red
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            targets: Red
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run resource and player-policy hard-boss oracle
        run: |
          mkdir -p results
          node src/cli.mjs boss-local-resource-policy-probe --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --targets=${{ matrix.targets }} --runs=10 --top-per-boss=8 --candidate-cap=10 > results/resource-policy-oracle-${{ matrix.label }}.json
      - name: Upload resource policy oracle
        uses: actions/upload-artifact@v4
        with:
          name: hgss-resource-policy-oracle-${{ matrix.label }}
          path: hgss_story_sim/results/resource-policy-oracle-${{ matrix.label }}.json
          if-no-files-found: error

  boss_local_oracle_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'boss-local-oracle-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run boss-local fixed-state oracle
        run: |
          mkdir -p results
          node src/cli.mjs boss-local-oracle-probe --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=10 --targets=Clair,Lance,Misty,Blue,Red --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --top-per-boss=8 --candidate-cap=10 > results/boss-local-oracle-${{ matrix.label }}.json
      - name: Upload boss-local oracle probe
        uses: actions/upload-artifact@v4
        with:
          name: hgss-boss-local-oracle-${{ matrix.label }}
          path: hgss_story_sim/results/boss-local-oracle-${{ matrix.label }}.json
          if-no-files-found: error

  counterfactual_specialist_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'counterfactual-specialist-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Probe hard-wall specialist replacements
        run: |
          mkdir -p results
          node src/cli.mjs counterfactual-specialist-probe --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=10 --targets=Clair,Lance,Misty,Blue,Red --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --top-per-boss=3 --candidate-cap=10 > results/counterfactual-specialist-${{ matrix.label }}.json
      - name: Upload counterfactual specialist probe
        uses: actions/upload-artifact@v4
        with:
          name: hgss-counterfactual-specialist-${{ matrix.label }}
          path: hgss_story_sim/results/counterfactual-specialist-${{ matrix.label }}.json
          if-no-files-found: error

  boss_interaction_matrix_6:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'boss-interaction-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEARTGOLD
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: hg-cyndaquil
          - version: SOULSILVER
            starter: Cyndaquil
            team: Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish
            label: ss-cyndaquil
          - version: HEARTGOLD
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: hg-totodile
          - version: SOULSILVER
            starter: Totodile
            team: Totodile,Magnemite,Gastly,Drowzee,Magikarp,Dunsparce
            label: ss-totodile
          - version: HEARTGOLD
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Chinchou,Caterpie,Magikarp
            label: hg-chikorita
          - version: SOULSILVER
            starter: Chikorita
            team: Chikorita,Abra,Mareep,Qwilfish,Magikarp,Tentacool
            label: ss-chikorita
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build boss interaction matrix
        run: |
          mkdir -p results
          node src/cli.mjs boss-interaction-matrix --version=${{ matrix.version }} --starter=${{ matrix.starter }} --team=${{ matrix.team }} --runs=20 --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --top-pool-per-boss=16 > results/boss-interaction-${{ matrix.label }}.json
      - name: Upload boss interaction matrix
        uses: actions/upload-artifact@v4
        with:
          name: hgss-boss-interaction-${{ matrix.label }}
          path: hgss_story_sim/results/boss-interaction-${{ matrix.label }}.json
          if-no-files-found: error

  boss_interaction_pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'boss-interaction-pilot'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build HG Cyndaquil boss interaction matrix
        run: |
          mkdir -p results
          node src/cli.mjs boss-interaction-matrix --version=HEARTGOLD --starter=Cyndaquil --team=Cyndaquil,Chinchou,Abra,Pidgey,Qwilfish,Caterpie --runs=20 --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --top-pool-per-boss=16 > results/boss-interaction-hg-cyndaquil.json
      - name: Upload boss interaction matrix
        uses: actions/upload-artifact@v4
        with:
          name: hgss-boss-interaction-hg-cyndaquil
          path: hgss_story_sim/results/boss-interaction-hg-cyndaquil.json
          if-no-files-found: error


  equal_level_story_pilot:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/hg-cyndaquil-equal-level-story'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check src/cli.mjs
      - name: HG Cyndaquil equal-level route pilot
        run: |
          mkdir -p results
          node src/cli.mjs equal-level-story-evaluate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --team=Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish \
            --levels=30,40,50,57,60 \
            --runs=3 \
            > results/hg-cyndaquil-equal-level-route-pilot.json
      - name: HG Cyndaquil equal-level team search pilot
        run: |
          node src/cli.mjs equal-level-story-search \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --level=57 \
            --candidate-cap=18 \
            --beam-width=18 \
            --proxy-finalists=10 \
            --screen-runs=1 \
            --final-cap=4 \
            --final-runs=8 \
            > results/hg-cyndaquil-equal-level-search-lv57.json
      - name: Upload equal-level pilot
        uses: actions/upload-artifact@v4
        with:
          name: hg-cyndaquil-equal-level-route-pilot
          path: |
            hgss_story_sim/results/hg-cyndaquil-equal-level-route-pilot.json
            hgss_story_sim/results/hg-cyndaquil-equal-level-search-lv57.json
          if-no-files-found: error


  equal_level_story_level_matrix:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/hg-cyndaquil-equal-level-story'
    strategy:
      fail-fast: false
      matrix:
        level: [45, 50, 55, 57, 60]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Search equal-level team
        run: |
          mkdir -p results
          node src/cli.mjs equal-level-story-search \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --level=${{ matrix.level }} \
            --candidate-cap=18 \
            --beam-width=18 \
            --proxy-finalists=10 \
            --screen-runs=1 \
            --final-cap=4 \
            --final-runs=8 \
            > results/hg-cyndaquil-equal-level-search-lv${{ matrix.level }}.json
      - name: Upload level search
        uses: actions/upload-artifact@v4
        with:
          name: hg-cyndaquil-equal-level-search-lv${{ matrix.level }}
          path: hgss_story_sim/results/hg-cyndaquil-equal-level-search-lv${{ matrix.level }}.json
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          node --check src/hgss-data.mjs
          node --check src/trainer-ai.mjs
          node --check src/exp-budget.mjs
          node --check src/acquisition.mjs
          node --check src/availability.mjs
          node --check src/battle.mjs
          node --check src/cli.mjs
      - name: Validate source-backed availability
        run: npm run validate
      - name: Growth EXP table smoke test
        run: npm run exp-smoke
      - name: Natural EXP budget smoke test
        run: npm run exp-budget-smoke
      - name: Map-level acquisition timing smoke test
        run: npm run exp-segment-smoke
      - name: EXP allocator smoke test
        run: npm run exp-allocator-smoke
      - name: Team-order invariance smoke test
        run: npm run team-order-smoke
      - name: Story-clear objective smoke test
        run: npm run objective-smoke
      - name: EXP envelope comparison smoke test
        run: npm run exp-envelope-smoke
      - name: Legacy top-team EXP envelope probe
        run: npm run exp-envelope -- --version=HEARTGOLD --team=Cyndaquil,Slowpoke,Tauros,Goldeen,Dunsparce,Lapras --resources=all --spend-policy=natural --runs=1
      - name: Capture-search cost smoke test
        run: npm run capture-smoke
      - name: EXP-aware real-battle smoke test
        run: npm run exp-route-smoke
      - name: Resource profile smoke test
        run: npm run resource-smoke
      - name: Natural money and coin budget smoke test
        run: npm run resource-budget-smoke
      - name: Move scoring penalty smoke test
        run: npm run move-score-smoke
      - name: Resource monotonicity smoke test
        run: npm run resource-monotonic-smoke
      - name: Starter-specific story route smoke test
        run: npm run route-smoke
      - name: HGSS battle smoke test
        run: npm run smoke
      - name: Boss-local oracle smoke test
        run: node src/cli.mjs boss-local-oracle-probe --version=HEARTGOLD --starter=Cyndaquil --team=Cyndaquil,Chinchou,Abra,Magikarp,Pidgey,Qwilfish --runs=1 --targets=Misty --candidates=Magnemite --candidate-cap=1 --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear > /tmp/boss-local-oracle-smoke.json
      - name: Player matchup switching smoke test
        run: npm run switch-smoke
      - name: HGSS trainer AI metadata, move, switch, and item smoke test
        run: npm run trainer-ai-smoke
      - name: Reusable tutor timing smoke test
        run: npm run tutor-smoke
      - name: Reusable HM timing smoke test
        run: npm run hm-smoke
      - name: Single-use TM ownership smoke test
        run: npm run tm-smoke
      - name: Purchasable TM cost smoke test
        run: npm run shop-tm-smoke
      - name: Full Johto route smoke test
        run: npm run simulate -- --runs=1
      - name: Canonical acquisition pool smoke test
        run: |
          npm run pool -- --version=HEARTGOLD
          npm run pool -- --version=SOULSILVER
      - name: Generated-pool search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --runs=1 --limit=2 --team-size=6
      - name: Beam-search smoke test
        run: npm run search -- --strategy=beam --starter=Cyndaquil --runs=1 --screen-runs=1 --beam-width=2 --candidate-cap=5 --team-size=3
      - name: Search convergence smoke test
        run: npm run convergence -- --version=HEARTGOLD --starter=Cyndaquil --resources=core --exp-profile=major --runs=1 --screen-runs=1 --final-runs=1 --beam-widths=1,2 --candidate-caps=3,4 --team-size=3
      - name: EXP-budgeted beam-search smoke test
