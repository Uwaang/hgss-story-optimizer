name: HGSS story simulator

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - main
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  pull_request:
    paths:
      - 'hgss_story_sim/**'
      - '.github/workflows/hgss-story-sim.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: |
          node --check src/hgss-data.mjs
          node --check src/trainer-ai.mjs
          node --check src/exp-budget.mjs
          node --check src/acquisition.mjs
          node --check src/availability.mjs
          node --check src/battle.mjs
          node --check src/cli.mjs
      - name: Validate source-backed availability
        run: npm run validate
      - name: Growth EXP table smoke test
        run: npm run exp-smoke
      - name: Natural EXP budget smoke test
        run: npm run exp-budget-smoke
      - name: Map-level acquisition timing smoke test
        run: npm run exp-segment-smoke
      - name: EXP allocator smoke test
        run: npm run exp-allocator-smoke
      - name: Team-order invariance smoke test
        run: npm run team-order-smoke
      - name: Story-clear objective smoke test
        run: npm run objective-smoke
      - name: EXP envelope comparison smoke test
        run: npm run exp-envelope-smoke
      - name: Legacy top-team EXP envelope probe
        run: npm run exp-envelope -- --version=HEARTGOLD --team=Cyndaquil,Slowpoke,Tauros,Goldeen,Dunsparce,Lapras --resources=all --spend-policy=natural --runs=1
      - name: Capture-search cost smoke test
        run: npm run capture-smoke
      - name: EXP-aware real-battle smoke test
        run: npm run exp-route-smoke
      - name: Resource profile smoke test
        run: npm run resource-smoke
      - name: Natural money and coin budget smoke test
        run: npm run resource-budget-smoke
      - name: Move scoring penalty smoke test
        run: npm run move-score-smoke
      - name: Resource monotonicity smoke test
        run: npm run resource-monotonic-smoke
      - name: Starter-specific story route smoke test
        run: npm run route-smoke
      - name: HGSS battle smoke test
        run: npm run smoke
      - name: Player matchup switching smoke test
        run: npm run switch-smoke
      - name: HGSS trainer AI metadata, move, switch, and item smoke test
        run: npm run trainer-ai-smoke
      - name: Reusable tutor timing smoke test
        run: npm run tutor-smoke
      - name: Reusable HM timing smoke test
        run: npm run hm-smoke
      - name: Single-use TM ownership smoke test
        run: npm run tm-smoke
      - name: Purchasable TM cost smoke test
        run: npm run shop-tm-smoke
      - name: Full Johto route smoke test
        run: npm run simulate -- --runs=1
      - name: Canonical acquisition pool smoke test
        run: |
          npm run pool -- --version=HEARTGOLD
          npm run pool -- --version=SOULSILVER
      - name: Generated-pool search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --runs=1 --limit=2 --team-size=6
      - name: Beam-search smoke test
        run: npm run search -- --strategy=beam --starter=Cyndaquil --runs=1 --screen-runs=1 --beam-width=2 --candidate-cap=5 --team-size=3
      - name: Search convergence smoke test
        run: npm run convergence -- --version=HEARTGOLD --starter=Cyndaquil --resources=core --exp-profile=major --runs=1 --screen-runs=1 --final-runs=1 --beam-widths=1,2 --candidate-caps=3,4 --team-size=3
      - name: EXP-budgeted beam-search smoke test
        run: npm run search -- --pool=canonical --version=HEARTGOLD --strategy=beam --starter=Cyndaquil --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=none --runs=1 --screen-runs=1 --final-runs=1 --beam-width=2 --candidate-cap=5 --team-size=3
      - name: Preliminary starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize]')
        run: npm run optimize -- --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/preliminary.json
      - name: Upload preliminary optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-preliminary-optimization
          path: hgss_story_sim/results/preliminary.json
          if-no-files-found: error
      - name: Core-resource starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-core]')
        run: npm run optimize -- --resources=core --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/core.json
      - name: Upload core-resource optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-core]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-core-optimization
          path: hgss_story_sim/results/core.json
          if-no-files-found: error
      - name: Major-only EXP lower-bound optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=major --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-major.json
      - name: Upload major-only EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-major-optimization
          path: hgss_story_sim/results/exp-major.json
          if-no-files-found: error
      - name: Normal-route EXP starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-normal-route.json
      - name: Upload normal-route EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-normal-route-optimization
          path: hgss_story_sim/results/exp-normal-route.json
          if-no-files-found: error
      - name: Natural-EXP starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=none --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-natural.json
      - name: Upload natural-EXP optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-natural-optimization
          path: hgss_story_sim/results/exp-natural.json
          if-no-files-found: error
      - name: Paid-grind starter optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        run: npm run optimize -- --resources=all --spend-policy=natural --exp-profile=all-accessible --grind-policy=ace-paid --versions=HEARTGOLD,SOULSILVER --starters=Chikorita,Cyndaquil,Totodile --runs=1 --screen-runs=1 --final-runs=10 --beam-width=4 --candidate-cap=16 --team-size=6 --output=results/exp-ace-paid.json
      - name: Upload paid-grind optimization
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[optimize-exp]')
        uses: actions/upload-artifact@v4
        with:
          name: hgss-exp-ace-paid-optimization
          path: hgss_story_sim/results/exp-ace-paid.json
          if-no-files-found: error


  allocator_compare:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[allocator-compare]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expAllocator: [balanced, boss-aware-soft, boss-aware]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize ${{ matrix.expAllocator }} allocator
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=${{ matrix.expAllocator }} --runs=1 --screen-runs=1 --final-runs=10 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/allocator-${{ matrix.expAllocator }}.json
      - name: Upload ${{ matrix.expAllocator }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-allocator-${{ matrix.expAllocator }}-hg-cyndaquil
          path: hgss_story_sim/results/allocator-${{ matrix.expAllocator }}.json
          if-no-files-found: error

  soft_allocator_sweep:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[soft-sweep]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        softScale: [8, 12, 16, 24]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize soft allocator scale ${{ matrix.softScale }}
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware-soft --soft-level-scale=${{ matrix.softScale }} --runs=1 --screen-runs=1 --final-runs=10 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/soft-scale-${{ matrix.softScale }}.json
      - name: Upload soft scale ${{ matrix.softScale }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-soft-scale-${{ matrix.softScale }}-hg-cyndaquil
          path: hgss_story_sim/results/soft-scale-${{ matrix.softScale }}.json
          if-no-files-found: error
  soft_allocator_fine_sweep:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[soft-fine]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        softScale: [9, 10, 11]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize fine soft scale ${{ matrix.softScale }}
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware-soft --soft-level-scale=${{ matrix.softScale }} --runs=1 --screen-runs=1 --final-runs=10 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/soft-fine-${{ matrix.softScale }}.json
      - name: Upload fine soft scale ${{ matrix.softScale }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-soft-fine-${{ matrix.softScale }}-hg-cyndaquil
          path: hgss_story_sim/results/soft-fine-${{ matrix.softScale }}.json
          if-no-files-found: error

  story_objective_compare:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-objective]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expAllocator: [balanced, boss-aware-soft, boss-aware]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize story-clear with ${{ matrix.expAllocator }} allocator
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=${{ matrix.expAllocator }} --objective=story-clear --runs=1 --screen-runs=1 --final-runs=20 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/story-clear-${{ matrix.expAllocator }}.json
      - name: Upload story-clear ${{ matrix.expAllocator }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-story-clear-${{ matrix.expAllocator }}-hg-cyndaquil
          path: hgss_story_sim/results/story-clear-${{ matrix.expAllocator }}.json
          if-no-files-found: error


  story_soft_sweep:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-soft-sweep]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        softScale: [12, 16, 24]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize story-clear soft scale ${{ matrix.softScale }}
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware-soft --soft-level-scale=${{ matrix.softScale }} --objective=story-clear --runs=1 --screen-runs=1 --final-runs=20 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/story-soft-scale-${{ matrix.softScale }}.json
      - name: Upload story-clear soft scale ${{ matrix.softScale }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-story-soft-scale-${{ matrix.softScale }}-hg-cyndaquil
          path: hgss_story_sim/results/story-soft-scale-${{ matrix.softScale }}.json
          if-no-files-found: error


  story_resources_pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-resources]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expAllocator: [balanced, boss-aware]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize all-resource story-clear with ${{ matrix.expAllocator }}
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=${{ matrix.expAllocator }} --objective=story-clear --runs=1 --screen-runs=1 --final-runs=20 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/story-resources-${{ matrix.expAllocator }}.json
      - name: Upload all-resource ${{ matrix.expAllocator }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-story-resources-${{ matrix.expAllocator }}-hg-cyndaquil
          path: hgss_story_sim/results/story-resources-${{ matrix.expAllocator }}.json
          if-no-files-found: error


  story_matrix:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-matrix]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [HEARTGOLD, SOULSILVER]
        starter: [Cyndaquil, Totodile, Chikorita]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize ${{ matrix.version }} ${{ matrix.starter }} story-clear
        run: |
          mkdir -p results
          npm run optimize -- --versions=${{ matrix.version }} --starters=${{ matrix.starter }} --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --runs=1 --screen-runs=1 --final-runs=20 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/story-matrix-${{ matrix.version }}-${{ matrix.starter }}.json
      - name: Upload ${{ matrix.version }} ${{ matrix.starter }} result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-story-matrix-${{ matrix.version }}-${{ matrix.starter }}
          path: hgss_story_sim/results/story-matrix-${{ matrix.version }}-${{ matrix.starter }}.json
          if-no-files-found: error


  story_validation:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-validation]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [HEARTGOLD, SOULSILVER]
        starter: [Cyndaquil, Totodile, Chikorita]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate ${{ matrix.version }} ${{ matrix.starter }} with denser sampling
        run: |
          mkdir -p results
          npm run optimize -- --versions=${{ matrix.version }} --starters=${{ matrix.starter }} --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --runs=2 --screen-runs=2 --final-runs=50 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/story-validation-${{ matrix.version }}-${{ matrix.starter }}.json
      - name: Upload ${{ matrix.version }} ${{ matrix.starter }} validation
        uses: actions/upload-artifact@v4
        with:
          name: hgss-story-validation-${{ matrix.version }}-${{ matrix.starter }}
          path: hgss_story_sim/results/story-validation-${{ matrix.version }}-${{ matrix.starter }}.json
          if-no-files-found: error



  trainer_ai_ab:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[trainer-ai-ab]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run controlled trainer AI A/B
        run: |
          mkdir -p results
          node src/cli.mjs trainer-ai-compare --runs=20 > results/trainer-ai-ab-hg-cyndaquil.json
      - name: Upload trainer AI A/B
        uses: actions/upload-artifact@v4
        with:
          name: hgss-trainer-ai-ab-hg-cyndaquil
          path: hgss_story_sim/results/trainer-ai-ab-hg-cyndaquil.json
          if-no-files-found: error

  trainer_ai_pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[trainer-ai-pilot]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize HG Cyndaquil through Red with source-backed trainer AI
        run: |
          mkdir -p results
          npm run optimize -- --versions=HEARTGOLD --starters=Cyndaquil --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --runs=1 --screen-runs=1 --final-runs=10 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/trainer-ai-pilot-hg-cyndaquil.json
      - name: Upload trainer AI pilot
        uses: actions/upload-artifact@v4
        with:
          name: hgss-trainer-ai-pilot-hg-cyndaquil
          path: hgss_story_sim/results/trainer-ai-pilot-hg-cyndaquil.json
          if-no-files-found: error

  red_route_matrix:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[red-route]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [HEARTGOLD, SOULSILVER]
        starter: [Cyndaquil, Totodile, Chikorita]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Optimize through Red for ${{ matrix.version }} ${{ matrix.starter }}
        run: |
          mkdir -p results
          npm run optimize -- --versions=${{ matrix.version }} --starters=${{ matrix.starter }} --resources=all --spend-policy=natural --exp-profile=normal-route --grind-policy=none --entry-level=midpoint --same-stage-join=map-order --exp-allocator=boss-aware --objective=story-clear --runs=1 --screen-runs=1 --final-runs=20 --beam-width=8 --candidate-cap=24 --team-size=6 --output=results/red-route-${{ matrix.version }}-${{ matrix.starter }}.json
      - name: Upload ${{ matrix.version }} ${{ matrix.starter }} Red-route result
        uses: actions/upload-artifact@v4
        with:
          name: hgss-red-route-${{ matrix.version }}-${{ matrix.starter }}
          path: hgss_story_sim/results/red-route-${{ matrix.version }}-${{ matrix.starter }}.json
          if-no-files-found: error

  convergence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[convergence]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run current-vs-expanded convergence benchmark
        run: |
          mkdir -p results
          npm run convergence -- --version=HEARTGOLD --starter=Cyndaquil --resources=core --spend-policy=natural --exp-profile=normal-route --exp-allocator=balanced --runs=1 --screen-runs=1 --final-runs=2 --pairs=4:16,8:24 --team-size=6 > results/convergence-hg-cyndaquil.json
      - name: Upload convergence benchmark
        uses: actions/upload-artifact@v4
        with:
