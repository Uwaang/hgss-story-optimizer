name: research-v2-move-relearner-legality

on:
  push:
    branches:
      - research/v2-move-relearner-legality-v1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Move Reminder legality smoke
        run: node src/cli.mjs tutor-smoke
      - name: Battle semantics smoke
        run: node src/cli.mjs move-score-smoke
      - name: Evolution legality smoke
        run: node src/cli.mjs evolution-legality-smoke
      - name: Evolution checkpoint smoke
        run: node src/cli.mjs evolution-checkpoint-smoke
