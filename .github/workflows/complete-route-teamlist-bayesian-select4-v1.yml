name: complete-route-teamlist-bayesian-select4-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  select:
    if: contains(github.event.head_commit.message, '[teamlist-bayes4-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: teamlist-screen4-input-v1
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37192799510
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: teamlist-screen4-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37192799510
          github-token: ${{ github.token }}
      - name: Build posterior top-decile credible set
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const checkpoint=JSON.parse(fs.readFileSync('results/input/screen4-checkpoint.json','utf8'));
          const files=fs.readdirSync('results/shards').filter(x=>/^compact-\d+\.json$/.test(x));
          if(files.length!==64) throw new Error('expected 64 shards, got '+files.length);

          const key=r=>[...r.teamKeys].sort().join('|');
          const map=new Map();
          for(const f of files){
            const d=JSON.parse(fs.readFileSync(path.join('results/shards',f),'utf8'));
            for(const r of d.rows||[]) map.set(key(r),r);
          }
          const teams=[...map.values()];
          if(teams.length!==2335) throw new Error('expected 2335 teams, got '+teams.length);

          function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
          function normal(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
          function gamma(shape,rng){
            if(shape<1)return gamma(shape+1,rng)*Math.pow(Math.max(rng(),1e-15),1/shape);
            const d=shape-1/3,c=1/Math.sqrt(9*d);
            for(;;){
              let x,v;do{x=normal(rng);v=1+c*x;}while(v<=0);
              v=v*v*v;const u=rng();
              if(u<1-0.0331*x*x*x*x)return d*v;
              if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;
            }
          }
          function beta(a,b,rng){const x=gamma(a,rng),y=gamma(b,rng);return x/(x+y);}

          const params=teams.map(t=>(t.bosses||[]).map(r=>[
            Math.max(0,Number(r.wins||0))+1,
            Math.max(0,Number(r.losses||0))+Math.max(0,Number(r.ties||0))+1
          ]));
          const draws=1024;
          const topK=Math.ceil(teams.length*0.10);
          const occupancy=new Uint32Array(teams.length);
          const rng=mulberry32(0x4B415954);
          const risks=new Array(teams.length);

          for(let d=0;d<draws;d++){
            for(let i=0;i<teams.length;i++){
              let risk=0;
              for(const [a,b] of params[i]){
                const p=Math.max(1e-9,beta(a,b,rng));
                risk+=(1-p)/p;
              }
              risks[i]=[risk,i];
            }
            risks.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
            for(let j=0;j<topK;j++) occupancy[risks[j][1]]++;
          }

          const ranked=teams.map((t,i)=>({
            team:t,
            key:key(t),
            occupancy:Number(occupancy[i]),
            probability:Number(occupancy[i])/draws
          })).sort((a,b)=>b.occupancy-a.occupancy||a.key.localeCompare(b.key));

          const totalMass=draws*topK;
          const targetMass=0.95*totalMass;
          let cumulative=0;
          const selected=[];
          for(const x of ranked){
            if(cumulative>=targetMass && selected.length) break;
            selected.push(x);
            cumulative+=x.occupancy;
          }

          const n04=new Set([
            'Cyndaquil::Cyndaquil->Typhlosion#1','Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1','Lapras::Lapras->Lapras#1',
            'Chinchou::Lanturn->Lanturn#1','Sneasel::Sneasel->Sneasel#1'
          ]);
          const exact=ranked.find(x=>x.team.teamKeys.length===6&&x.team.teamKeys.every(k=>n04.has(k)));
          const selectedMap=new Map(selected.map(x=>[x.key,x]));
          const n04NaturallySelected=exact?selectedMap.has(exact.key):false;
          if(exact && !n04NaturallySelected) selected.push(exact);

          const inputByKey=new Map((checkpoint.beam||[]).map(r=>[[...r.teamKeys].sort().join('|'),r]));
          const outCp={
            ...checkpoint,
            stage:'beam-6-bayesian-select4',
            beam:selected.map(x=>{
              const src=inputByKey.get(x.key);
              return {teamKeys:x.team.teamKeys,evaluation:src?.evaluation||null};
            })
          };
          const summary={
            sourceTeams:teams.length,
            draws,
            topK,
            topFraction:topK/teams.length,
            credibleMassTarget:0.95,
            selectedByPosterior:selected.length-(exact&&!n04NaturallySelected?1:0),
            finalSelectedTeams:selected.length,
            cumulativeOccupancyMass:cumulative/totalMass,
            exactN04:{
              present:Boolean(exact),
              naturallySelected:n04NaturallySelected,
              topDecileProbability:exact?.probability??null,
              occupancy:exact?.occupancy??null
            },
            leaders:ranked.slice(0,30).map((x,i)=>({
              rank:i+1,
              topDecileProbability:x.probability,
              teamKeys:x.team.teamKeys,
              retry:x.team.retry,
              geometric:x.team.geometric,
              mean:x.team.mean
            }))
          };
          fs.writeFileSync('results/selected16-checkpoint.json',JSON.stringify(outCp,null,2));
          fs.writeFileSync('results/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-teamlist-bayesian-select4-v1
          path: |
            hgss_story_sim/results/selected16-checkpoint.json
            hgss_story_sim/results/summary.json
          if-no-files-found: error
