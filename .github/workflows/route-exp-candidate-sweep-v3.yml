name: route-exp-candidate-sweep-v3

on:
  push:
    branches:
      - exp/candidate-sweep-v3

concurrency:
  group: route-exp-candidate-sweep-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate_sweep:
    if: contains(github.event.head_commit.message, '[candidate-sweep-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        grind_budget:
          - 0
          - 250000
          - 600000
          - 1000000
          - 1600000
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: |
          node --check src/cli.mjs
          node --check src/exp-budget.mjs
      - name: Medium-width route-aware candidate sweep
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-search \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route \
            --grind-policy=budgeted --grind-budget=${{ matrix.grind_budget }} \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=story-clear \
            --screen-runs=1 --runs=1 --final-runs=8 \
            --candidate-cap=24 --beam-width=12 \
            > "results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}.json"
      - name: Assert candidate sweep semantics
        run: |
          jq -e '
            .candidatePool >= 20 and
            .assumptions.routeBuildOptimization == true and
            .assumptions.searchPolicy == "route-story" and
            .searchPolicy == "route-story" and
            .assumptions.beamWidth == 12 and
            .assumptions.candidateCap == 24 and
            ([.beamTrace[].targetSize] | index(6)) != null and
            (.top | length) >= 1 and
            ([.top[].teamKeys | length] | all(. == 6))
          ' "results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}.json" >/dev/null
      - name: Write compact shortlist
        run: |
          jq '{
            budget: .assumptions.grindBudget,
            candidatePool,
            screenedCandidates,
            top: [.top[] | {
              team,
              teamKeys,
              score,
              worstBossWinRate,
              bottom5BossWinRate,
              storyClearGeometricScore,
              storyClearCoverageScore,
              totalGrindExp,
              expectedGrindBattles,
              finalLevels
            }]
          }' "results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}.json" \
          > "results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}-shortlist.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}
          path: |
            hgss_story_sim/results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}.json
            hgss_story_sim/results/route-exp-candidate-sweep-v3-${{ matrix.grind_budget }}-shortlist.json
          if-no-files-found: warn
