name: route-exp-red-breakpoint

on:
  push:
    branches:
      - design/route-exp-budget-model
  workflow_dispatch:

jobs:
  breakpoint:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[red-breakpoint]')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        allocator:
          - balanced
          - boss-aware-soft
        grind_budget:
          - 400000
          - 600000
          - 800000
          - 1000000
          - 1200000
          - 1400000
          - 1600000
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate Red breakpoint
        shell: bash
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-evaluate \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=budgeted \
            --grind-budget=${{ matrix.grind_budget }} \
            --entry-level=max --same-stage-join=map-order \
            --exp-allocator=${{ matrix.allocator }} \
            --resources=all --spend-policy=natural \
            --runs=128 \
            --team-keys='Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1' \
            > results/red-breakpoint-${{ matrix.allocator }}-${{ matrix.grind_budget }}.json
      - name: Assert grind accounting
        run: |
          jq -e --argjson budget ${{ matrix.grind_budget }} '
            .ledger.totalGrindExp == $budget and
            .ledger.totalReleasedGrindBudget == $budget and
            .ledger.unusedGrindBudget == 0
          ' results/red-breakpoint-${{ matrix.allocator }}-${{ matrix.grind_budget }}.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: red-breakpoint-${{ matrix.allocator }}-${{ matrix.grind_budget }}
          path: hgss_story_sim/results/*.json
          if-no-files-found: error

  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[red-breakpoint]')
    needs: breakpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: red-breakpoint-*
          path: results
      - name: Build breakpoint summary
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const rows=[];
          for(const dir of fs.readdirSync('results').sort()){
            const full=path.join('results',dir);
            if(!fs.statSync(full).isDirectory()) continue;
            const file=fs.readdirSync(full).find(x=>x.endsWith('.json'));
            if(!file) continue;
            const d=JSON.parse(fs.readFileSync(path.join(full,file),'utf8'));
            const cp=name=>d.checkpoints.find(x=>x.boss===name)||null;
            const red=cp('Red');
            rows.push({
              allocator:d.assumptions.expAllocator,
              grindBudget:d.ledger.grindBudget,
              score:d.performance.score,
              bottom5:d.performance.bottom5BossWinRate,
              geometric:d.performance.storyClearGeometricScore,
              coverage:d.performance.storyClearCoverageScore,
              totalExpectedGrindBattles:d.ledger.totalExpectedGrindBattles,
              grindAllocatedByKey:d.ledger.grindAllocatedByKey,
              finalLevels:d.finalLevels,
              finalTeam:d.finalTeam,
              Clair:cp('Clair'),
              Lance:cp('Lance'),
              Blue:cp('Blue'),
              Red:red,
            });
          }
          rows.sort((a,b)=>a.allocator.localeCompare(b.allocator)||a.grindBudget-b.grindBudget);
          fs.writeFileSync('red-breakpoint-summary.json',JSON.stringify({schemaVersion:1,rows},null,2));
          const md=[
            '# Route EXP Red breakpoint sweep',
            '',
            '| allocator | grind | score | coverage | Lance | Blue | Red | Red faints | grind battles |',
            '|---|---:|---:|---:|---:|---:|---:|---:|---:|',
            ...rows.map(r=>`| ${r.allocator} | ${r.grindBudget} | ${r.score.toFixed(4)} | ${r.coverage.toFixed(4)} | ${(r.Lance?.winRate||0).toFixed(4)} | ${(r.Blue?.winRate||0).toFixed(4)} | ${(r.Red?.winRate||0).toFixed(4)} | ${(r.Red?.averageOpponentFaints||0).toFixed(3)} | ${r.totalExpectedGrindBattles ?? 'n/a'} |`),
          ].join('\n');
          fs.writeFileSync('red-breakpoint-summary.md',md);
          console.log(md);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: red-breakpoint-comparison
          path: |
            red-breakpoint-summary.json
            red-breakpoint-summary.md
          if-no-files-found: error
