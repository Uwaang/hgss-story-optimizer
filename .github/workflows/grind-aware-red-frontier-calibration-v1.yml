name: grind-aware-red-frontier-calibration-v1

on:
  push:
    branches:
      - exp/grind-aware-red-frontier-v1

permissions:
  contents: read

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[red-frontier-calibration-v1]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/cli.mjs
      - id: matrix
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('results/red-frontier/calibration-v1.json','utf8'));
          if(rows.length!==13) throw new Error('expected 13 calibration states, got '+rows.length);
          console.log('matrix='+JSON.stringify(Array.from({length:rows.length},(_,i)=>i)));
          NODE

  red:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HGSS_FETCH_ATTEMPTS: 6
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate Red25 and Red50 from reused story plan
        run: |
          mkdir -p results/red-frontier/calibration
          node - "${{ matrix.state }}" <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const ordinal=Number(process.argv[2]);
          const rows=JSON.parse(fs.readFileSync('results/red-frontier/calibration-v1.json','utf8'));
          const state=rows[ordinal];
          if(!state) throw new Error('missing calibration state '+ordinal);
          const plan64=Buffer.from(JSON.stringify(state.storyPlan),'utf8').toString('base64');
          const args=[
            'src/cli.mjs','route-exp-practical-grind',
            '--version=HEARTGOLD','--starter=Cyndaquil',
            '--evolution-policy=trade-aware',
            '--team-keys='+state.teamKeys.join(','),
            '--exp-profile=normal-route','--exp-allocator='+state.allocator,
            '--entry-level=expected','--same-stage-join=map-order',
            '--resources=all','--spend-policy=natural',
            '--story-targets=0.5','--red-targets=0.25,0.5',
            '--repair-mode=global-only','--lean-repair=true',
            '--screen-runs=1','--verify-runs=2','--repair-runs=4','--final-runs=8',
            '--max-repair-rounds=16',
            '--reuse-story-plan-base64='+plan64,
          ];
          const started=Date.now();
          const p=cp.spawnSync(process.execPath,args,{
            cwd:process.cwd(),encoding:'utf8',env:process.env,
            maxBuffer:32*1024*1024,timeout:110*60*1000
          });
          const elapsedSeconds=Math.round((Date.now()-started)/1000);
          const out={
            ordinal,index:state.index,allocator:state.allocator,
            storyGrindBattles:state.storyGrindBattles,
            teamKeys:state.teamKeys,sources:state.sources,elapsedSeconds
          };
          if(p.status!==0){
            out.error=(p.stderr||p.stdout||'unknown failure').slice(-8000);
          }else{
            try{
              const d=JSON.parse(p.stdout);
              const s=d.storyFrontier?.[0]||{};
              out.repairConverged=Boolean(s.repairConverged);
              out.reusedStoryPlan=Boolean(s.reusedStoryPlan);
              out.storyWorstBossWinRate=Number(s.storyWorstBossWinRate||0);
              out.redBaseline=s.redBaseline||null;
              out.redFrontier=s.redFrontier||[];
              out.evaluationCacheEntries=Number(d.evaluationCacheEntries||0);
            }catch(e){
              out.error='JSON parse: '+e.message;
            }
          }
          fs.writeFileSync(
            'results/red-frontier/calibration/state-'+ordinal+'.json',
            JSON.stringify(out,null,2)
          );
          console.log(JSON.stringify({
            ordinal,index:out.index,allocator:out.allocator,
            story:out.storyGrindBattles,elapsedSeconds,
            repairConverged:out.repairConverged??false,
            red:out.redFrontier?.map(x=>({
              target:x.targetWinRate,total:x.totalGrindBattles,
              additional:x.additionalRedGrindBattles,achieved:x.achievedWinRate
            }))||[],
            error:Boolean(out.error)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-frontier-calibration-v1-${{ matrix.state }}
          path: hgss_story_sim/results/red-frontier/calibration/state-${{ matrix.state }}.json
          if-no-files-found: error

  summarize:
    needs: red
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: red-frontier-calibration-v1-*
          path: hgss_story_sim/results/red-frontier/calibration-all
          merge-multiple: true
      - name: Summarize calibration
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='results/red-frontier/calibration-all';
          const rows=fs.readdirSync(dir).filter(x=>/^state-\d+\.json$/.test(x))
            .map(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')))
            .sort((a,b)=>a.ordinal-b.ordinal);
          const ok=rows.filter(r=>!r.error&&r.repairConverged&&r.redFrontier?.length);
          const summary={
            schemaVersion:1,expectedStates:13,observedStates:rows.length,
            successfulStates:ok.length,errorStates:rows.filter(r=>r.error).length,
            storyPlanRejectedStates:rows.filter(r=>!r.error&&!r.repairConverged).length,
            rows
          };
          fs.writeFileSync('results/red-frontier/calibration-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: red-frontier-calibration-v1-summary
          path: hgss_story_sim/results/red-frontier/calibration-summary.json
          if-no-files-found: error
