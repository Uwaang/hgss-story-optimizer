name: joint-route-build-ab-v1

on:
  push:
    branches:
      - fix/joint-route-build-v1

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[joint-route-build-ab-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HGSS_FETCH_ATTEMPTS: 10
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Static and focused smoke checks
        run: |
          node --check src/cli.mjs
          node --check src/battle.mjs
          npm run move-score-smoke
          npm run route-smoke

      - name: Download legacy idx30 saturation 100-run state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37755171480
          name: red-frontier-highsample-reprice-v1-state-1
          path: hgss_story_sim/results/joint-route-build-ab-v1/source

      - name: Reprice idx30 saturation with joint route build
        run: |
          mkdir -p results/joint-route-build-ab-v1
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const dir='results/joint-route-build-ab-v1/source';
          const sourceFile=fs.readdirSync(dir).find(f=>f.endsWith('.json'));
          if(!sourceFile) throw new Error('source state not found');
          const old=JSON.parse(fs.readFileSync(path.join(dir,sourceFile),'utf8'));
          if(Number(old.index)!==30 || old.allocator!=='boss-aware-saturation') {
            throw new Error('unexpected source '+JSON.stringify({index:old.index,allocator:old.allocator}));
          }

          const args=[
            'src/cli.mjs','route-exp-practical-grind',
            '--version=HEARTGOLD','--starter=Cyndaquil',
            '--evolution-policy=trade-aware',
            '--team-keys='+old.teamKeys.join(','),
            '--exp-profile=normal-route','--exp-allocator=boss-aware-saturation',
            '--entry-level=expected','--same-stage-join=map-order',
            '--resources=all','--spend-policy=natural',
            '--story-targets=0.5','--red-targets=0.25,0.5',
            '--repair-mode=global-only','--lean-repair=true',
            '--screen-runs=8','--verify-runs=16','--repair-runs=32','--final-runs=100',
            '--max-repair-rounds=24'
          ];

          const started=Date.now();
          const p=cp.spawnSync(process.execPath,args,{
            cwd:process.cwd(),encoding:'utf8',env:process.env,
            maxBuffer:128*1024*1024,timeout:350*60*1000
          });
          if(p.status!==0) throw new Error((p.stderr||p.stdout||'unknown failure').slice(-20000));
          const data=JSON.parse(p.stdout);
          const s=data.storyFrontier?.[0];
          if(!s) throw new Error('story frontier missing');
          const r25=s.redFrontier?.find(x=>Number(x.targetWinRate)===0.25);
          const r50=s.redFrontier?.find(x=>Number(x.targetWinRate)===0.5);
          const result={
            schemaVersion:1,
            elapsedSeconds:Math.round((Date.now()-started)/1000),
            old:{
              story:Number(old.storyGrindBattles),
              red25:Number(old.redFrontier?.find(x=>Number(x.targetWinRate)===0.25)?.totalGrindBattles),
              red50:Number(old.redFrontier?.find(x=>Number(x.targetWinRate)===0.5)?.totalGrindBattles),
            },
            joint:{
              story:Number(s.storyGrindBattles),
              red25:Number(r25?.totalGrindBattles),
              red50:Number(r50?.totalGrindBattles),
              storyWorstBossWinRate:Number(s.storyWorstBossWinRate),
              repairConverged:Boolean(s.repairConverged),
              repairRounds:Number(s.repairRounds||0),
            },
            teamKeys:old.teamKeys,
            storyRouteBuildPlan:s.routeBuildPlan||{},
            red25PlayerBuilds:r25?.playerBuilds||{},
            red25RouteBuildPlan:r25?.routeBuildPlan||{},
            red50PlayerBuilds:r50?.playerBuilds||{},
            red50RouteBuildPlan:r50?.routeBuildPlan||{},
            raw:data
          };
          fs.writeFileSync('results/joint-route-build-ab-v1/result.json',JSON.stringify(result,null,2));

          function slimBuilds(builds){
            return Object.fromEntries(Object.entries(builds||{}).map(([key,b])=>[
              b.species||key,
              {nature:b.nature,item:b.item,moves:b.moves,evs:b.evs}
            ]));
          }
          function slimPlan(plan){
            return Object.fromEntries(Object.entries(plan||{}).map(([key,b])=>[
              key,
              {
                nature:b.nature,evSpread:b.evSpread,abilitySlot:b.abilitySlot,
                routeMoves:b.routeMoves,
                jointOptimization:b.jointOptimization
              }
            ]));
          }
          console.log(JSON.stringify({
            old:result.old,
            joint:result.joint,
            storyPlan:slimPlan(result.storyRouteBuildPlan),
            red25Builds:slimBuilds(result.red25PlayerBuilds),
            red50Builds:slimBuilds(result.red50PlayerBuilds),
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: joint-route-build-ab-v1
          path: hgss_story_sim/results/joint-route-build-ab-v1/result.json
          if-no-files-found: error
