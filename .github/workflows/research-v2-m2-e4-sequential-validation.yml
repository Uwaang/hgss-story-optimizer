name: research-v2-m2-e4-sequential-validation

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-m2-e4-validation]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: first-staged-fallback
            command: e4-sequential-compare
            chain: first
            team_preset: staged-fallback
            level: ""
          - label: second-staged-fallback
            command: e4-sequential-rematch-compare
            chain: second
            team_preset: staged-fallback
            level: "57"
          - label: second-scheduler-d-quagsire
            command: e4-sequential-rematch-compare
            chain: second
            team_preset: d-quagsire
            level: "57"
          - label: second-coordinate-best
            command: e4-sequential-rematch-compare
            chain: second
            team_preset: ""
            level: "57"
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Aipom::Aipom->Ambipom#1,Rhyhorn::Rhyhorn->Rhyperior#1,Horsea::Seadra->Kingdra#1,Ditto::Ditto->Ditto#1,Wynaut::Wobbuffet->Wobbuffet#1"

    defaults:
      run:
        working-directory: hgss_story_sim

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smokes
        run: |
          node src/cli.mjs trainer-ai-smoke
          node src/cli.mjs exp-scheduler-v1-smoke
          node src/cli.mjs evolution-checkpoint-smoke
      - name: Sequential E4 validation
        env:
          LABEL: ${{ matrix.label }}
          COMMAND: ${{ matrix.command }}
          CHAIN: ${{ matrix.chain }}
          TEAM_PRESET: ${{ matrix.team_preset }}
          TEAM_KEYS: ${{ matrix.team_keys }}
          LEVEL: ${{ matrix.level }}
        run: |
          set -euo pipefail
          mkdir -p results/m2-validation
          args=(src/cli.mjs "$COMMAND" --runs=128)
          if [[ "$COMMAND" == "e4-sequential-compare" ]]; then
            args+=(--chain="$CHAIN")
          fi
          if [[ -n "$LEVEL" ]]; then
            args+=(--level="$LEVEL")
          fi
          if [[ -n "${TEAM_KEYS:-}" ]]; then
            args+=(--team-keys="$TEAM_KEYS")
          else
            args+=(--team-preset="$TEAM_PRESET")
          fi
          node "${args[@]}" > "results/m2-validation/${LABEL}.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const label=process.env.LABEL;
          const d=JSON.parse(fs.readFileSync('results/m2-validation/'+label+'.json','utf8'));
          console.log(JSON.stringify({
            label,
            team:d.team,
            runs:d.runs,
            commonEntryLevel:d.commonEntryLevel??null,
            independentProduct:d.independent.productWinRate,
            sequentialClearRate:d.sequential.clearRate,
            delta:d.deltaClearRate,
            consumedItems:d.sequential.consumedItems||{},
            bosses:d.sequential.rows.map(r=>({
              boss:r.boss,
              reached:r.reached,
              cleared:r.cleared,
              conditionalWinRate:r.conditionalWinRate,
              failedAt:r.failedAt,
              levelRangeByMember:r.levelRangeByMember||null
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-validation-${{ matrix.label }}
          path: hgss_story_sim/results/m2-validation/${{ matrix.label }}.json
          if-no-files-found: error

  summarize:
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m2-e4-validation-*
          path: hgss_story_sim/results/m2-validation
          merge-multiple: true
      - name: Summarize
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='results/m2-validation';
          const rows=fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort().map(file=>{
            const d=JSON.parse(fs.readFileSync(dir+'/'+file,'utf8'));
            return {
              label:file.replace(/\.json$/,''),
              team:d.team,
              commonEntryLevel:d.commonEntryLevel??null,
              independentProduct:d.independent.productWinRate,
              sequentialClearRate:d.sequential.clearRate,
              delta:d.deltaClearRate,
              consumedItems:d.sequential.consumedItems||{},
              bosses:d.sequential.rows.map(r=>({
                boss:r.boss,
                conditionalWinRate:r.conditionalWinRate,
                reached:r.reached,
                cleared:r.cleared,
                levelRangeByMember:r.levelRangeByMember||null
              }))
            };
          });
          const out={schemaVersion:1,purpose:'SCRUM-422 sequential E4 validation',rows};
          fs.writeFileSync(dir+'/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-validation-summary
          path: hgss_story_sim/results/m2-validation/summary.json
          if-no-files-found: error
