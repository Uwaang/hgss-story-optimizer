name: deheuristic-route-risk-v1

on:
  push:
    branches:
      - exp/deheuristic-route-risk-v1

concurrency:
  group: deheuristic-route-risk-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route_risk_search:
    if: contains(github.event.head_commit.message, '[deheuristic-route-risk]')
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: |
          node --check src/cli.mjs
          node --check src/exp-budget.mjs
      - name: Run threshold-free route-risk search
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-search \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk \
            --route-grind-proxy=false \
            --screen-runs=1 --runs=2 --final-runs=16 \
            --candidate-cap=36 --beam-width=8 \
            > results/deheuristic-route-risk-v1.json
      - name: Assert threshold-free semantics
        run: |
          jq -e '
            .objective == "route-risk" and
            .assumptions.objective == "route-risk" and
            .assumptions.routeGrindProxy == false and
            .assumptions.candidateCap == 36 and
            .assumptions.beamWidth == 8 and
            (.top | length) >= 1 and
            ([.top[].teamKeys | length] | all(. == 6))
          ' results/deheuristic-route-risk-v1.json >/dev/null
      - name: Summarize selection and reference recall
        run: |
          jq '
            [
              "Cyndaquil::Cyndaquil->Typhlosion#1",
              "Geodude::Geodude->Golem#1",
              "Slowpoke::Slowpoke->Slowbro#1",
              "Pineco::Pineco->Forretress#1",
              "Mareep::Mareep->Ampharos#1",
              "Rhyhorn::Rhyhorn->Rhyperior#1",
              "Magnemite::Magnemite->Magneton#1",
              "Abra::Abra->Alakazam#1",
              "Wooper::Quagsire->Quagsire#1",
              "Magikarp::Magikarp->Gyarados#1",
              "Gastly::Gastly->Gengar#1",
              "Larvitar::Pupitar->Tyranitar#1",
              "Lapras::Lapras->Lapras#1",
              "Chinchou::Lanturn->Lanturn#1",
              "Horsea::Horsea->Kingdra#1"
            ] as $required |
            [.selectedCandidateDetails[].searchKey] as $keys |
            {
              objective,
              screenedCandidates,
              evaluatedTeams,
              finalRescoredTeams,
              referenceRecall: {
                present: [$required[] as $k | select(($keys | index($k)) != null) | $k],
                missing: [$required[] as $k | select(($keys | index($k)) == null) | $k]
              },
              paretoFront: [
                .paretoFront[] | {
                  team,
                  teamKeys,
                  storyClearGeometricScore,
                  score,
                  expBurden
                }
              ],
              top: [
                .top[] | {
                  team,
                  teamKeys,
                  storyClearGeometricScore,
                  score,
                  worstBossWinRate,
                  bottom5BossWinRate,
                  storyClearCoverageScore
                }
              ]
            }
          ' results/deheuristic-route-risk-v1.json |
            tee results/deheuristic-route-risk-v1-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deheuristic-route-risk-v1
          path: |
            hgss_story_sim/results/deheuristic-route-risk-v1.json
            hgss_story_sim/results/deheuristic-route-risk-v1-summary.json
          if-no-files-found: warn
