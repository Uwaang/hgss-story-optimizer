          name: research-v2-coordinate-final100-${{ matrix.shard }}
          path: hgss_story_sim/results/final/final100-${{ matrix.shard }}.json
          if-no-files-found: error

  summarize:
    needs: final100
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-coordinate-endpoints
          path: hgss_story_sim/results/input
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-coordinate-final100-*
          path: hgss_story_sim/results/final
          merge-multiple: true
      - name: Merge independent coordinate endpoints
        run: |
          INPUTS="$(find results/final -name 'final100-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-rescore-merge \
            --input=results/input/checkpoint.json --inputs="$INPUTS" --runs=100 \
            $SEARCH_ARGS > results/coordinate-final100.json
          jq '{
            finalRescoredTeams,
            paretoFront:[.paretoFront[]|{
              teamKeys,
              retry:.routeExpectedRetryFailures,
              geometric:.routeRiskGeometricScore,
              mean:.routeRiskMeanWinRate,
              grindBattles:.routeGrindProxy.expectedBattles,
              grindExp:.routeGrindProxy.cumulativeGrindExp
            }],
            top:[.top[:16][]|{
              teamKeys,
              retry:.routeExpectedRetryFailures,
              geometric:.routeRiskGeometricScore,
              mean:.routeRiskMeanWinRate,
              grindBattles:.routeGrindProxy.expectedBattles,
              grindExp:.routeGrindProxy.cumulativeGrindExp
            }]
          }' results/coordinate-final100.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-independent-coordinate-crosscheck-v1-final100
          path: hgss_story_sim/results/coordinate-final100.json
          if-no-files-found: error
