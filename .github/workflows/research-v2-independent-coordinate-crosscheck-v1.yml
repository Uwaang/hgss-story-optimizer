          mkdir -p results/final
          node src/cli.mjs route-exp-story-rescore-shard \
            --input=results/input/checkpoint.json --runs=100 \
            --shard-count=16 --shard-index=${{ matrix.shard }} \
            $SEARCH_ARGS > "results/final/final100-${{ matrix.shard }}.json"
