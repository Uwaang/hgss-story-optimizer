      step: 0
      next_step: 1
      shards: ${{ needs.init.outputs.shards }}
      args: >-
        --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25 --recheck-runs=40

