name: grind-plan-chain-v1

# CHARTER.md grind plan builder for one team, run to the stop rule (no
# nondominated plan left that improved retries or level CV over its parent)
# or 30 more steps. Every step leaves its state in artifact gp-step-<n>; the
# last one holds the final state and summary.json.
#
# Resume: set RESUME_RUN_ID / RESUME_ARTIFACT to a previous run's saved step
# artifact (gp-step-<n>). With RESUME_MERGE_STEP=<n> the shard outputs that
# run already produced for that step (gp-out-<n>-*) are merged first;
# otherwise its unevaluated children are prepared again. Either way the next
# step is prepared with the current rules. Leave them empty to start from the
# no-grind plan.

on:
  push:
    branches:
      - exp/grind-plan-chain-v1

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: '6'
  NODE_OPTIONS: --max-old-space-size=12288
  # Fresh run from step 0 with the 40-run recheck (CHARTER.md 2026-10-19).
  RESUME_RUN_ID: ''
  RESUME_ARTIFACT: ''
  RESUME_MERGE_STEP: ''

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.prepare.outputs.shards }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: Download the resume state
        if: env.RESUME_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RESUME_ARTIFACT }}
          path: hgss_story_sim/results/resume
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download the resume step outputs
        if: env.RESUME_MERGE_STEP != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gp-out-${{ env.RESUME_MERGE_STEP }}-*
          path: hgss_story_sim/results/resume-outs
          merge-multiple: true
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Prepare the first step
        id: prepare
        run: |
          if [ -n "$RESUME_MERGE_STEP" ]; then
            INPUTS="$(find results/resume-outs -name 'out-*.json' -type f | sort | paste -sd, -)"
            node src/cli.mjs grind-plan-merge               --state=results/resume/state.json --pending=results/resume/pending.json               --inputs="$INPUTS" --state-out=results/resume-merged.json               --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25 --recheck-runs=40
            RESUME="--state=results/resume-merged.json"
          elif [ -n "$RESUME_RUN_ID" ]; then
            RESUME="--state=results/resume/state.json --undo-pending=results/resume/pending.json"
          else
            RESUME=""
          fi
          node src/cli.mjs grind-plan-prepare $RESUME --out-dir=results/next             --shard-count=20 --target-shard-children=600             --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25 --recheck-runs=40 | tee results/prepare.json
          echo "shards=$(jq -c .shards results/prepare.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: gp-step-0
          path: hgss_story_sim/results/next
          if-no-files-found: error

  step0:
