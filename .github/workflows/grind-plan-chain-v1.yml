name: grind-plan-chain-v1

# CHARTER.md grind plan builder for one team, run to the stop rule (no
# nondominated plan left that improved retries or level CV over its parent)
# or 30 steps. Step 0 is the no-grind plan. Every step leaves its state in
# artifact gp-step-<n>; the last one holds the final state and summary.json.

on:
  push:
    branches:
      - exp/grind-plan-chain-v1

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: '6'

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: Prepare step 0
        run: |
          node src/cli.mjs grind-plan-prepare --out-dir=results/next --shard-count=20             --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25
      - uses: actions/upload-artifact@v4
        with:
          name: gp-step-0
          path: hgss_story_sim/results/next
          if-no-files-found: error

  step0:
    needs: init
    uses: ./.github/workflows/grind-plan-step-v1.yml
    with:
      step: 0
      next_step: 1
      args: >-
        --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25

  step1:
    needs: step0
    if: needs.step0.outputs.done != 'true'
    uses: ./.github/workflows/grind-plan-step-v1.yml
    with:
      step: 1
      next_step: 2
      args: >-
        --route-profile=complete --team=Cyndaquil,Mareep,Geodude,Zubat,Lapras,Wooper --runs=8 --entry-level=expected --exp-allocator=boss-aware-soft --e4-grouped-route-risk=true --hm-policy=required --grind-policy=planned --step-battles=25

  step2:
    needs: step1
    if: needs.step1.outputs.done != 'true'
    uses: ./.github/workflows/grind-plan-step-v1.yml
    with:
