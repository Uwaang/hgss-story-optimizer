name: research-v2-size4-selective12-zero-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-size4-selective12-zero-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size4-selective-rescore-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38122401532
          github-token: ${{ github.token }}
      - name: Count zero-win rows after selective12
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=x=>[...(x||[])].sort().join('|');
          const targetKey=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1'
          ]);
          const states=[];
          for(const file of fs.readdirSync('results/shards').filter(x=>x.startsWith('selective4-')&&x.endsWith('.json'))){
            const d=JSON.parse(fs.readFileSync('results/shards/'+file,'utf8'));
            for(const r of d.rescored||[]){
              const active=(r.evaluation?.rows||[]).filter(x=>!x.skipped);
              const zeros=active.filter(x=>Number(x.wins||0)===0);
              const ones=active.filter(x=>Number(x.wins||0)===1);
              states.push({
                teamKeys:r.teamKeys,
                zeroCount:zeros.length,
                oneCount:ones.length,
                activeCount:active.length,
                zeroBosses:zeros.map(x=>String(x.boss)),
                oneBosses:ones.map(x=>String(x.boss))
              });
            }
          }
          states.sort((a,b)=>a.zeroCount-b.zeroCount);
          const counts=states.map(x=>x.zeroCount).sort((a,b)=>a-b);
          const pct=p=>counts[Math.min(counts.length-1,Math.floor((counts.length-1)*p))]??null;
          const target=states.find(x=>key(x.teamKeys)===targetKey)||null;
          const hist={};
          for(const x of counts) hist[x]=(hist[x]||0)+1;
          console.log(JSON.stringify({
            schemaVersion:1,
            states:states.length,
            totalActiveRows:states.reduce((s,x)=>s+x.activeCount,0),
            totalZeroRows:states.reduce((s,x)=>s+x.zeroCount,0),
            totalOneRows:states.reduce((s,x)=>s+x.oneCount,0),
            statesWithZero:states.filter(x=>x.zeroCount>0).length,
            zeroRowsPerState:{
              min:counts[0]??null,p25:pct(.25),median:pct(.5),p75:pct(.75),p90:pct(.9),p95:pct(.95),max:counts.at(-1)??null
            },
            histogram:hist,
            target
          },null,2));
          NODE
