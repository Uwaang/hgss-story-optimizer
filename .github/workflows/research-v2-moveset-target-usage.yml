name: research-v2-moveset-target-usage

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  usage:
    if: contains(github.event.head_commit.message, '[research-v2-target-usage]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Tyranitar target usage
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-target-usage --level=50 --runs=20 --target=Tyranitar \
            > results/research-v2/tyranitar-target-usage.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/tyranitar-target-usage.json','utf8'));
          console.log(JSON.stringify({
            target:r.assumptions.target,
            targetBuild:r.targetBuild,
            targetUsage:r.targetUsage,
            routeRisk:r.routeRisk,
            activeBossRows:r.activeBossRows
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-tyranitar-target-usage
          path: hgss_story_sim/results/research-v2/tyranitar-target-usage.json
          if-no-files-found: error
