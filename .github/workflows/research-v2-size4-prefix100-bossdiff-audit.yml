name: research-v2-size4-prefix100-bossdiff-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-size4-prefix100-bossdiff]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-prefix100-summary
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 38126034160
          github-token: ${{ github.token }}
      - name: Compare idx30 against best non-target at 100 runs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('results/input/summary.json','utf8'));
          const key=x=>[...(x||[])].sort().join('|');
          const targetKey=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1'
          ]);
          const target=(d.beam||[]).find(r=>key(r.teamKeys)===targetKey);
          const control=(d.beam||[]).find(r=>key(r.teamKeys)!==targetKey);
          function p(r){return (Number(r.wins||0)+1)/(Number(r.wins||0)+Number(r.losses||0)+Number(r.ties||0)+2)}
          function retry(r){const q=p(r);return (1-q)/q}
          const tm=new Map((target?.evaluation?.rows||[]).filter(r=>!r.skipped).map(r=>[String(r.boss),r]));
          const diffs=[];
          for(const cr of (control?.evaluation?.rows||[]).filter(r=>!r.skipped)){
            const tr=tm.get(String(cr.boss)); if(!tr) continue;
            diffs.push({
              boss:String(cr.boss),
              controlWins:cr.wins,targetWins:tr.wins,
              controlRuns:cr.runs,targetRuns:tr.runs,
              controlRetry:retry(cr),targetRetry:retry(tr),
              targetMinusControl:retry(tr)-retry(cr),
              controlProgress:Number(cr.battleProgressScore??0),
              targetProgress:Number(tr.battleProgressScore??0)
            });
          }
          const byAbs=[...diffs].sort((a,b)=>Math.abs(b.targetMinusControl)-Math.abs(a.targetMinusControl));
          const targetAdvantages=[...diffs].sort((a,b)=>a.targetMinusControl-b.targetMinusControl);
          const targetDisadvantages=[...diffs].sort((a,b)=>b.targetMinusControl-a.targetMinusControl);
          console.log(JSON.stringify({
            schemaVersion:1,
            targetKeys:target?.teamKeys,
            controlKeys:control?.teamKeys,
            largestAbsolute:byAbs.slice(0,12),
            targetAdvantages:targetAdvantages.slice(0,10),
            targetDisadvantages:targetDisadvantages.slice(0,10)
          },null,2));
          NODE
