name: complete-route-beam4-highsample-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  beam4_shard:
    if: contains(github.event.head_commit.message, '[beam4-highsample-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HGSS_BATTLE_CACHE_PATH: results/battle-cache-4-${{ matrix.shard }}.json
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: staged-beam3-merge
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37049242398
          github-token: ${{ github.token }}
      - name: Seed cache from original beam3
        run: cp results/input/battle-cache-merged.json "results/battle-cache-4-${{ matrix.shard }}.json"
      - name: Re-evaluate all beam4 expansions at 16 runs
        run: |
          node src/cli.mjs route-exp-story-beam-shard \
            --input=results/input/checkpoint.json \
            --target-size=4 --runs=16 \
            --shard-count=6 --shard-index=${{ matrix.shard }} \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > "results/beam-4-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: highsample-beam4-shard-${{ matrix.shard }}
          path: |
            hgss_story_sim/results/beam-4-shard-${{ matrix.shard }}.json
            hgss_story_sim/results/battle-cache-4-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: beam4_shard
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HGSS_BATTLE_CACHE_PATH: results/battle-cache-merged.json
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: staged-beam3-merge
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37049242398
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: highsample-beam4-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
      - name: Merge caches
        run: |
          CACHES="$(find results/shards -name 'battle-cache-4-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs battle-cache-merge --inputs="$CACHES" --output=results/battle-cache-merged.json
      - name: Merge high-sample beam4
        run: |
          SHARDS="$(find results/shards -name 'beam-4-shard-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-beam-merge \
            --input=results/input/checkpoint.json --inputs="$SHARDS" \
            --target-size=4 --runs=16 \
            --beam-width=24 --adaptive-runs=32 \
            --adaptive-confidence-z=1.96 --adaptive-challenger-cap=48 \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/checkpoint.json
      - name: Diagnose N04 recall
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=JSON.parse(fs.readFileSync('results/checkpoint.json','utf8'));
          const target=new Set([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1',
            'Chinchou::Lanturn->Lanturn#1',
            'Sneasel::Sneasel->Sneasel#1',
          ]);
          const compat=(cp.beam||[]).filter(row=>row.teamKeys.every(k=>target.has(k)));
          const out={
            timing:cp.timings?.at(-1)||null,
            beamCount:(cp.beam||[]).length,
            n04CompatibleCount:compat.length,
            n04Compatible:compat,
            top:(cp.beam||[]).slice(0,10).map(r=>({
              teamKeys:r.teamKeys,
              retry:r.routeExpectedRetryFailures,
              geometric:r.routeRiskGeometricScore,
              mean:r.routeRiskMeanWinRate,
            })),
          };
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-beam4-highsample-v1
          path: |
            hgss_story_sim/results/checkpoint.json
            hgss_story_sim/results/summary.json
            hgss_story_sim/results/battle-cache-merged.json
          if-no-files-found: error
