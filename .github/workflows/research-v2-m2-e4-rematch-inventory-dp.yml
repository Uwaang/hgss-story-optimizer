name: research-v2-m2-e4-rematch-inventory-dp

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-m2-e4-rematch-dp]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: staged-fallback
            team_preset: staged-fallback
          - label: scheduler-d-quagsire
            team_preset: d-quagsire
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Rematch E4 inventory DP validation
        env:
          LABEL: ${{ matrix.label }}
          TEAM_PRESET: ${{ matrix.team_preset }}
        run: |
          mkdir -p results/m2-dp
          node src/cli.mjs e4-sequential-compare             --chain=second             --team-preset="$TEAM_PRESET"             --runs=500             > "results/m2-dp/${LABEL}.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const label=process.env.LABEL;
          const d=JSON.parse(fs.readFileSync('results/m2-dp/'+label+'.json','utf8'));
          console.log(JSON.stringify({
            label,
            team:d.team,
            runs:d.runs,
            legacyIndependentProduct:d.independent.productWinRate,
            freshInventoryMarginalProduct:d.policyMarginal.productWinRate,
            inventoryDp:d.inventoryDp,
            literalSequential:{
              clears:d.sequential.clears,
              clearRate:d.sequential.clearRate,
              rows:d.sequential.rows
            }
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-rematch-dp-${{ matrix.label }}
          path: hgss_story_sim/results/m2-dp/${{ matrix.label }}.json
          if-no-files-found: error

  summarize:
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m2-e4-rematch-dp-*
          path: hgss_story_sim/results/m2-dp
          merge-multiple: true
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='results/m2-dp';
          const rows=fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort().map(file=>{
            const d=JSON.parse(fs.readFileSync(dir+'/'+file,'utf8'));
            return {
              label:file.replace(/\.json$/,''),
              team:d.team,
              runs:d.runs,
              legacyIndependentProduct:d.independent.productWinRate,
              freshInventoryMarginalProduct:d.policyMarginal.productWinRate,
              inventoryDpClear:d.inventoryDp?.clearProbability ?? null,
              literalSequentialClear:d.sequential.clearRate,
              literalSequentialClears:d.sequential.clears,
              dpTransitions:d.inventoryDp?.transitions ?? []
            };
          });
          fs.writeFileSync(dir+'/summary.json',JSON.stringify({schemaVersion:1,rows},null,2));
          console.log(JSON.stringify({rows},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-rematch-dp-summary
          path: hgss_story_sim/results/m2-dp/summary.json
          if-no-files-found: error
