name: staged-fingerprint-smoke-v1

on:
  push:
    branches:
      - infra/staged-route-search-v2

permissions:
  contents: read
  actions: read

jobs:
  fingerprint-smoke:
    if: contains(github.event.head_commit.message, '[fingerprint-smoke-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEARCH_ARGS: >-
        --version=HEARTGOLD --starter=Cyndaquil
        --evolution-policy=trade-aware
        --exp-profile=normal-route --grind-policy=none
        --exp-allocator=boss-aware-soft
        --entry-level=expected --same-stage-join=map-order
        --resources=all --spend-policy=natural
        --objective=route-risk --route-grind-proxy=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: hgss_story_sim

      - uses: actions/download-artifact@v4
        with:
          name: staged-beam5-merge
          path: hgss_story_sim/results/source
          repository: ${{ github.repository }}
          run-id: 36968404654
          github-token: ${{ github.token }}

      - name: Positive legacy stamp
        working-directory: hgss_story_sim
        run: |
          node src/cli.mjs route-exp-story-stamp-checkpoint \
            --input=results/source/checkpoint.json \
            --allow-legacy=true \
            $SEARCH_ARGS \
            > results/stamped.json
          test -n "$(jq -r '.fingerprint' results/stamped.json)"
          test "$(jq -r '.compatibility.stampedFromLegacy' results/stamped.json)" = "true"

      - name: Reject mismatched legacy config
        working-directory: hgss_story_sim
        shell: bash
        run: |
          set +e
          node src/cli.mjs route-exp-story-stamp-checkpoint \
            --input=results/source/checkpoint.json \
            --allow-legacy=true \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/should-not-exist.json 2> results/legacy-mismatch.log
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "legacy staged checkpoint config mismatch" results/legacy-mismatch.log

      - name: Reject mismatched stamped fingerprint before expansion
        working-directory: hgss_story_sim
        shell: bash
        run: |
          set +e
          node src/cli.mjs route-exp-story-beam-shard \
            --input=results/stamped.json \
            --target-size=6 --runs=2 --shard-count=3 --shard-index=0 \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/should-not-expand.json 2> results/fingerprint-mismatch.log
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "staged checkpoint fingerprint mismatch" results/fingerprint-mismatch.log
