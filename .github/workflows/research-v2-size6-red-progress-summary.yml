name: research-v2-size6-red-progress-summary

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    if: contains(github.event.head_commit.message, '[research-v2-size6-red-progress-summary]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size6-sixth-usage-*
          path: hgss_story_sim/results/audit
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38141036712
          github-token: ${{ github.token }}
      - name: Summarize Red progress and burden
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=fs.readdirSync('results/audit').filter(x=>x.startsWith('usage-')&&x.endsWith('.json'));
          const rows=[];
          for(const file of files){
            const d=JSON.parse(fs.readFileSync('results/audit/'+file,'utf8'));
            const name=file.replace(/^usage-/,'').replace(/\.json$/,'');
            const red=(d.evaluation?.rows||[]).find(r=>String(r.boss)==='Red')||null;
            const coreKeys=new Set([
              'Cyndaquil::Cyndaquil->Typhlosion#1',
              'Abra::Abra->Alakazam#1',
              'Rhyhorn::Rhyhorn->Rhyperior#1',
              'Lapras::Lapras->Lapras#1',
              'Zubat::Golbat->Crobat#1'
            ]);
            const extra=(d.teamKeys||[]).find(k=>!coreKeys.has(k))||null;
            const u=extra?d.evaluation?.memberUsage?.[extra]:null;
            rows.push({
              name,
              teamSize:(d.teamKeys||[]).length,
              retry:d.metrics?.retry,
              geometric:d.metrics?.geometric,
              mean:d.metrics?.mean,
              routeProgress:d.metrics?.progress,
              extraKey:extra,
              extraSpecies:u?.species||null,
              finalSpecies: extra ? Object.keys(d.evaluation?.finalLevels||{}).find(s=>!['Rhyperior','Alakazam','Typhlosion','Lapras','Crobat'].includes(s))||null : null,
              extraFinalLevel: extra ? Object.entries(d.evaluation?.finalLevels||{}).find(([s])=>!['Rhyperior','Alakazam','Typhlosion','Lapras','Crobat'].includes(s))?.[1]??null : null,
              bossesAvailable:u?.bossesAvailable??0,
              bossesUsed:u?.bossesUsed??0,
              runsUsed:u?.runsUsed??0,
              activeTurns:u?.activeTurns??0,
              winningRunsUsed:u?.winningRunsUsed??0,
              red:red?{
                wins:red.wins,losses:red.losses,ties:red.ties,winRate:red.winRate,
                battleProgressScore:red.battleProgressScore,
                averageOpponentFaints:red.averageOpponentFaints,
                averageP1Faints:red.averageP1Faints,
                availableMons:red.availableMons,
                playerLevels:red.playerLevels,
                extraUsage:extra?(red.p1Usage?.[extra]||null):null
              }:null,
              catchUpExp:d.evaluation?.catchUpExp??null,
              captureExpectedEncounters:d.evaluation?.captureSearch?.expectedEncounters??null
            });
          }
          rows.sort((a,b)=>
            Number(b.red?.battleProgressScore||0)-Number(a.red?.battleProgressScore||0) ||
            Number(a.catchUpExp??Infinity)-Number(b.catchUpExp??Infinity) ||
            String(a.name).localeCompare(String(b.name))
          );
          console.log(JSON.stringify({schemaVersion:1,rows},null,2));
          NODE
