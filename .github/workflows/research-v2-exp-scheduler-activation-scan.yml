name: research-v2-exp-scheduler-activation-scan
# SCRUM-417 activation-checkpoint shortlist validation

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  activation-scan:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Scheduler recipient-state smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: D+Quagsire activation shortlist 20-run
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs exp-scheduler-v1-activation-scan \
            --runs=20 --target=Quagsire --route-grind-proxy-target=0.5 \
            --activation-labels="always-active,activate-Lance,activate-Blue,activate-Red" \
            > results/research-v2/exp-scheduler-v1-activation-shortlist20.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/exp-scheduler-v1-activation-shortlist20.json','utf8'));
          const slim = row => ({
            label: row.label,
            activationBoss: row.activationBoss,
            retry: row.expectedRetryFailures,
            geometric: row.geometricScore,
            mean: row.meanWinRate,
            progress: row.battleProgressScore,
            grindProxyBattles: row.grindProxyBattles,
            targetFinalLevel: row.targetFinalLevel,
            targetUseRate: row.targetUsage?.useRate ?? null,
            targetWinningUseRate: row.targetUsage?.winningUseRate ?? null
          });
          console.log(JSON.stringify({
            assumptions:r.assumptions,
            pareto:r.pareto.map(slim),
            allRows:r.allRows.map(slim)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-activation-shortlist20
          path: hgss_story_sim/results/research-v2/exp-scheduler-v1-activation-shortlist20.json
          if-no-files-found: error
