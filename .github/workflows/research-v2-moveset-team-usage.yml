name: research-v2-moveset-team-usage

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  usage:
    if: contains(github.event.head_commit.message, '[research-v2-team-usage]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Full-team 20-run usage map
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-team-usage --level=50 --runs=20 \
            > results/research-v2/moveset-team-usage-lv50.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/moveset-team-usage-lv50.json','utf8'));
          console.log(JSON.stringify({
            routeRisk:r.routeRisk,
            members:r.members.map(x=>({
              species:x.terminalSpecies,
              build:x.build,
              usage:x.usage,
              activeBosses:x.bossRows.map(b=>({
                boss:b.boss,
                materializedSpecies:b.materializedSpecies,
                appearances:b.appearances,
                moveUses:b.moveUses,
                activeTurns:b.activeTurns,
                moveUsesByMove:b.moveUsesByMove
              }))
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-moveset-team-usage-lv50
          path: hgss_story_sim/results/research-v2/moveset-team-usage-lv50.json
          if-no-files-found: error
