name: research-v2-moveset-fourth-slot-screen

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  screen:
    if: contains(github.event.head_commit.message, '[research-v2-fourth-slot-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Fourth-slot local actual-battle screen
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-fourth-slot-screen --level=50 --runs=5 --target=Rhyperior --core="Earthquake,Stone Edge,Hammer Arm" \
            > results/research-v2/moveset-build-v2-fourth-slot-screen.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/moveset-build-v2-fourth-slot-screen.json','utf8'));
          console.log(JSON.stringify({
            baselineV1:r.baselineV1.routeMoves,
            legalMoveCount:r.legalMoveCount,
            variantCount:r.variantCount,
            top:r.rows.slice(0,10).map(x=>({
              fourth:x.fourth,
              proxyRank:x.proxyRank,
              isCurrentV1:x.isCurrentV1,
              retry:x.actual.expectedRetryFailures,
              geometric:x.actual.geometricScore,
              mean:x.actual.meanWinRate,
              progress:x.actual.battleProgressScore,
              moveUses:x.actual.targetUsage?.moveUsesByMove||{}
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-moveset-fourth-slot-screen
          path: hgss_story_sim/results/research-v2/moveset-build-v2-fourth-slot-screen.json
          if-no-files-found: error
