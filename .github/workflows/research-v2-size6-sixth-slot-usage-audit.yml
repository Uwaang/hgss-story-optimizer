name: research-v2-size6-sixth-slot-usage-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

env:
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=false

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-size6-sixth-slot-usage-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [core5, tyranitar, mismagius, xatu, steelix, rapidash, weavile]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate and summarize sixth-slot usage
        run: |
          case "${{ matrix.name }}" in
            core5) EXTRA="" ;;
            tyranitar) EXTRA=',"Larvitar::Pupitar->Tyranitar#1"' ;;
            mismagius) EXTRA=',"Misdreavus::Misdreavus->Mismagius#1"' ;;
            xatu) EXTRA=',"Natu::Natu->Xatu#1"' ;;
            steelix) EXTRA=',"Onix::Steelix->Steelix#1"' ;;
            rapidash) EXTRA=',"Ponyta::Rapidash->Rapidash#1"' ;;
            weavile) EXTRA=',"Sneasel::Sneasel->Weavile#1"' ;;
          esac
          TEAM='["Cyndaquil::Cyndaquil->Typhlosion#1","Abra::Abra->Alakazam#1","Rhyhorn::Rhyhorn->Rhyperior#1","Lapras::Lapras->Lapras#1","Zubat::Golbat->Crobat#1"'"$EXTRA"']'
          PREFIX="$(printf '%s' "$TEAM" | base64 -w0)"
          node src/cli.mjs completion-aware-explicit-evaluate \
            --prefix-base64="$PREFIX" --runs=16 \
            $SEARCH_ARGS > "results/usage-${{ matrix.name }}.json"
          node --input-type=module - "${{ matrix.name }}" <<'NODE'
          import fs from 'node:fs';
          const name=process.argv[2];
          const d=JSON.parse(fs.readFileSync('results/usage-'+name+'.json','utf8'));
          const usage=Object.fromEntries(Object.entries(d.evaluation?.memberUsage||{}).map(([k,v])=>[k,{
            species:v.species,bossesAvailable:v.bossesAvailable,bossesUsed:v.bossesUsed,
            runsAvailable:v.runsAvailable,runsUsed:v.runsUsed,useRate:v.useRate,
            appearances:v.appearances,activeTurns:v.activeTurns
          }]));
          console.log(JSON.stringify({
            name,teamKeys:d.teamKeys,metrics:d.metrics,
            finalTeam:d.evaluation?.finalTeam,finalLevels:d.evaluation?.finalLevels,
            usage,
            rows:(d.evaluation?.rows||[]).map(r=>({
              boss:r.boss,wins:r.wins,runs:r.runs,availableMons:r.availableMons,playerLevels:r.playerLevels
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size6-sixth-usage-${{ matrix.name }}
          path: hgss_story_sim/results/usage-${{ matrix.name }}.json
          if-no-files-found: error
