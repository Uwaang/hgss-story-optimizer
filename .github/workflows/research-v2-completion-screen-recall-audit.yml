name: research-v2-completion-screen-recall-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

jobs:
  screen:
    if: contains(github.event.head_commit.message, '[research-v2-screen-recall-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Screen current canonical candidate shard
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs route-exp-story-screen-shard \
            --screen-runs=2 --shard-count=4 --shard-index=${{ matrix.shard }} \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > "results/research-v2/screen-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-screen-recall-shard-${{ matrix.shard }}
          path: hgss_story_sim/results/research-v2/screen-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    if: contains(github.event.head_commit.message, '[research-v2-screen-recall-audit]')
    needs: screen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-screen-recall-shard-*
          path: hgss_story_sim/results/research-v2/screen
          merge-multiple: true
      - name: Merge candidate screen and audit completion additions
        run: |
          SHARDS="$(find results/research-v2/screen -name 'screen-shard-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-screen-merge \
            --inputs="$SHARDS" --candidate-cap=36 \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/research-v2/screen-recall-checkpoint.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('results/research-v2/screen-recall-checkpoint.json','utf8'));
          const targets=[
            'Phanpy::Donphan->Donphan#1',
            'Magikarp::Gyarados->Gyarados#1',
            'Happiny::Chansey->Blissey#1',
            'Wurmple::Wurmple->Beautifly#1'
          ];
          const selected=new Set(d.screenedKeys||[]);
          const targetRecall=targets.map(key=>({key,selected:selected.has(key)}));
          const out={
            schemaVersion:1,
            candidateCap:d.candidateCap,
            scannedCandidates:d.scannedCandidates,
            screenedCandidates:d.screenedCandidates,
            screenedCandidateFamilies:d.screenedCandidateFamilies,
            targetRecall,
            recalledCount:targetRecall.filter(x=>x.selected).length,
            screenedKeys:d.screenedKeys
          };
          fs.writeFileSync('results/research-v2/screen-recall-audit.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-completion-screen-recall-audit
          path: |
            hgss_story_sim/results/research-v2/screen-recall-checkpoint.json
            hgss_story_sim/results/research-v2/screen-recall-audit.json
          if-no-files-found: error
