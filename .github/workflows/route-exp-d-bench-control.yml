name: route-exp-d-bench-control

on:
  push:
    branches:
      - exp/d-bench-control

jobs:
  d_bench_control:
    if: contains(github.event.head_commit.message, '[d-bench-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: normal
            defer_boss: ""
          - id: until-lance1
            defer_boss: "Lance"
          - id: until-blue
            defer_boss: "Blue"
          - id: until-lance2
            defer_boss: "Lance 2"
          - id: until-red
            defer_boss: "Red"
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: |
          node --check src/cli.mjs
          node --check src/exp-budget.mjs
      - name: Run D Quagsire bench control
        env:
          DEFER_BOSS: ${{ matrix.defer_boss }}
        shell: bash
        run: |
          mkdir -p results
          EXTRA_ARGS=()
          if [[ -n "$DEFER_BOSS" ]]; then
            EXTRA_ARGS+=("--defer-exp-key=Wooper::Quagsire->Quagsire#1")
            EXTRA_ARGS+=("--defer-exp-until-boss=$DEFER_BOSS")
          fi
          node src/cli.mjs route-exp-practical-grind \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Wooper::Quagsire->Quagsire#1" \
            --exp-profile=normal-route --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --story-targets=0.5 --red-targets=0.25,0.5 \
            --story-checkpoints="Falkner,Bugsy,Whitney,Morty,Chuck,Jasmine,Pryce,Clair,Will,Koga,Bruno,Karen,Lance,Lt. Surge,Sabrina,Erika,Janine,Misty,Brock,Blaine,Blue,Will 2,Koga 2,Bruno 2,Karen 2,Lance 2" \
            --screen-runs=4 --verify-runs=32 --repair-runs=64 --final-runs=128 \
            --max-repair-rounds=20 \
            "${EXTRA_ARGS[@]}" \
            > "results/d-bench-${{ matrix.id }}.json"
      - name: Assert convergence and defer semantics
        env:
          DEFER_BOSS: ${{ matrix.defer_boss }}
        run: |
          jq -e --arg boss "$DEFER_BOSS" '
            .assumptions.globalRepair == true and
            .assumptions.finalRuns == 128 and
            .storyFrontier[0].repairConverged == true and
            .storyFrontier[0].storyWorstBossWinRate >= 0.5 and
            (if $boss == "" then
               (.assumptions.expParticipationStartBossByKey | length) == 0
             else
               .assumptions.expParticipationStartBossByKey["Wooper::Quagsire->Quagsire#1"] == $boss
             end)
          ' "results/d-bench-${{ matrix.id }}.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-bench-${{ matrix.id }}
          path: hgss_story_sim/results/d-bench-${{ matrix.id }}.json
          if-no-files-found: warn
