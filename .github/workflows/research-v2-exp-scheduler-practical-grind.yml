name: research-v2-exp-scheduler-practical-grind
# SCRUM-417 Red pricing for recipient-state shortlist

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  red-pricing:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-red]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: always-active
            activate: always-active
            story_plan_b64: eyJNb3J0eSI6Mjk2LCJXaWxsIjoxNDksIkxhbmNlIjoyNDcsIkxhbmNlIDIiOjE3MywiQnJ1bm8gMiI6M30=
          - state: lance
            activate: Lance
            story_plan_b64: eyJDbGFpciI6MjM4LCJMYW5jZSI6MjQ0LCJMYW5jZSAyIjoyNjAsIlNhYnJpbmEiOjQyLCJCcnVubyAyIjo0NX0=
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Recipient-state regression smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: Price Red 25 and 50 from converged Story50 plan
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs route-exp-practical-grind \
            --team-preset=d-quagsire \
            --recipient-target=Quagsire \
            --recipient-activate="${{ matrix.activate }}" \
            --story-targets=0.5 \
            --red-targets=0.25,0.5 \
            --reuse-story-plan-base64="${{ matrix.story_plan_b64 }}" \
            --screen-runs=2 \
            --verify-runs=8 \
            --repair-runs=16 \
            --final-runs=64 \
            --max-repair-rounds=8 \
            --repair-mode=global-only \
            --lean-repair=true \
            > results/research-v2/red-pricing-${{ matrix.state }}.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='results/research-v2/red-pricing-${{ matrix.state }}.json';
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({
            assumptions:r.assumptions,
            state:'${{ matrix.state }}',
            storyFrontier:r.storyFrontier.map(x=>({
              storyTargetWinRate:x.storyTargetWinRate,
              storyGrindBattles:x.storyGrindBattles,
              storyGrindExp:x.storyGrindExp,
              repairConverged:x.repairConverged,
              redBaseline:x.redBaseline,
              redFrontier:x.redFrontier.map(y=>({
                targetWinRate:y.targetWinRate,
                additionalRedGrindBattles:y.additionalRedGrindBattles,
                totalGrindBattles:y.totalGrindBattles,
                totalGrindExp:y.totalGrindExp,
                achievedWinRate:y.achievedWinRate,
                averageOpponentFaints:y.averageOpponentFaints,
                redGrindExp:y.redGrindExp,
                finalLevels:y.finalLevels,
                plan:y.plan
              }))
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-red-${{ matrix.state }}
          path: hgss_story_sim/results/research-v2/red-pricing-${{ matrix.state }}.json
          if-no-files-found: error
