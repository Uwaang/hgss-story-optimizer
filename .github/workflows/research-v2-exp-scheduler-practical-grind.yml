name: research-v2-exp-scheduler-practical-grind
# SCRUM-417 robust always-active Red pricing control

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  red-pricing-control:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-red-control]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Recipient-state regression smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: Re-repair Story50 then price Red25 Red50
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs route-exp-practical-grind \
            --team-preset=d-quagsire \
            --recipient-target=Quagsire \
            --recipient-activate="always-active" \
            --story-targets=0.5 \
            --red-targets=0.25,0.5 \
            --screen-runs=2 \
            --verify-runs=8 \
            --repair-runs=32 \
            --final-runs=64 \
            --max-repair-rounds=16 \
            --repair-mode=global-only \
            --lean-repair=true \
            > results/research-v2/red-pricing-always-active64.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/red-pricing-always-active64.json','utf8'));
          console.log(JSON.stringify({
            assumptions:r.assumptions,
            storyFrontier:r.storyFrontier.map(x=>({
              storyTargetWinRate:x.storyTargetWinRate,
              storyGrindBattles:x.storyGrindBattles,
              storyGrindExp:x.storyGrindExp,
              storyWorstBossWinRate:x.storyWorstBossWinRate,
              repairConverged:x.repairConverged,
              repairRounds:x.repairRounds,
              storyPlan:x.storyPlan,
              redBaseline:x.redBaseline,
              redFrontier:x.redFrontier.map(y=>({
                targetWinRate:y.targetWinRate,
                additionalRedGrindBattles:y.additionalRedGrindBattles,
                totalGrindBattles:y.totalGrindBattles,
                totalGrindExp:y.totalGrindExp,
                achievedWinRate:y.achievedWinRate,
                averageOpponentFaints:y.averageOpponentFaints,
                redGrindExp:y.redGrindExp,
                finalLevels:y.finalLevels,
                plan:y.plan
              }))
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-red-always-active64
          path: hgss_story_sim/results/research-v2/red-pricing-always-active64.json
          if-no-files-found: error
