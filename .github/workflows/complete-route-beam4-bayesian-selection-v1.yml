name: complete-route-beam4-bayesian-selection-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[beam4-bayesian-selection-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beam4-completion-aware-parents-v1
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37106088087
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: beam4-completion-aware-child-shard-*
          path: hgss_story_sim/results/children
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37106088087
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: beam4-completion-aware-recovery-child-shard-*
          path: hgss_story_sim/results/children
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37112225313
          github-token: ${{ github.token }}
      - name: Bayesian best-probability credible sets
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const parentDoc=JSON.parse(fs.readFileSync('results/input/parent-info.json','utf8'));
          const files=fs.readdirSync('results/children').filter(x=>/^beam-5-shard-\d+\.json$/.test(x));
          const map=new Map();
          for(const f of files){
            const d=JSON.parse(fs.readFileSync(path.join('results/children',f),'utf8'));
            for(const r of d.expanded||[]) map.set([...r.teamKeys].sort().join('|'),r);
          }
          const children=[...map.values()];
          if(children.length!==1150) throw new Error('expected 1150 children');

          function mulberry32(seed){
            return function(){
              let t=seed+=0x6D2B79F5;
              t=Math.imul(t^t>>>15,t|1);
              t^=t+Math.imul(t^t>>>7,t|61);
              return ((t^t>>>14)>>>0)/4294967296;
            };
          }
          function normal(rng){
            let u=0,v=0;
            while(u===0)u=rng();
            while(v===0)v=rng();
            return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
          }
          function gamma(shape,rng){
            if(shape<1) return gamma(shape+1,rng)*Math.pow(Math.max(rng(),1e-15),1/shape);
            const d=shape-1/3,c=1/Math.sqrt(9*d);
            for(;;){
              let x,v;
              do{x=normal(rng);v=1+c*x;}while(v<=0);
              v=v*v*v;
              const u=rng();
              if(u<1-0.0331*x*x*x*x) return d*v;
              if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v))) return d*v;
            }
          }
          function beta(a,b,rng){
            const x=gamma(a,rng),y=gamma(b,rng);
            return x/(x+y);
          }
          const active=e=>(e?.rows||[]).filter(r=>!r?.skipped);
          const riskPoint=e=>active(e).reduce((s,r)=>{
            const w=Number(r?.wins||0),l=Number(r?.losses||0),t=Number(r?.ties||0);
            const p=(w+1)/(w+l+t+2);
            return s+(1-p)/p;
          },0);

          const draws=2000;
          const massTarget=0.95;
          const union=new Map();
          const rows=[];
          for(let pi=0;pi<parentDoc.parents.length;pi++){
            const parent=parentDoc.parents[pi];
            const comp=children.filter(c=>parent.teamKeys.every(k=>c.teamKeys.includes(k)));
            const params=comp.map(c=>active(c.evaluation).map(r=>[
              Math.max(0,Number(r?.wins||0))+1,
              Math.max(0,Number(r?.losses||0))+Math.max(0,Number(r?.ties||0))+1
            ]));
            const wins=new Array(comp.length).fill(0);
            const rng=mulberry32((0xC0FFEE + pi*0x9E3779B1)>>>0);
            for(let d=0;d<draws;d++){
              let best=-1,bestRisk=Infinity;
              for(let ci=0;ci<comp.length;ci++){
                let risk=0;
                for(const [a,b] of params[ci]){
                  const p=Math.max(1e-12,beta(a,b,rng));
                  risk+=(1-p)/p;
                }
                if(risk<bestRisk){bestRisk=risk;best=ci;}
              }
              wins[best]++;
            }
            const ranked=comp.map((c,i)=>({
              row:c,key:[...c.teamKeys].sort().join('|'),
              probability:wins[i]/draws,pointRetry:riskPoint(c.evaluation)
            })).sort((a,b)=>b.probability-a.probability || a.pointRetry-b.pointRetry || a.key.localeCompare(b.key));
            let cum=0;
            const selected=[];
            for(const x of ranked){
              if(cum>=massTarget && selected.length) break;
              selected.push(x); cum+=x.probability;
            }
            for(const x of selected) union.set(x.key,x.row);
            rows.push({
              parentKey:parent.key,kind:parent.kind,compatibleCount:comp.length,
              selectedCount:selected.length,cumulativeBestProbability:cum,
              top:selected.slice(0,20).map(x=>({teamKeys:x.row.teamKeys,probability:x.probability,pointRetry:x.pointRetry}))
            });
          }
          const out={sourceChildren:children.length,draws,massTarget,selectedUniqueChildren:union.size,rows};
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-beam4-bayesian-selection-v1
          path: hgss_story_sim/results/summary.json
          if-no-files-found: error
