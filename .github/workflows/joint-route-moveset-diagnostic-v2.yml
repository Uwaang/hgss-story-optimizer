name: joint-route-moveset-diagnostic-v2

on:
  push:
    branches:
      - fix/joint-route-build-v1

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[joint-route-moveset-diagnostic-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: |
          node --check src/cli.mjs
          node --check src/battle.mjs
          npm run move-score-smoke
      - name: Download idx30 saturation 100-run state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37755171480
          name: red-frontier-highsample-reprice-v1-state-1
          path: hgss_story_sim/results/joint-route-moveset-diagnostic-v2/source
      - name: Replay stored plans with new moveset tie-break
        run: |
          mkdir -p results/joint-route-moveset-diagnostic-v2
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const dir='results/joint-route-moveset-diagnostic-v2/source';
          const file=fs.readdirSync(dir).find(f=>f.endsWith('.json'));
          const old=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
          const r25=old.redFrontier.find(x=>Number(x.targetWinRate)===0.25);
          const r50=old.redFrontier.find(x=>Number(x.targetWinRate)===0.5);
          const plans=[['story',old.storyPlan],['red25',r25.plan],['red50',r50.plan]];
          const out={};
          for(const [label,plan] of plans){
            const p64=Buffer.from(JSON.stringify(plan),'utf8').toString('base64');
            const args=[
              'src/cli.mjs','route-exp-practical-grind',
              '--version=HEARTGOLD','--starter=Cyndaquil','--evolution-policy=trade-aware',
              '--team-keys='+old.teamKeys.join(','),
              '--exp-profile=normal-route','--exp-allocator=boss-aware-saturation',
              '--entry-level=expected','--same-stage-join=map-order',
              '--resources=all','--spend-policy=natural',
              '--story-targets=0.01','--red-targets=0.25',
              '--repair-mode=global-only','--lean-repair=true',
              '--screen-runs=1','--verify-runs=1','--repair-runs=1','--final-runs=1',
              '--max-repair-rounds=1','--reuse-story-plan-base64='+p64,'--skip-red=true'
            ];
            const p=cp.spawnSync(process.execPath,args,{cwd:process.cwd(),encoding:'utf8',env:process.env,maxBuffer:96*1024*1024,timeout:50*60*1000});
            if(p.status!==0) throw new Error(label+': '+(p.stderr||p.stdout||'failure').slice(-12000));
            const d=JSON.parse(p.stdout), s=d.storyFrontier?.[0];
            const red=s?.checkpoints?.find(x=>String(x.boss)==='Red')||null;
            out[label]={
              routeBuildPlan:s?.routeBuildPlan||{},
              redPlayerBuilds:red?.playerBuilds||{}
            };
          }
          fs.writeFileSync('results/joint-route-moveset-diagnostic-v2/result.json',JSON.stringify(out,null,2));
          const slimPlan=plan=>Object.fromEntries(Object.entries(plan||{}).map(([k,b])=>[
            k,{nature:b.nature,evSpread:b.evSpread,routeMoves:b.routeMoves,jointOptimization:b.jointOptimization}
          ]));
          const slimBuilds=builds=>Object.fromEntries(Object.entries(builds||{}).map(([k,b])=>[
            b.species||k,{nature:b.nature,item:b.item,moves:b.moves,evs:b.evs}
          ]));
          console.log(JSON.stringify({
            storyPlan:slimPlan(out.story.routeBuildPlan),
            red25:slimBuilds(out.red25.redPlayerBuilds),
            red50:slimBuilds(out.red50.redPlayerBuilds)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: joint-route-moveset-diagnostic-v2
          path: hgss_story_sim/results/joint-route-moveset-diagnostic-v2/result.json
          if-no-files-found: error
