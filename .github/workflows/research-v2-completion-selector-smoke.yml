name: research-v2-completion-selector-smoke

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[research-v2-completion-selector-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node src/cli.mjs completion-aware-selector-smoke
