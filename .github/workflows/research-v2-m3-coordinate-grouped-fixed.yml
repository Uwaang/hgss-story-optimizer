        with:
          name: research-v2-m3-coordinate-fixed-final16
          path: hgss_story_sim/results/final
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const selections=[
            read('results/r2/selection.json'),
            read('results/r3/selection.json'),
            read('results/r4/selection.json'),
            read('results/r5/selection.json'),
            read('results/r6/selection.json'),
            read('results/endpoints/selection.json'),
          ];
          const final=read('results/final/m3-coordinate-fixed-final16.json');
          const out={
            schemaVersion:1,
            purpose:'SCRUM-423 corrected grouped-E4 independent coordinate search',
            sourceRound1Run:38731606698,
            starts:8,
            proposalsPerStart:8,
            searchRunsPerBoss:4,
            finalRunsPerBoss:16,
            changedStartsByRound:selections.map(x=>x.changedStarts),
            uniqueEndpoints:final.finalRescoredTeams,
            groupedMode:final.config?.e4GroupedRouteRisk === true,
            top:final.top.slice(0,8).map((row,index)=>({
              rank:index+1,
              team:row.team,
              teamKeys:row.teamKeys,
              retry:row.routeExpectedRetryFailures,
              geometric:row.routeRiskGeometricScore,
              mean:row.routeRiskMeanWinRate,
              grindBattles:row.routeGrindProxy?.expectedBattles ?? null,
            })),
          };
          fs.writeFileSync('results/m3-coordinate-fixed-summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-summary
          path: hgss_story_sim/results/m3-coordinate-fixed-summary.json
          if-no-files-found: error
