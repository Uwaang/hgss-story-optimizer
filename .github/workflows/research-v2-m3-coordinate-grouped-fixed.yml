        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-base
          path: hgss_story_sim/results/base
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-round2
          path: hgss_story_sim/results/round
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m3-coordinate-fixed-r2-rescore-*
          path: hgss_story_sim/results/rescored
          merge-multiple: true
      - run: |
          node scripts/research-v2-coordinate-crosscheck.mjs select \
            --round=2 --max-rounds=6 --proposals=8 \
            --pool=results/base/pool.json \
            --fingerprint=results/base/fingerprint.json \
            --manifest=results/round/manifest.json \
            --rescored=results/rescored \
            --out=results/m3-coordinate-fixed/round3
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-round3
          path: hgss_story_sim/results/m3-coordinate-fixed/round3
          if-no-files-found: error

