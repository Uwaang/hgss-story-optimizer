name: research-v2-m3-coordinate-grouped-fixed

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk
    --route-grind-proxy=true --route-grind-proxy-target=0.5
    --e4-grouped-route-risk=true

jobs:
  reselect1:
    if: contains(github.event.head_commit.message, '[research-v2-m3-coordinate-fixed]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-base
          path: hgss_story_sim/results/base
          repository: Uwaang/hgss-story-optimizer
          run-id: 38731606698
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-round1
          path: hgss_story_sim/results/round1
          repository: Uwaang/hgss-story-optimizer
          run-id: 38731606698
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m3-coordinate-r1-rescore-*
          path: hgss_story_sim/results/rescored1
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38731606698
          github-token: ${{ github.token }}
      - name: Re-select round1 with corrected grouped objective
        run: |
          set -euo pipefail
          node scripts/research-v2-coordinate-crosscheck.mjs select \
            --round=1 --max-rounds=6 --proposals=8 \
            --pool=results/base/pool.json \
            --fingerprint=results/base/fingerprint.json \
            --manifest=results/round1/manifest.json \
            --rescored=results/rescored1 \
            --out=results/m3-coordinate-fixed/round2
          jq -e '.config.e4GroupedRouteRisk == true' results/base/fingerprint.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-base
          path: hgss_story_sim/results/base
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-round2
          path: hgss_story_sim/results/m3-coordinate-fixed/round2
          if-no-files-found: error

  rescore2:
    needs: reselect1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-round2
          path: hgss_story_sim/results/input
      - run: |
          set -euo pipefail
          mkdir -p results/rescore
          node src/cli.mjs route-exp-story-rescore-shard \
            --input=results/input/checkpoint.json --runs=4 \
            --shard-count=8 --shard-index=${{ matrix.shard }} \
            $SEARCH_ARGS > "results/rescore/shard-${{ matrix.shard }}.json"
          jq -e '[.rescored[].evaluation.e4GroupedRouteRisk] | all' "results/rescore/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-r2-rescore-${{ matrix.shard }}
          path: hgss_story_sim/results/rescore/shard-${{ matrix.shard }}.json
          if-no-files-found: error

