name: research-v2-m3-coordinate-tier1-100

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk
    --route-grind-proxy=true --route-grind-proxy-target=0.5
    --e4-grouped-route-risk=true

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[research-v2-m3-coordinate-tier1-100]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-fixed-endpoints
          path: hgss_story_sim/results/source
          repository: Uwaang/hgss-story-optimizer
          run-id: 38746249801
          github-token: ${{ github.token }}
      - name: Add staged fallback control and restamp
        run: |
          set -euo pipefail
          mkdir -p results/m3-tier1
          CHECKPOINT="$(find results/source -name checkpoint.json -type f | head -n 1)"
          test -n "$CHECKPOINT"
          node --input-type=module - "$CHECKPOINT" <<'NODE'
          import fs from 'node:fs';
          const input=process.argv[2];
          const doc=JSON.parse(fs.readFileSync(input,'utf8'));
          const fallback=[
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Poliwag::Poliwag->Politoed#2',
            'Combee::Combee->Vespiquen#1',
            'Wynaut::Wobbuffet->Wobbuffet#1',
            'Onix::Steelix->Steelix#1',
            'Sneasel::Sneasel->Weavile#1',
          ];
          const key=xs=>[...xs].sort().join('|');
          const rows=[...(doc.beam||[]),{teamKeys:fallback,evaluation:null}];
          const unique=new Map(rows.map(row=>[key(row.teamKeys||[]),{teamKeys:row.teamKeys,evaluation:null}]));
          const out={
            ...doc,
            beam:[...unique.values()],
            timings:[
              ...(doc.timings||[]),
              {stage:'m3-coordinate-tier1-100-prepare',sourceRun:38746249801,coordinateTeams:(doc.beam||[]).length,combinedTeams:unique.size,addedControl:'staged-fallback'}
            ],
          };
          fs.writeFileSync('results/m3-tier1/unstamped.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({coordinateTeams:(doc.beam||[]).length,combinedTeams:unique.size},null,2));
          NODE
          node src/cli.mjs route-exp-story-stamp-checkpoint \
            --input=results/m3-tier1/unstamped.json --allow-legacy=true \
            $SEARCH_ARGS > results/m3-tier1/checkpoint.json
          jq -e '.config.e4GroupedRouteRisk == true and (.beam|length)==9' results/m3-tier1/checkpoint.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-tier1-checkpoint
          path: hgss_story_sim/results/m3-tier1/checkpoint.json
          if-no-files-found: error

  rescore:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-tier1-checkpoint
          path: hgss_story_sim/results/input
      - run: |
          set -euo pipefail
          mkdir -p results/rescore
          node src/cli.mjs route-exp-story-rescore-shard \
            --input=results/input/checkpoint.json --runs=100 \
            --shard-count=9 --shard-index=${{ matrix.shard }} \
            $SEARCH_ARGS > "results/rescore/shard-${{ matrix.shard }}.json"
          jq -e '[.rescored[].evaluation.e4GroupedRouteRisk] | all' "results/rescore/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-tier1-shard-${{ matrix.shard }}
          path: hgss_story_sim/results/rescore/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  summarize:
    needs: rescore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-m3-coordinate-tier1-checkpoint
          path: hgss_story_sim/results/input
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m3-coordinate-tier1-shard-*
          path: hgss_story_sim/results/rescored
          merge-multiple: true
      - run: |
          set -euo pipefail
          INPUTS="$(find results/rescored -name 'shard-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-rescore-merge \
            --input=results/input/checkpoint.json --inputs="$INPUTS" --runs=100 \
            $SEARCH_ARGS > results/m3-coordinate-tier1-final100.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const doc=JSON.parse(fs.readFileSync('results/m3-coordinate-tier1-final100.json','utf8'));
          const fallback=[
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Poliwag::Poliwag->Politoed#2',
            'Combee::Combee->Vespiquen#1',
            'Wynaut::Wobbuffet->Wobbuffet#1',
            'Onix::Steelix->Steelix#1',
            'Sneasel::Sneasel->Weavile#1',
          ];
          const key=xs=>[...xs].sort().join('|');
          const rows=doc.top||[];
          const fi=rows.findIndex(row=>key(row.teamKeys||[])===key(fallback));
          if(fi<0) throw new Error('staged fallback missing');
          const summary={
            schemaVersion:1,
            purpose:'SCRUM-423 coordinate grouped Tier1 100-run confirmation',
            sourceCoordinateRun:38746249801,
            runsPerBoss:100,
            candidateTeams:rows.length,
            groupedMode:doc.config?.e4GroupedRouteRisk===true,
            fallbackRank:fi+1,
            fallback:{
              retry:rows[fi].routeExpectedRetryFailures,
              geometric:rows[fi].routeRiskGeometricScore,
              mean:rows[fi].routeRiskMeanWinRate,
              grindBattles:rows[fi].routeGrindProxy?.expectedBattles??null,
              teamKeys:rows[fi].teamKeys,
            },
            top:rows.map((row,index)=>({
              rank:index+1,
              team:row.team,
              teamKeys:row.teamKeys,
              retry:row.routeExpectedRetryFailures,
              geometric:row.routeRiskGeometricScore,
              mean:row.routeRiskMeanWinRate,
              grindBattles:row.routeGrindProxy?.expectedBattles??null,
            })),
          };
          fs.writeFileSync('results/m3-coordinate-tier1-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-coordinate-tier1-summary
          path: |
            hgss_story_sim/results/m3-coordinate-tier1-final100.json
            hgss_story_sim/results/m3-coordinate-tier1-summary.json
          if-no-files-found: error
