name: research-v2-size4-zero16-racing-calibration

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=false

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[research-v2-size4-zero16-racing]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-prefix100-input
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 38126034160
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size4-full16-shard-*
          path: hgss_story_sim/results/full16
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38125738869
          github-token: ${{ github.token }}
      - name: Repackage diagnostic5 full16 rows as selective-rescore input
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const diag=JSON.parse(fs.readFileSync('results/input/diagnostic5.json','utf8'));
          const key=x=>[...(x||[])].sort().join('|');
          const wanted=new Set((diag.beam||[]).map(r=>key(r.teamKeys)));
          const rows=[];
          let fingerprint=null, config=null;
          for(const file of fs.readdirSync('results/full16').filter(x=>x.startsWith('full16-')&&x.endsWith('.json'))){
            const d=JSON.parse(fs.readFileSync('results/full16/'+file,'utf8'));
            fingerprint ??= d.fingerprint; config ??= d.config;
            for(const r of d.rescored||[]) if(wanted.has(key(r.teamKeys))) rows.push({teamKeys:r.teamKeys,evaluation:r.evaluation});
          }
          const by=new Map(rows.map(r=>[key(r.teamKeys),r]));
          if(by.size!==wanted.size) throw new Error('expected '+wanted.size+' diagnostic states, got '+by.size);
          fs.writeFileSync('results/expanded5.json',JSON.stringify({
            schemaVersion:diag.schemaVersion,
            type:'route-beam-shard',
            fingerprint,config,
            expanded:[...by.values()]
          },null,2));
          console.log(JSON.stringify({states:by.size,fingerprint},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-zero16-input
          path: |
            hgss_story_sim/results/input/diagnostic5.json
            hgss_story_sim/results/expanded5.json
          if-no-files-found: error

  selective:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runs: [32,64]
        shard: [0,1,2,3,4]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-zero16-input
          path: hgss_story_sim/results/input
      - name: Resample only 0-of-16 boss rows
        run: |
          node src/cli.mjs route-exp-story-selective-rescore-shard \
            --inputs=results/input/expanded5.json \
            --runs=${{ matrix.runs }} --max-low-wins=0 \
            --shard-count=5 --shard-index=${{ matrix.shard }} \
            $SEARCH_ARGS > "results/zero16-${{ matrix.runs }}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-zero16-${{ matrix.runs }}-${{ matrix.shard }}
          path: hgss_story_sim/results/zero16-${{ matrix.runs }}-${{ matrix.shard }}.json
          if-no-files-found: error

  summarize:
    needs: selective
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-zero16-input
          path: hgss_story_sim/results/input
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size4-zero16-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
      - name: Compare selective32 and selective64 against 100-run ordering
        run: |
          TARGET="Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1"
          for RUNS in 32 64; do
            INPUTS="$(find results/shards -name "zero16-${RUNS}-*.json" -type f | sort | paste -sd, -)"
            node src/cli.mjs route-exp-story-selective-rescore-merge \
              --checkpoint=results/input/diagnostic5.json \
              --inputs="$INPUTS" --runs="$RUNS" --max-low-wins=0 \
              --beam-width=5 --selection=objective --target-keys="$TARGET" \
              $SEARCH_ARGS > "results/summary-${RUNS}.json"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=x=>[...(x||[])].sort().join('|');
          const targetKey=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1'
          ]);
          const rows=[];
          for(const runs of [32,64]){
            const d=JSON.parse(fs.readFileSync('results/summary-'+runs+'.json','utf8'));
            const target=(d.beam||[]).find(r=>key(r.teamKeys)===targetKey);
            const lance=(target?.evaluation?.rows||[]).find(r=>String(r.boss)==='Lance');
            rows.push({
              runs,
              targetRank:d.selectiveRescore?.target?.objectiveRank,
              targetMetrics:d.selectiveRescore?.target?.metrics,
              resampledBossRows:d.selectiveRescore?.resampledBossRows,
              targetLance:lance?{wins:lance.wins,runs:lance.runs,progress:lance.battleProgressScore}:null,
              ranking:(d.beam||[]).map((r,i)=>({rank:i+1,teamKeys:r.teamKeys}))
            });
          }
          console.log(JSON.stringify({schemaVersion:1,rows},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-zero16-racing-summary
          path: |
            hgss_story_sim/results/summary-32.json
            hgss_story_sim/results/summary-64.json
          if-no-files-found: error
