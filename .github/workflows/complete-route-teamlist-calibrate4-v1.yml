name: complete-route-teamlist-calibrate4-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  calibrate:
    if: contains(github.event.head_commit.message, '[teamlist-calibrate4-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: teamlist-screen4-input-v1
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37192799510
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: teamlist-screen4-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37192799510
          github-token: ${{ github.token }}
      - name: Calibrate posterior against exact N04
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('results/shards').filter(x=>/^compact-\d+\.json$/.test(x));
          const key=r=>[...r.teamKeys].sort().join('|');
          const map=new Map();
          for(const f of files){
            const d=JSON.parse(fs.readFileSync(path.join('results/shards',f),'utf8'));
            for(const r of d.rows||[]) map.set(key(r),r);
          }
          const teams=[...map.values()];
          if(teams.length!==2335) throw new Error('expected 2335 teams');

          const n04Set=new Set([
            'Cyndaquil::Cyndaquil->Typhlosion#1','Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1','Lapras::Lapras->Lapras#1',
            'Chinchou::Lanturn->Lanturn#1','Sneasel::Sneasel->Sneasel#1'
          ]);
          const n04Index=teams.findIndex(t=>t.teamKeys.length===6&&t.teamKeys.every(k=>n04Set.has(k)));
          if(n04Index<0) throw new Error('N04 missing');

          function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
          function normal(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
          function gamma(shape,rng){if(shape<1)return gamma(shape+1,rng)*Math.pow(Math.max(rng(),1e-15),1/shape);const d=shape-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normal(rng);v=1+c*x;}while(v<=0);v=v*v*v;const u=rng();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
          function beta(a,b,rng){const x=gamma(a,rng),y=gamma(b,rng);return x/(x+y);}
          const params=teams.map(t=>(t.bosses||[]).map(r=>[
            Math.max(0,Number(r.wins||0))+1,
            Math.max(0,Number(r.losses||0))+Math.max(0,Number(r.ties||0))+1
          ]));
          const draws=2048, beat=new Uint32Array(teams.length), rng=mulberry32(0x4E303443);
          for(let d=0;d<draws;d++){
            let n04Risk=0;
            for(const [a,b] of params[n04Index]){
              const p=Math.max(1e-9,beta(a,b,rng)); n04Risk+=(1-p)/p;
            }
            for(let i=0;i<teams.length;i++){
              let risk=0;
              for(const [a,b] of params[i]){
                const p=Math.max(1e-9,beta(a,b,rng)); risk+=(1-p)/p;
              }
              if(risk<n04Risk) beat[i]++;
            }
          }
          const rows=teams.map((t,i)=>({teamKeys:t.teamKeys,probBeatN04:beat[i]/draws,retry:t.retry,geometric:t.geometric,mean:t.mean}))
            .sort((a,b)=>b.probBeatN04-a.probBeatN04||a.retry-b.retry||key(a).localeCompare(key(b)));
          const thresholds=[0.01,0.025,0.05,0.10,0.20,0.30,0.40,0.50];
          const counts=Object.fromEntries(thresholds.map(p=>[String(p),rows.filter(r=>r.probBeatN04>=p).length]));
          const out={
            sourceTeams:teams.length,draws,
            n04Point:{retry:teams[n04Index].retry,geometric:teams[n04Index].geometric,mean:teams[n04Index].mean},
            thresholdCounts:counts,
            top50:rows.slice(0,50)
          };
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-teamlist-calibrate4-v1
          path: hgss_story_sim/results/summary.json
          if-no-files-found: error
