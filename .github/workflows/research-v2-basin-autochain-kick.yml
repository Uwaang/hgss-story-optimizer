name: research-v2-basin-autochain-kick

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[research-v2-basin-autochain-kick]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate control file and dispatch requested stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CFG=".github/research-v2-basin-autochain.json"
          enabled="$(jq -r '.enabled' "$CFG")"
          origin="$(jq -r '.origin' "$CFG")"
          stage="$(jq -r '.stage' "$CFG")"
          source_run_id="$(jq -r '.source_run_id // empty' "$CFG")"

          test "$enabled" = "true" || { echo "autochain disabled"; exit 1; }
          test -n "$origin" || { echo "missing origin"; exit 1; }

          case "$stage" in
            phase1)
              workflow="research-v2-basin-autochain-phase1-v2.yml"
              ;;
            size4)
              workflow="research-v2-basin-autochain-size4-v2.yml"
              ;;
            size5)
              workflow="research-v2-basin-autochain-size5-v2.yml"
              ;;
            terminal)
              workflow="research-v2-basin-autochain-terminal-v2.yml"
              ;;
            *)
              echo "unsupported stage: $stage"
              exit 1
              ;;
          esac

          if [ "$stage" != "phase1" ]; then
            test -n "$source_run_id" || { echo "missing source_run_id"; exit 1; }
            conclusion="$(gh api "/repos/${{ github.repository }}/actions/runs/$source_run_id" --jq '.conclusion // empty')"
            test "$conclusion" = "success" || {
              echo "upstream run $source_run_id is not successful: $conclusion"
              exit 1
            }
          fi

          if [ "$stage" = "phase1" ]; then
            gh api --method POST               -H "Accept: application/vnd.github+json"               "/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches"               -f ref="${{ github.ref_name }}"               -f 'inputs[origin]'="$origin"
          else
            gh api --method POST               -H "Accept: application/vnd.github+json"               "/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches"               -f ref="${{ github.ref_name }}"               -f 'inputs[origin]'="$origin"               -f 'inputs[source_run_id]'="$source_run_id"
          fi

          echo "dispatched $workflow origin=$origin stage=$stage source_run_id=$source_run_id"
