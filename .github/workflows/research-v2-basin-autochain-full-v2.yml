name: research-v2-basin-autochain-full-v2

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: write

jobs:
  config:
    if: contains(github.event.head_commit.message, '[research-v2-basin-autochain-full]')
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.cfg.outputs.origin }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        name: Validate full-chain control
        run: |
          set -euo pipefail
          CFG=".github/research-v2-basin-autochain.json"
          enabled="$(jq -r '.enabled' "$CFG")"
          origin="$(jq -r '.origin' "$CFG")"
          stage="$(jq -r '.stage' "$CFG")"

          test "$enabled" = "true" || { echo "autochain disabled"; exit 1; }
          test "$stage" = "phase1" || { echo "full chain must start at phase1, got: $stage"; exit 1; }
          test -n "$origin" || { echo "missing origin"; exit 1; }
          test "$origin" != "Cyndaquil" || { echo "cannot exclude required starter"; exit 1; }

          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "full chain origin=$origin"

  phase1:
    needs: config
    uses: ./.github/workflows/research-v2-basin-autochain-phase1-v2.yml
    with:
      origin: ${{ needs.config.outputs.origin }}

  size4:
    needs: phase1
    uses: ./.github/workflows/research-v2-basin-autochain-size4-v2.yml
    with:
      origin: ${{ needs.config.outputs.origin }}

  size5:
    needs: size4
    uses: ./.github/workflows/research-v2-basin-autochain-size5-v2.yml
    with:
      origin: ${{ needs.config.outputs.origin }}

  terminal:
    needs: size5
    uses: ./.github/workflows/research-v2-basin-autochain-terminal-v2.yml
    with:
      origin: ${{ needs.config.outputs.origin }}
