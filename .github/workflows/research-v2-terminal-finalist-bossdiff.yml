name: research-v2-terminal-finalist-bossdiff

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    if: contains(github.event.head_commit.message, '[research-v2-terminal-finalist-bossdiff]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-terminal-grind-final100-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38148536386
          github-token: ${{ github.token }}
      - name: Compare practical finalists boss by boss
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=xs=>[...(xs||[])].sort().join('|');
          const labels={
            Kingler:'Krabby::Kingler->Kingler#1',
            Electivire:'Elekid::Electabuzz->Electivire#1',
            Wobbuffet:'Wynaut::Wobbuffet->Wobbuffet#1',
            Weavile:'Sneasel::Sneasel->Weavile#1',
            Lanturn:'Chinchou::Lanturn->Lanturn#1',
          };
          const core=[
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1',
            'Zubat::Golbat->Crobat#1',
          ];
          const wanted=new Map(Object.entries(labels).map(([name,extra])=>[key([...core,extra]),name]));
          const found={};
          for(const file of fs.readdirSync('results/shards').filter(x=>x.startsWith('final100-')&&x.endsWith('.json'))){
            const d=JSON.parse(fs.readFileSync('results/shards/'+file,'utf8'));
            for(const r of d.rescored||[]){
              const name=wanted.get(key(r.teamKeys));
              if(name) found[name]=r;
            }
          }
          const retryRow=r=>{
            const w=Number(r.wins||0), l=Number(r.losses||0), t=Number(r.ties||0);
            const p=(w+1)/(w+l+t+2);
            return (1-p)/p;
          };
          const summarize=r=>({
            teamKeys:r.teamKeys,
            grindBattles:r.evaluation?.routeGrindProxy?.expectedBattles??null,
            grindExp:r.evaluation?.routeGrindProxy?.cumulativeGrindExp??null,
            rows:(r.evaluation?.rows||[]).filter(x=>!x.skipped).map(x=>({
              boss:String(x.boss),
              wins:Number(x.wins||0),
              runs:Number(x.runs||0),
              winRate:Number(x.winRate||0),
              retry:retryRow(x),
              progress:Number(x.battleProgressScore??x.winRate??0),
            }))
          });
          const summaries=Object.fromEntries(Object.entries(found).map(([n,r])=>[n,summarize(r)]));
          const baseline=summaries.Kingler;
          const diffs={};
          for(const [name,s] of Object.entries(summaries)){
            if(name==='Kingler') continue;
            const by=new Map(s.rows.map(r=>[r.boss,r]));
            diffs[name]=baseline.rows.map(a=>{
              const b=by.get(a.boss);
              return {
                boss:a.boss,
                kinglerWinRate:a.winRate,
                otherWinRate:b?.winRate??null,
                retryDeltaOtherMinusKingler:(b?.retry??0)-a.retry,
                progressDeltaOtherMinusKingler:(b?.progress??0)-a.progress,
              };
            }).sort((a,b)=>Math.abs(b.retryDeltaOtherMinusKingler)-Math.abs(a.retryDeltaOtherMinusKingler)).slice(0,10);
          }
          console.log(JSON.stringify({schemaVersion:1,found:Object.keys(found),summaries,diffs},null,2));
          NODE
