name: research-v2-size3-full16-width-sweep

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=false

jobs:
  sweep:
    if: contains(github.event.head_commit.message, '[research-v2-size3-full16-width-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size3-promotion48
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 38116554788
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size3-full16-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38116554788
          github-token: ${{ github.token }}
      - name: Sweep full16 beam widths
        run: |
          INPUTS="$(find results/shards -name 'full16-*.json' -type f | sort | paste -sd, -)"
          for WIDTH in 12 16 24 32 48; do
            node src/cli.mjs route-exp-story-rescore-select-merge \
              --checkpoint=results/input/promotion48.json \
              --inputs="$INPUTS" --runs=16 --beam-width="$WIDTH" \
              --target-keys="Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1" \
              $SEARCH_ARGS \
              > "results/w${WIDTH}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const widths=[12,16,24,32,48];
          const rows=widths.map(width=>{
            const d=JSON.parse(fs.readFileSync(`results/w${width}.json`,'utf8'));
            return {
              width,
              target:d.fullRescoreSelect?.target,
              selectedKeys:(d.beam||[]).map(r=>r.teamKeys)
            };
          });
          console.log(JSON.stringify({schemaVersion:1,rows},null,2));
          NODE
