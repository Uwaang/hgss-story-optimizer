name: research-v2-moveset-policy-intrusion-highsample

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-policy-highsample]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Priority correctness smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { smartMoveActsBeforeNeutralPriority } from './src/battle.mjs';
          assert.equal(smartMoveActsBeforeNeutralPriority('Focus Punch', 999, 1), false);
          assert.equal(smartMoveActsBeforeNeutralPriority('Quick Attack', 1, 999), true);
          NODE
      - name: 100-run targeted option intrusion
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-policy-intrusion \
            --level=50 --runs=100 \
            --bosses="Misty,Karen 2,Will 2,Lance" \
            > results/research-v2/moveset-build-v2-policy-intrusion-highsample.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/moveset-build-v2-policy-intrusion-highsample.json','utf8'));
          console.log(JSON.stringify(r.rows.map(x=>({
            label:x.label,
            retry:x.actual.expectedRetryFailures,
            geometric:x.actual.geometricScore,
            mean:x.actual.meanWinRate,
            moveUses:x.actual.targetUsage?.moveUsesByMove || {},
            vsControl:{
              retryDelta:x.vsControl.retryDelta,
              geometricDelta:x.vsControl.geometricDelta,
              meanDelta:x.vsControl.meanDelta,
              bossesImproved:x.vsControl.bossesImproved,
              bossesWorsened:x.vsControl.bossesWorsened,
              bossDeltas:x.vsControl.bossDeltas
            }
          })),null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-moveset-policy-intrusion-highsample
          path: hgss_story_sim/results/research-v2/moveset-build-v2-policy-intrusion-highsample.json
          if-no-files-found: error
