        working-directory: hgss_story_sim
        run: |
          CACHES="$(find results/shards -name 'battle-cache-6-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs battle-cache-merge \
            --inputs="$CACHES" \
            --output=results/battle-cache-merged.json
      - name: Merge beam 6 and adaptive race
        working-directory: hgss_story_sim
        run: |
          SHARDS="$(find results/shards -name 'beam-6-shard-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-beam-merge \
            --input=results/input/checkpoint.json \
            --inputs="$SHARDS" \
            --target-size=6 --runs=2 \
            --beam-width=6 --adaptive-runs=4 --adaptive-confidence-z=1.96 \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/checkpoint.json
      - name: Stage timing
        working-directory: hgss_story_sim
        run: jq '.timings[-1]' results/checkpoint.json
      - name: Read checkpoint fingerprint
        id: checkpoint_fp
        working-directory: hgss_story_sim
        run: echo "value=$(jq -r '.fingerprint' results/checkpoint.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: hgss_story_sim/results/battle-cache-merged.json
          key: hgss-battle-${{ steps.checkpoint_fp.outputs.value }}-${{ github.run_id }}-beam6
      - uses: actions/upload-artifact@v4
        with:
          name: staged-beam6-merge
          path: |
            hgss_story_sim/results/checkpoint.json
            hgss_story_sim/results/battle-cache-merged.json
          if-no-files-found: error

  final:
    needs: beam6_merge
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HGSS_BATTLE_CACHE_PATH: results/input/battle-cache-merged.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: hgss_story_sim
      - uses: actions/download-artifact@v4
        with:
          name: staged-beam6-merge
          path: hgss_story_sim/results/input
      - name: Final 16-run validation
        working-directory: hgss_story_sim
        run: |
          node src/cli.mjs route-exp-story-final-stage \
            --input=results/input/checkpoint.json --final-runs=16 \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > results/staged-route-search-final.json
      - name: Performance summary
        working-directory: hgss_story_sim
        run: |
          jq '{
            top: [.top[] | {team,routeExpectedRetryFailures,routeRiskGeometricScore,routeRiskMeanWinRate}],
            timings,
            battleCache
          }' results/staged-route-search-final.json | tee results/staged-route-search-summary.json
      - name: Read final fingerprint
        id: final_fp
        working-directory: hgss_story_sim
        run: echo "value=$(jq -r '.fingerprint' results/staged-route-search-final.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: hgss_story_sim/results/input/battle-cache-merged.json
          key: hgss-battle-${{ steps.final_fp.outputs.value }}-${{ github.run_id }}-final
      - uses: actions/upload-artifact@v4
        with:
          name: staged-route-search-final
          path: |
            hgss_story_sim/results/staged-route-search-final.json
            hgss_story_sim/results/staged-route-search-summary.json
          if-no-files-found: error
