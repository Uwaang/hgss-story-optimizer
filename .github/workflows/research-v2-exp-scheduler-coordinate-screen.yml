name: research-v2-exp-scheduler-coordinate-screen
# SCRUM-417 high-sample proxy-frontier finalists

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  finalist-validation:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-proxy-finalists]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkifQ==
          - state: quagsire-lt-surge-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6Ikx0LiBTdXJnZSIsIlJoeXBlcmlvciI6Ik1pc3R5In0=
          - state: magneton-red-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkiLCJNYWduZXRvbiI6IlJlZCJ9
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Recipient-state regression smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: Story50 and Red25 Red50 high-sample validation
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs route-exp-practical-grind \
            --team-preset=d-quagsire \
            --recipient-schedule-base64="${{ matrix.schedule_b64 }}" \
            --story-targets=0.5 \
            --red-targets=0.25,0.5 \
            --screen-runs=2 \
            --verify-runs=8 \
            --repair-runs=32 \
            --final-runs=64 \
            --max-repair-rounds=16 \
            --repair-mode=global-only \
            --lean-repair=true \
            > results/research-v2/proxy-finalist-${{ matrix.state }}.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='results/research-v2/proxy-finalist-${{ matrix.state }}.json';
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({
            state:'${{ matrix.state }}',
            assumptions:r.assumptions,
            storyFrontier:r.storyFrontier.map(x=>({
              storyTargetWinRate:x.storyTargetWinRate,
              storyGrindBattles:x.storyGrindBattles,
              storyGrindExp:x.storyGrindExp,
              storyWorstBossWinRate:x.storyWorstBossWinRate,
              repairConverged:x.repairConverged,
              repairRounds:x.repairRounds,
              storyPlan:x.storyPlan,
              redBaseline:x.redBaseline,
              redFrontier:x.redFrontier.map(y=>({
                targetWinRate:y.targetWinRate,
                additionalRedGrindBattles:y.additionalRedGrindBattles,
                totalGrindBattles:y.totalGrindBattles,
                totalGrindExp:y.totalGrindExp,
                achievedWinRate:y.achievedWinRate,
                averageOpponentFaints:y.averageOpponentFaints,
                finalLevels:y.finalLevels,
                plan:y.plan
              }))
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-proxy-finalist-${{ matrix.state }}
          path: hgss_story_sim/results/research-v2/proxy-finalist-${{ matrix.state }}.json
          if-no-files-found: error
