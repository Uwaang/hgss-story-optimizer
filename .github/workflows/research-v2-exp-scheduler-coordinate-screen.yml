name: research-v2-exp-scheduler-coordinate-screen
# SCRUM-417 proxy-frontier practical shortlist

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  practical-shortlist:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-proxy-shortlist]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkifQ==
          - state: quagsire-lt-surge-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6Ikx0LiBTdXJnZSIsIlJoeXBlcmlvciI6Ik1pc3R5In0=
          - state: gyarados-will-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkiLCJHeWFyYWRvcyI6IldpbGwifQ==
          - state: magneton-blaine-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkiLCJNYWduZXRvbiI6IkJsYWluZSJ9
          - state: magneton-red-rhyperior-misty
            schedule_b64: eyJRdWFnc2lyZSI6IkxhbmNlIiwiUmh5cGVyaW9yIjoiTWlzdHkiLCJNYWduZXRvbiI6IlJlZCJ9
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Recipient-state regression smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: Story50 practical shortlist
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs route-exp-practical-grind \
            --team-preset=d-quagsire \
            --recipient-schedule-base64="${{ matrix.schedule_b64 }}" \
            --story-targets=0.5 \
            --skip-red=true \
            --screen-runs=1 \
            --verify-runs=4 \
            --repair-runs=8 \
            --final-runs=16 \
            --max-repair-rounds=10 \
            --repair-mode=global-only \
            --lean-repair=true \
            > results/research-v2/proxy-shortlist-${{ matrix.state }}.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='results/research-v2/proxy-shortlist-${{ matrix.state }}.json';
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(JSON.stringify({
            state:'${{ matrix.state }}',
            assumptions:r.assumptions,
            storyFrontier:r.storyFrontier.map(x=>({
              storyTargetWinRate:x.storyTargetWinRate,
              storyGrindBattles:x.storyGrindBattles,
              storyGrindExp:x.storyGrindExp,
              storyWorstBossWinRate:x.storyWorstBossWinRate,
              repairConverged:x.repairConverged,
              repairRounds:x.repairRounds,
              storyPlan:x.storyPlan
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-proxy-shortlist-${{ matrix.state }}
          path: hgss_story_sim/results/research-v2/proxy-shortlist-${{ matrix.state }}.json
          if-no-files-found: error
