name: research-v2-size3-width-sweep

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=false

jobs:
  sweep:
    if: contains(github.event.head_commit.message, '[research-v2-size3-width-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-early-wide-beam2-merge
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 38109472963
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-early-wide-beam3-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38109472963
          github-token: ${{ github.token }}
      - name: Sweep cheap size3 retention widths
        run: |
          INPUTS="$(find results/shards -name 'beam-3-wide-shard-*.json' -type f | sort | paste -sd, -)"
          TARGET='Cyndaquil::Cyndaquil->Typhlosion#1|Abra::Abra->Alakazam#1|Rhyhorn::Rhyhorn->Rhyperior#1'
          for W in 12 24 36 48 60 80 100; do
            HGSS_BATTLE_CACHE_PATH="results/sweep-cache-$W.json" node src/cli.mjs route-exp-story-beam-merge \
              --input=results/input/beam2-wide-checkpoint.json --inputs="$INPUTS" \
              --target-size=3 --runs=2 --beam-width="$W" \
              --adaptive-runs=2 \
              $SEARCH_ARGS \
              > "results/beam3-w$W.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const target=[...[
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1'
          ]].sort().join('|');
          const widths=[12,24,36,48,60,80,100];
          const rows=widths.map(width=>{
            const d=JSON.parse(fs.readFileSync('results/beam3-w'+width+'.json','utf8'));
            const idx=(d.beam||[]).findIndex(r=>[...(r.teamKeys||[])].sort().join('|')===target);
            return {
              width,
              selected:idx>=0,
              selectedPosition:idx>=0?idx+1:null,
              actualCount:(d.beam||[]).length,
              objectiveTop:(d.beam||[]).slice(0,5).map(r=>({
                teamKeys:r.teamKeys,
                retry:r.routeExpectedRetryFailures,
                geometric:r.routeRiskGeometricScore,
                mean:r.routeRiskMeanWinRate
              }))
            };
          });
          console.log(JSON.stringify({schemaVersion:1,target,rows},null,2));
          NODE
