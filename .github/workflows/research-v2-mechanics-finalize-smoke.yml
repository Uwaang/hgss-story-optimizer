name: research-v2-mechanics-finalize-smoke

on:
  push:
    branches:
      - research/v2-mechanics-finalize

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[research-v2-mechanics-finalize]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Dynamic power smoke
        run: node src/cli.mjs move-score-smoke
      - name: Choice-lock switch smoke
        run: node src/cli.mjs switch-smoke
