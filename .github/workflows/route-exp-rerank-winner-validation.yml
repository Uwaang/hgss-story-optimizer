name: route-exp-rerank-winner-validation

on:
  push:
    branches:
      - design/route-exp-budget-model
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[route-winner-validate]')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ampharos-forretress-slowbro
            team_keys: Cyndaquil::Cyndaquil->Typhlosion#1,Geodude::Geodude->Golem#1,Slowpoke::Slowpoke->Slowbro#1,Pineco::Pineco->Forretress#1,Mareep::Mareep->Ampharos#1,Rhyhorn::Rhyhorn->Rhyperior#1
          - label: direct-quagsire-control
            team_keys: Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate route-aware rerank winner
        shell: bash
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-evaluate \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=budgeted \
            --grind-budget=1600000 \
            --entry-level=max --same-stage-join=map-order \
            --exp-allocator=boss-aware-soft \
            --resources=all --spend-policy=natural \
            --runs=1000 \
            --team-keys='${{ matrix.team_keys }}' \
            > results/${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: route-winner-${{ matrix.label }}
          path: hgss_story_sim/results/${{ matrix.label }}.json
          if-no-files-found: error

  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[route-winner-validate]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: route-winner-*
          path: results
      - name: Build winner validation summary
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const rows=[];
          for(const dir of fs.readdirSync('results').sort()){
            const full=path.join('results',dir);
            if(!fs.statSync(full).isDirectory()) continue;
            const file=fs.readdirSync(full).find(x=>x.endsWith('.json'));
            if(!file) continue;
            const d=JSON.parse(fs.readFileSync(path.join(full,file),'utf8'));
            const cp=name=>d.checkpoints.find(x=>x.boss===name)||null;
            rows.push({
              label:dir.replace(/^route-winner-/,''),
              finalTeam:d.finalTeam,
              finalLevels:d.finalLevels,
              score:d.performance.score,
              bottom5:d.performance.bottom5BossWinRate,
              geometric:d.performance.storyClearGeometricScore,
              coverage:d.performance.storyClearCoverageScore,
              expectedGrindBattles:d.ledger.totalExpectedGrindBattles,
              Lance:cp('Lance'),
              Blue:cp('Blue'),
              Red:cp('Red')
            });
          }
          fs.writeFileSync('route-winner-validation.json',JSON.stringify({schemaVersion:1,rows},null,2));
          console.log(JSON.stringify(rows,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: route-winner-validation-comparison
          path: route-winner-validation.json
          if-no-files-found: error
