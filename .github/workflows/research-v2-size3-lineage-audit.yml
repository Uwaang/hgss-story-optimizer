name: research-v2-size3-lineage-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-size3-lineage-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-early-wide-beam2-merge
          path: hgss_story_sim/results/parents
          repository: Uwaang/hgss-story-optimizer
          run-id: 38109472963
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-early-wide-beam3-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38109472963
          github-token: ${{ github.token }}
      - name: Rank size3 children within each beam2 parent
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parents=JSON.parse(fs.readFileSync('results/parents/beam2-wide-checkpoint.json','utf8')).beam||[];
          const expanded=[];
          const seen=new Set();
          for(const file of fs.readdirSync('results/shards').filter(x=>x.startsWith('beam-3-wide-shard-')&&x.endsWith('.json'))){
            const d=JSON.parse(fs.readFileSync('results/shards/'+file,'utf8'));
            for(const row of d.expanded||[]){
              const k=[...(row.teamKeys||[])].sort().join('|');
              if(!seen.has(k)){ seen.add(k); expanded.push(row); }
            }
          }
          const key=x=>[...(x||[])].sort().join('|');
          const parentKeySet=new Set(parents.map(p=>key(p.teamKeys)));
          function metrics(row){
            const rows=(row.evaluation?.rows||[]).filter(x=>!x.skipped);
            let retry=0, log=0, wins=0, runs=0;
            for(const r of rows){
              const w=Number(r.wins||0), l=Number(r.losses||0), t=Number(r.ties||0);
              const p=(w+1)/(w+l+t+2);
              retry+=(1-p)/p;
              log+=Math.log(p);
              wins+=w; runs+=Number(r.runs||w+l+t);
            }
            return {retry,geometric:rows.length?Math.exp(log/rows.length):0,mean:runs?wins/runs:0};
          }
          const targetParent=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1'
          ]);
          const targetChild=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1'
          ]);
          const summaries=[];
          for(const parent of parents){
            const pk=key(parent.teamKeys);
            const children=expanded.filter(r=>{
              const child=new Set(r.teamKeys||[]);
              return (parent.teamKeys||[]).every(k=>child.has(k));
            }).map(r=>({...r,_m:metrics(r)}))
              .sort((a,b)=>a._m.retry-b._m.retry || b._m.geometric-a._m.geometric || b._m.mean-a._m.mean || key(a.teamKeys).localeCompare(key(b.teamKeys)));
            summaries.push({
              parentKeys:parent.teamKeys,
              childCount:children.length,
              bestChildren:children.slice(0,5).map((r,i)=>({rank:i+1,teamKeys:r.teamKeys,...r._m})),
              targetChildRank: pk===targetParent ? (children.findIndex(r=>key(r.teamKeys)===targetChild)+1 || null) : null,
              targetChild: pk===targetParent ? (()=>{const r=children.find(r=>key(r.teamKeys)===targetChild);return r?{teamKeys:r.teamKeys,...r._m}:null})() : null
            });
          }
          console.log(JSON.stringify({
            schemaVersion:1,
            parentCount:parents.length,
            expandedCount:expanded.length,
            targetParentPresent:parentKeySet.has(targetParent),
            targetParent:summaries.find(x=>key(x.parentKeys)===targetParent)||null,
            summaries
          },null,2));
          NODE
