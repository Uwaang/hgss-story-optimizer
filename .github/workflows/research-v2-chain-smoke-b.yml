name: research-v2-chain-smoke-b

on:
  workflow_call:
    inputs:
      source_run_id:
        description: upstream run id
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke_b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "source_run_id=${{ inputs.source_run_id }}"
          test -n "${{ inputs.source_run_id }}"
