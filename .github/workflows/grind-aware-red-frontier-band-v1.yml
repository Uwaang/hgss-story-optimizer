name: grind-aware-red-frontier-band-v1

on:
  push:
    branches:
      - exp/grind-aware-red-frontier-band-v1

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[red-frontier-band-v1]')
    runs-on: ubuntu-latest
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/cli.mjs
          node --check src/hgss-data.mjs

      - name: Download complete 720-state Story50 summary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37622900748
          name: grind-story-summary-recovery-v5
          path: hgss_story_sim/results/red-frontier/story-source

      - id: matrix
        name: Build safe survivor manifest
        run: |
          node <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('results/red-frontier/story-source/summary.json','utf8'));
          const rule=JSON.parse(fs.readFileSync('results/red-frontier/band-v1-selection.json','utf8'));
          const cutoff=Number(rule.incumbent.red50TotalGrindBattles);
          const rows=(source.all||[])
            .filter(r=>!r.error && r.repairConverged && Number.isFinite(Number(r.storyGrindBattles)))
            .filter(r=>Number(r.storyGrindBattles)<cutoff)
            .sort((a,b)=>
              Number(a.storyGrindBattles)-Number(b.storyGrindBattles) ||
              Number(a.index)-Number(b.index) ||
              String(a.allocator).localeCompare(String(b.allocator))
            )
            .map((r,ordinal)=>({
              ordinal,
              index:r.index,
              allocator:r.allocator,
              storyGrindBattles:Number(r.storyGrindBattles),
              teamKeys:r.teamKeys,
              sources:r.sources,
              storyPlan:r.storyPlan,
            }));
          const expected=Number(rule.survivorRule.expectedStateCount);
          if(rows.length!==expected) throw new Error('expected '+expected+' survivor states, got '+rows.length);
          for(const row of rows){
            if(!row.storyPlan || typeof row.storyPlan!=='object') {
              throw new Error('missing storyPlan for ordinal '+row.ordinal);
            }
          }
          const manifest={
            schemaVersion:1,
            sourceRun:37622900748,
            selection:rule.survivorRule,
            incumbent:rule.incumbent,
            stateCount:rows.length,
            states:rows,
          };
          fs.writeFileSync('results/red-frontier/survivor-manifest-v1.json',JSON.stringify(manifest,null,2));
          const split=Math.ceil(rows.length/2);
          const a=rows.slice(0,split).map(r=>r.ordinal);
          const b=rows.slice(split).map(r=>r.ordinal);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix_a='+JSON.stringify(a)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix_b='+JSON.stringify(b)+'\n');
          console.log(JSON.stringify({
            sourceStates:source.observedStates,
            survivors:rows.length,
            split:[a.length,b.length],
            storyMin:rows[0].storyGrindBattles,
            storyMax:rows.at(-1).storyGrindBattles,
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: red-frontier-band-v1-manifest
          path: hgss_story_sim/results/red-frontier/survivor-manifest-v1.json
          if-no-files-found: error

  red_a:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.matrix_a) }}
    env:
      HGSS_FETCH_ATTEMPTS: 8
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: red-frontier-band-v1-manifest
          path: hgss_story_sim/results/red-frontier
      - run: npm install
      - name: Stagger raw GitHub fetches
        run: sleep $(( (${{ matrix.state }} % 8) * 2 ))
      - name: Evaluate Red25/Red50
        run: |
          mkdir -p results/red-frontier/band-v1
          node - "${{ matrix.state }}" <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const ordinal=Number(process.argv[2]);
          const manifest=JSON.parse(fs.readFileSync('results/red-frontier/survivor-manifest-v1.json','utf8'));
          const state=manifest.states[ordinal];
          if(!state || state.ordinal!==ordinal) throw new Error('missing survivor state '+ordinal);
          const plan64=Buffer.from(JSON.stringify(state.storyPlan),'utf8').toString('base64');
          const args=[
            'src/cli.mjs','route-exp-practical-grind',
            '--version=HEARTGOLD','--starter=Cyndaquil',
            '--evolution-policy=trade-aware',
            '--team-keys='+state.teamKeys.join(','),
            '--exp-profile=normal-route','--exp-allocator='+state.allocator,
            '--entry-level=expected','--same-stage-join=map-order',
            '--resources=all','--spend-policy=natural',
            '--story-targets=0.5','--red-targets=0.25,0.5',
            '--repair-mode=global-only','--lean-repair=true',
            '--screen-runs=1','--verify-runs=2','--repair-runs=4','--final-runs=8',
            '--max-repair-rounds=16',
            '--reuse-story-plan-base64='+plan64,
          ];
          const started=Date.now();
          const p=cp.spawnSync(process.execPath,args,{
            cwd:process.cwd(),encoding:'utf8',env:process.env,
            maxBuffer:32*1024*1024,timeout:110*60*1000
          });
          const elapsedSeconds=Math.round((Date.now()-started)/1000);
          const out={
            ordinal,index:state.index,allocator:state.allocator,
            storyGrindBattles:state.storyGrindBattles,
            teamKeys:state.teamKeys,sources:state.sources,elapsedSeconds
          };
          if(p.status!==0){
            out.error=(p.stderr||p.stdout||'unknown failure').slice(-10000);
          }else{
            try{
              const d=JSON.parse(p.stdout);
              const s=d.storyFrontier?.[0]||{};
              out.repairConverged=Boolean(s.repairConverged);
              out.reusedStoryPlan=Boolean(s.reusedStoryPlan);
              out.storyWorstBossWinRate=Number(s.storyWorstBossWinRate||0);
              out.redBaseline=s.redBaseline||null;
              out.redFrontier=s.redFrontier||[];
              out.evaluationCacheEntries=Number(d.evaluationCacheEntries||0);
            }catch(e){
              out.error='JSON parse: '+e.message;
            }
          }
          fs.writeFileSync('results/red-frontier/band-v1/state-'+ordinal+'.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            ordinal,index:out.index,allocator:out.allocator,story:out.storyGrindBattles,
            elapsedSeconds,repairConverged:out.repairConverged??false,
            red:out.redFrontier?.map(x=>({
              target:x.targetWinRate,total:x.totalGrindBattles,
              additional:x.additionalRedGrindBattles,achieved:x.achievedWinRate
            }))||[],error:Boolean(out.error)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-frontier-band-v1-state-${{ matrix.state }}
          path: hgss_story_sim/results/red-frontier/band-v1/state-${{ matrix.state }}.json
          if-no-files-found: error

  red_b:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.matrix_b) }}
    env:
      HGSS_FETCH_ATTEMPTS: 8
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: red-frontier-band-v1-manifest
          path: hgss_story_sim/results/red-frontier
      - run: npm install
      - name: Stagger raw GitHub fetches
        run: sleep $(( (${{ matrix.state }} % 8) * 2 ))
      - name: Evaluate Red25/Red50
        run: |
          mkdir -p results/red-frontier/band-v1
          node - "${{ matrix.state }}" <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const ordinal=Number(process.argv[2]);
          const manifest=JSON.parse(fs.readFileSync('results/red-frontier/survivor-manifest-v1.json','utf8'));
          const state=manifest.states[ordinal];
          if(!state || state.ordinal!==ordinal) throw new Error('missing survivor state '+ordinal);
          const plan64=Buffer.from(JSON.stringify(state.storyPlan),'utf8').toString('base64');
          const args=[
            'src/cli.mjs','route-exp-practical-grind',
            '--version=HEARTGOLD','--starter=Cyndaquil',
            '--evolution-policy=trade-aware',
            '--team-keys='+state.teamKeys.join(','),
            '--exp-profile=normal-route','--exp-allocator='+state.allocator,
            '--entry-level=expected','--same-stage-join=map-order',
            '--resources=all','--spend-policy=natural',
            '--story-targets=0.5','--red-targets=0.25,0.5',
            '--repair-mode=global-only','--lean-repair=true',
            '--screen-runs=1','--verify-runs=2','--repair-runs=4','--final-runs=8',
            '--max-repair-rounds=16',
            '--reuse-story-plan-base64='+plan64,
          ];
          const started=Date.now();
          const p=cp.spawnSync(process.execPath,args,{
            cwd:process.cwd(),encoding:'utf8',env:process.env,
            maxBuffer:32*1024*1024,timeout:110*60*1000
          });
          const elapsedSeconds=Math.round((Date.now()-started)/1000);
          const out={
            ordinal,index:state.index,allocator:state.allocator,
            storyGrindBattles:state.storyGrindBattles,
            teamKeys:state.teamKeys,sources:state.sources,elapsedSeconds
          };
          if(p.status!==0){
            out.error=(p.stderr||p.stdout||'unknown failure').slice(-10000);
          }else{
            try{
              const d=JSON.parse(p.stdout);
              const s=d.storyFrontier?.[0]||{};
              out.repairConverged=Boolean(s.repairConverged);
              out.reusedStoryPlan=Boolean(s.reusedStoryPlan);
              out.storyWorstBossWinRate=Number(s.storyWorstBossWinRate||0);
              out.redBaseline=s.redBaseline||null;
              out.redFrontier=s.redFrontier||[];
              out.evaluationCacheEntries=Number(d.evaluationCacheEntries||0);
            }catch(e){
              out.error='JSON parse: '+e.message;
            }
          }
          fs.writeFileSync('results/red-frontier/band-v1/state-'+ordinal+'.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            ordinal,index:out.index,allocator:out.allocator,story:out.storyGrindBattles,
            elapsedSeconds,repairConverged:out.repairConverged??false,
            red:out.redFrontier?.map(x=>({
              target:x.targetWinRate,total:x.totalGrindBattles,
              additional:x.additionalRedGrindBattles,achieved:x.achievedWinRate
            }))||[],error:Boolean(out.error)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-frontier-band-v1-state-${{ matrix.state }}
          path: hgss_story_sim/results/red-frontier/band-v1/state-${{ matrix.state }}.json
          if-no-files-found: error

  summarize:
    needs: [prepare, red_a, red_b]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: red-frontier-band-v1-manifest
          path: hgss_story_sim/results/red-frontier

      - name: Download state artifacts sequentially
        run: |
          set -euo pipefail
          mkdir -p results/red-frontier/band-v1-all /tmp/red-band-artifacts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|test("^red-frontier-band-v1-state-[0-9]+$")) | [.id,.name] | @tsv' \
            > /tmp/red-band.tsv
          count=$(wc -l < /tmp/red-band.tsv)
          echo "state artifact count=$count"
          while IFS=$'\t' read -r id name; do
            zip="/tmp/red-band-artifacts/${name}.zip"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"; then
                ok=1
                break
              fi
              sleep $((attempt*3))
            done
            test "$ok" -eq 1
            unzip -oq "$zip" -d results/red-frontier/band-v1-all
            rm -f "$zip"
            sleep 0.12
          done < /tmp/red-band.tsv

      - name: Build 3-axis Pareto summary
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('results/red-frontier/survivor-manifest-v1.json','utf8'));
          const dir='results/red-frontier/band-v1-all';
          const rows=fs.existsSync(dir)
            ? fs.readdirSync(dir).filter(x=>/^state-\d+\.json$/.test(x))
              .map(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')))
              .sort((a,b)=>a.ordinal-b.ordinal)
            : [];
          const ok=rows.filter(r=>!r.error&&r.repairConverged&&Array.isArray(r.redFrontier)&&r.redFrontier.length===2);
          function coord(r,target){
            return r.redFrontier.find(x=>Number(x.targetWinRate)===target)?.totalGrindBattles ?? Infinity;
          }
          const enriched=ok.map(r=>({
            ...r,
            red25TotalGrindBattles:Number(coord(r,0.25)),
            red50TotalGrindBattles:Number(coord(r,0.5)),
          }));
          const pareto=enriched.filter((r,i)=>!enriched.some((o,j)=>{
            if(i===j) return false;
            const noWorse=
              Number(o.storyGrindBattles)<=Number(r.storyGrindBattles) &&
              Number(o.red25TotalGrindBattles)<=Number(r.red25TotalGrindBattles) &&
              Number(o.red50TotalGrindBattles)<=Number(r.red50TotalGrindBattles);
            const strict=
              Number(o.storyGrindBattles)<Number(r.storyGrindBattles) ||
              Number(o.red25TotalGrindBattles)<Number(r.red25TotalGrindBattles) ||
              Number(o.red50TotalGrindBattles)<Number(r.red50TotalGrindBattles);
            return noWorse&&strict;
          })).sort((a,b)=>
            a.storyGrindBattles-b.storyGrindBattles ||
            a.red25TotalGrindBattles-b.red25TotalGrindBattles ||
            a.red50TotalGrindBattles-b.red50TotalGrindBattles
          );
          const summary={
            schemaVersion:1,
            expectedStates:manifest.stateCount,
            observedStates:rows.length,
            successfulStates:ok.length,
            errorStates:rows.filter(r=>r.error).length,
            storyPlanRejectedStates:rows.filter(r=>!r.error&&!r.repairConverged).length,
            selection:manifest.selection,
            incumbent:manifest.incumbent,
            pareto,
            rows:enriched,
            errors:rows.filter(r=>r.error),
            rejected:rows.filter(r=>!r.error&&!r.repairConverged),
          };
          fs.writeFileSync('results/red-frontier/band-v1-summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify({
            expectedStates:summary.expectedStates,
            observedStates:summary.observedStates,
            successfulStates:summary.successfulStates,
            errorStates:summary.errorStates,
            storyPlanRejectedStates:summary.storyPlanRejectedStates,
            pareto:pareto.map(r=>({
              ordinal:r.ordinal,index:r.index,allocator:r.allocator,
              story:r.storyGrindBattles,red25:r.red25TotalGrindBattles,red50:r.red50TotalGrindBattles,
              teamKeys:r.teamKeys
            }))
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: red-frontier-band-v1-summary
          path: hgss_story_sim/results/red-frontier/band-v1-summary.json
          if-no-files-found: error
