          - group: s75-r50
            label: staged-fallback
            story_target: "0.75"
            red_target: "0.5"
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Poliwag::Poliwag->Politoed#2,Combee::Combee->Vespiquen#1,Wynaut::Wobbuffet->Wobbuffet#1,Onix::Steelix->Steelix#1,Sneasel::Sneasel->Weavile#1"
            team_preset: ""
