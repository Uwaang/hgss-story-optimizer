name: complete-route-major-teams-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read

jobs:
  evaluate:
    if: contains(github.event.head_commit.message, '[complete-route-major-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - id: A
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Geodude::Geodude->Golem#1,Slowpoke::Slowpoke->Slowbro#1,Pineco::Pineco->Forretress#1,Mareep::Mareep->Ampharos#1,Rhyhorn::Rhyhorn->Rhyperior#1"
          - id: B
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1"
          - id: D
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1"
          - id: N03
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1,Chinchou::Lanturn->Lanturn#1,Horsea::Horsea->Kingdra#1"
          - id: N04
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1,Chinchou::Lanturn->Lanturn#1,Sneasel::Sneasel->Sneasel#1"
          - id: Retry45
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Phanpy::Donphan->Donphan#1,Chinchou::Lanturn->Lanturn#1,Diglett::Dugtrio->Dugtrio#1,Ponyta::Rapidash->Rapidash#1"
          - id: KingdraNew
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Geodude::Graveler->Golem#1,Wynaut::Wobbuffet->Wobbuffet#1,Nidoran-F::Nidorina->Nidorina#1,Horsea::Horsea->Kingdra#1"
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: node --check src/cli.mjs
      - name: Evaluate complete natural route
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-evaluate \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="${{ matrix.team_keys }}" \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --runs=100 \
            > "results/complete-${{ matrix.id }}.json"
      - name: Assert complete route
        run: |
          jq -e '
            .routeProfile == "complete" and
            (.checkpoints | map(.boss) | index("Will 2")) != null and
            (.checkpoints | map(.boss) | index("Lance 2")) != null and
            (.checkpoints | map(.boss) | index("Red")) != null
          ' "results/complete-${{ matrix.id }}.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-${{ matrix.id }}
          path: hgss_story_sim/results/complete-${{ matrix.id }}.json
          if-no-files-found: error

  report:
    if: contains(github.event.head_commit.message, '[complete-route-major-v1]')
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: complete-route-*
          path: results
      - name: Build grouped win-rate report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const groups = [
            ['Johto gyms', ['Falkner','Bugsy','Whitney','Morty','Chuck','Jasmine','Pryce','Clair']],
            ['Elite Four 1', ['Will','Koga','Bruno','Karen','Lance']],
            ['Kanto gyms', ['Lt. Surge','Sabrina','Erika','Janine','Misty','Brock','Blaine','Blue']],
            ['Elite Four 2', ['Will 2','Koga 2','Bruno 2','Karen 2','Lance 2']],
            ['Final', ['Red']],
          ];
          const order = ['A','B','D','N03','N04','Retry45','KingdraNew'];
          const rows = [];

          for (const dir of fs.readdirSync('results')) {
            const full = path.join('results', dir);
            if (!fs.statSync(full).isDirectory()) continue;
            const file = fs.readdirSync(full).find(x => x.endsWith('.json'));
            if (!file) continue;
            const data = JSON.parse(fs.readFileSync(path.join(full,file),'utf8'));
            const id = file.replace(/^complete-/,'').replace(/\.json$/,'');
            const byBoss = Object.fromEntries((data.checkpoints || []).map(cp => [cp.boss, cp]));
            const selected = Object.fromEntries(groups.flatMap(([, bosses]) =>
              bosses.map(boss => [boss, Number(byBoss[boss]?.winRate || 0)])
            ));
            const allSelected = Object.values(selected);
            const mean = allSelected.reduce((a,b)=>a+b,0) / allSelected.length;
            const geometric = Math.exp(
              allSelected.reduce((sum,p)=>sum+Math.log(Math.max(1e-6, Math.min(1-1e-6, p))),0) /
              allSelected.length
            );
            rows.push({
              id,
              team: data.finalTeam,
              finalLevels: data.finalLevels,
              selectedBossMeanWinRate: mean,
              selectedBossGeometricRaw: geometric,
              bosses: selected,
              routeProfile: data.routeProfile,
            });
          }
          rows.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));

          const summary = {schemaVersion:1, runsPerBoss:100, groups:Object.fromEntries(groups), rows};
          fs.writeFileSync('complete-route-major-teams-v1.json', JSON.stringify(summary,null,2));

          const pct = x => (100*x).toFixed(0) + '%';
          const out = ['# Complete-route 100-run win rates',''];
          for (const [group,bosses] of groups) {
            out.push('## '+group,'');
            out.push('| Team | '+bosses.join(' | ')+' |');
            out.push('|---|'+bosses.map(()=> '---:').join('|')+'|');
            for (const row of rows) {
              out.push('| '+row.id+' | '+bosses.map(b=>pct(row.bosses[b])).join(' | ')+' |');
            }
            out.push('');
          }
          out.push('## Overall selected-boss summary','');
          out.push('| Team | Mean win rate | Raw geometric mean |');
          out.push('|---|---:|---:|');
          for (const row of rows) {
            out.push('| '+row.id+' | '+pct(row.selectedBossMeanWinRate)+' | '+pct(row.selectedBossGeometricRaw)+' |');
          }
          fs.writeFileSync('complete-route-major-teams-v1.md', out.join('\n')+'\n');
          console.log(out.join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-major-teams-v1
          path: |
            complete-route-major-teams-v1.json
            complete-route-major-teams-v1.md
          if-no-files-found: error
