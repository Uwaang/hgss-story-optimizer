name: research-v2-m2-e4-sequential-foundation

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem

jobs:
  compare:
    if: contains(github.event.head_commit.message, '[research-v2-m2-e4-foundation]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: staged-fallback
            team_preset: staged-fallback
          - label: scheduler-d-quagsire
            team_preset: d-quagsire
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smokes
        run: |
          node src/cli.mjs trainer-ai-smoke
          node src/cli.mjs exp-scheduler-v1-smoke
      - name: First E4 sequential compare
        env:
          LABEL: ${{ matrix.label }}
          TEAM_PRESET: ${{ matrix.team_preset }}
        run: |
          set -euo pipefail
          mkdir -p results/m2
          node src/cli.mjs e4-sequential-compare \
            --chain=first \
            --team-preset="$TEAM_PRESET" \
            --runs=32 \
            > "results/m2/${LABEL}.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const label=process.env.LABEL;
          const d=JSON.parse(fs.readFileSync('results/m2/'+label+'.json','utf8'));
          console.log(JSON.stringify({
            label,
            team:d.team,
            runs:d.runs,
            independentProduct:d.independent.productWinRate,
            sequentialClearRate:d.sequential.clearRate,
            delta:d.deltaClearRate,
            sequentialRows:d.sequential.rows.map(r=>({
              boss:r.boss,
              reached:r.reached,
              cleared:r.cleared,
              conditionalWinRate:r.conditionalWinRate,
              failedAt:r.failedAt,
              levels:r.levels
            })),
            entryMoves:d.entryMoves,
            moveProgression:d.moveProgression
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-foundation-${{ matrix.label }}
          path: hgss_story_sim/results/m2/${{ matrix.label }}.json
          if-no-files-found: error

  summarize:
    needs: compare
    if: always() && needs.compare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m2-e4-foundation-*
          path: hgss_story_sim/results/m2
          merge-multiple: true
      - name: Summarize
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='results/m2';
          const rows=fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort().map(file=>{
            const d=JSON.parse(fs.readFileSync(dir+'/'+file,'utf8'));
            return {
              label:file.replace(/\.json$/,''),
              team:d.team,
              independentProduct:d.independent.productWinRate,
              sequentialClearRate:d.sequential.clearRate,
              delta:d.deltaClearRate,
              bosses:d.sequential.rows.map(r=>({
                boss:r.boss,
                conditionalWinRate:r.conditionalWinRate,
                reached:r.reached
              }))
            };
          });
          fs.writeFileSync(dir+'/summary.json',JSON.stringify({schemaVersion:1,rows},null,2));
          console.log(JSON.stringify({rows},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-foundation-summary
          path: hgss_story_sim/results/m2/summary.json
          if-no-files-found: error
