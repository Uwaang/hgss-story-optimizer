name: research-v2-grind-aware-prefix-retention-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-grind-aware-prefix-retention-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-grind-aware-selective3-*
          path: hgss_story_sim/results/selective3
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38142061192
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-grind-aware-promotion3
          path: hgss_story_sim/results/promotion3
          repository: Uwaang/hgss-story-optimizer
          run-id: 38142061192
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-grind-aware-beam3
          path: hgss_story_sim/results/beam3
          repository: Uwaang/hgss-story-optimizer
          run-id: 38142061192
          github-token: ${{ github.token }}
      - name: Audit historical-control prefix retention and grind pressure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=xs=>[...(xs||[])].sort().join('|');
          const targets={
            idx30:[
              'Cyndaquil::Cyndaquil->Typhlosion#1',
              'Abra::Abra->Alakazam#1',
              'Rhyhorn::Rhyhorn->Rhyperior#1'
            ],
            D:[
              'Cyndaquil::Cyndaquil->Typhlosion#1',
              'Magnemite::Magnemite->Magneton#1',
              'Magikarp::Magikarp->Gyarados#1'
            ],
            B:[
              'Cyndaquil::Cyndaquil->Typhlosion#1',
              'Magnemite::Magnemite->Magneton#1',
              'Geodude::Geodude->Golem#1'
            ]
          };
          const retry=e=>{
            let s=0;
            for(const r of e?.rows||[]){
              if(r?.skipped) continue;
              const w=Number(r.wins||0), l=Number(r.losses||0), t=Number(r.ties||0);
              const p=(w+1)/(w+l+t+2);
              s+=(1-p)/p;
            }
            return s;
          };
          const geo=e=>{
            const ps=[];
            for(const r of e?.rows||[]){
              if(r?.skipped) continue;
              const w=Number(r.wins||0), l=Number(r.losses||0), t=Number(r.ties||0);
              ps.push((w+1)/(w+l+t+2));
            }
            return ps.length?Math.exp(ps.reduce((s,p)=>s+Math.log(Math.max(1e-12,p)),0)/ps.length):0;
          };
          const mean=e=>{
            let w=0,n=0;
            for(const r of e?.rows||[]){
              if(r?.skipped) continue;
              w+=Number(r.wins||0); n+=Number(r.runs||0);
            }
            return n?w/n:0;
          };
          const projected=e=>({
            ...e,
            rows:(e?.rows||[]).map(r=>{
              if(r?.skipped||Number(r.wins||0)!==0) return r;
              return {...r,runs:64,wins:0,losses:64,ties:0,winRate:0};
            })
          });
          const by=new Map();
          for(const file of fs.readdirSync('results/selective3').filter(x=>x.startsWith('selective3-')&&x.endsWith('.json'))){
            const d=JSON.parse(fs.readFileSync('results/selective3/'+file,'utf8'));
            for(const r of d.rescored||[]) by.set(key(r.teamKeys),r);
          }
          const rows=[...by.values()].map(r=>{
            const p=projected(r.evaluation);
            return {
              key:key(r.teamKeys),teamKeys:r.teamKeys,
              projectedRetry:retry(p),projectedGeo:geo(p),projectedMean:mean(p),
              proxy:r.evaluation?.routeGrindProxy?.expectedBattles??null,
              zeroRows:(r.evaluation?.rows||[]).filter(x=>!x.skipped&&Number(x.wins||0)===0).length
            };
          });
          const combat=[...rows].sort((a,b)=>
            a.projectedRetry-b.projectedRetry ||
            b.projectedGeo-a.projectedGeo ||
            b.projectedMean-a.projectedMean ||
            a.key.localeCompare(b.key)
          );
          const combatRank=new Map(combat.map((r,i)=>[r.key,i+1]));
          const promotion=JSON.parse(fs.readFileSync('results/promotion3/promotion3.json','utf8'));
          const promoted=new Set((promotion.beam||[]).map(r=>key(r.teamKeys)));
          const final=JSON.parse(fs.readFileSync('results/beam3/beam3.json','utf8'));
          const finalKeys=new Set((final.beam||[]).map(r=>key(r.teamKeys)));
          const audit={};
          for(const [name,ks] of Object.entries(targets)){
            const k=key(ks), r=rows.find(x=>x.key===k);
            audit[name]={
              generated:Boolean(r),
              combatProjectedRank:r?combatRank.get(k):null,
              projectedRetry:r?.projectedRetry??null,
              projectedGeo:r?.projectedGeo??null,
              projectedMean:r?.projectedMean??null,
              proxy:r?.proxy??null,
              zeroRows:r?.zeroRows??null,
              promoted64:promoted.has(k),
              finalBeam16:finalKeys.has(k)
            };
          }
          const topCombat=combat.slice(0,20);
          const finalRows=(final.beam||[]).map(r=>{
            const k=key(r.teamKeys), src=rows.find(x=>x.key===k);
            return {
              teamKeys:r.teamKeys,
              combatProjectedRank:src?combatRank.get(k):null,
              projectedRetry:src?.projectedRetry??null,
              proxy:r.evaluation?.routeGrindProxy?.expectedBattles??null,
              finalRetry:retry(r.evaluation),
              finalGeo:geo(r.evaluation),
              finalMean:mean(r.evaluation)
            };
          });
          console.log(JSON.stringify({
            schemaVersion:1,
            sourceStates:rows.length,
            targets:audit,
            top20CombatOnlyProjected:topCombat,
            finalBeam16:finalRows
          },null,2));
          NODE
