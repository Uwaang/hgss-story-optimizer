name: route-grind-proxy-regression

on:
  push:
    branches:
      - exp/route-grind-proxy-v1

concurrency:
  group: route-grind-proxy-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  proxy_fixture:
    if: contains(github.event.head_commit.message, '[route-grind-proxy]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: A
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Geodude::Geodude->Golem#1,Slowpoke::Slowpoke->Slowbro#1,Pineco::Pineco->Forretress#1,Mareep::Mareep->Ampharos#1,Rhyhorn::Rhyhorn->Rhyperior#1"
          - id: B
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1"
          - id: D
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1"
          - id: N03
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1,Chinchou::Lanturn->Lanturn#1,Horsea::Horsea->Kingdra#1"
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: |
          node --check src/cli.mjs
          node --check src/exp-budget.mjs
      - name: Evaluate proxy fixture ${{ matrix.id }}
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-evaluate \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="${{ matrix.team_keys }}" \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --route-grind-proxy=true --route-grind-proxy-target=0.5 \
            --runs=2 \
            > "results/proxy-fixture-${{ matrix.id }}.json"
      - name: Assert proxy fixture ${{ matrix.id }}
        run: |
          jq -e '
            .assumptions.routeGrindProxy == true and
            .assumptions.routeGrindProxyTarget == 0.5 and
            .routeGrindProxy.enabled == true and
            .routeGrindProxy.version == 2 and
            (.routeGrindProxy.expectedBattles | type) == "number" and
            .routeGrindProxy.expectedBattles >= 0 and
            (.routeGrindProxy.legacyExpectedBattles | type) == "number" and
            .routeGrindProxy.legacyExpectedBattles >= 0 and
            (.routeGrindProxy.cumulativeGrindExp | type) == "number" and
            .routeGrindProxy.cumulativeGrindExp >= 0 and
            .routeGrindProxy.unknownCheckpoints == 0
          ' "results/proxy-fixture-${{ matrix.id }}.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: route-grind-proxy-fixture-${{ matrix.id }}
          path: hgss_story_sim/results/proxy-fixture-${{ matrix.id }}.json
          if-no-files-found: error

  candidate_recall:
    if: contains(github.event.head_commit.message, '[route-grind-proxy]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Proxy-aware candidate recall probe
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-search \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=max --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=story-clear \
            --route-grind-proxy=true --route-grind-proxy-target=0.5 \
            --screen-runs=1 --runs=1 --final-runs=1 \
            --candidate-cap=36 --beam-width=2 \
            > results/route-grind-proxy-recall.json
      - name: Report reference candidate recall
        run: |
          jq '
            [.selectedCandidateDetails[].searchKey] as $keys |
            [
              "Cyndaquil::Cyndaquil->Typhlosion#1",
              "Geodude::Geodude->Golem#1",
              "Slowpoke::Slowpoke->Slowbro#1",
              "Pineco::Pineco->Forretress#1",
              "Mareep::Mareep->Ampharos#1",
              "Rhyhorn::Rhyhorn->Rhyperior#1",
              "Magnemite::Magnemite->Magneton#1",
              "Abra::Abra->Alakazam#1",
              "Wooper::Quagsire->Quagsire#1",
              "Magikarp::Magikarp->Gyarados#1",
              "Gastly::Gastly->Gengar#1",
              "Larvitar::Pupitar->Tyranitar#1",
              "Lapras::Lapras->Lapras#1",
              "Chinchou::Lanturn->Lanturn#1",
              "Horsea::Horsea->Kingdra#1"
            ] as $required |
            {
              selectedCount: ($keys | length),
              missing: [$required[] as $k | select(($keys | index($k)) == null) | $k],
              present: [$required[] as $k | select(($keys | index($k)) != null) | $k]
            }
          ' results/route-grind-proxy-recall.json

      - name: Assert reference candidate recall
        run: |
          jq -e '
            .assumptions.routeGrindProxy == true and
            .assumptions.routeGrindProxyTarget == 0.5 and
            .assumptions.candidateCap == 36 and
            .assumptions.beamWidth == 2 and
            (
              [.selectedCandidateDetails[].searchKey] as $keys |
              [
                "Cyndaquil::Cyndaquil->Typhlosion#1",
                "Geodude::Geodude->Golem#1",
                "Slowpoke::Slowpoke->Slowbro#1",
                "Pineco::Pineco->Forretress#1",
                "Mareep::Mareep->Ampharos#1",
                "Rhyhorn::Rhyhorn->Rhyperior#1",
                "Magnemite::Magnemite->Magneton#1",
                "Abra::Abra->Alakazam#1",
                "Wooper::Quagsire->Quagsire#1",
                "Magikarp::Magikarp->Gyarados#1",
                "Gastly::Gastly->Gengar#1",
                "Larvitar::Pupitar->Tyranitar#1",
                "Lapras::Lapras->Lapras#1",
                "Chinchou::Lanturn->Lanturn#1",
                "Horsea::Horsea->Kingdra#1"
              ] as $required |
              ([$required[] as $k | ($keys | index($k)) != null] | all)
            ) and
            ([.selectedCandidateDetails[].routeGrindProxyBattles] | all(type == "number")) and
            ([.beamTrace[].selected[].routeGrindProxyBattles] | all(type == "number"))
          ' results/route-grind-proxy-recall.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-grind-proxy-recall
          path: hgss_story_sim/results/route-grind-proxy-recall.json
          if-no-files-found: warn

  collect_fixture:
    if: always() && needs.proxy_fixture.result == 'success'
    needs: proxy_fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: route-grind-proxy-fixture-*
          path: inputs
          merge-multiple: true
      - name: Summarize proxy fixtures
        run: |
          jq -s '
            map({
              id: (.team | map(.species) | join("/")),
              teamKeys: [.team[].key],
              expectedBattles: .routeGrindProxy.expectedBattles,
              rawExpectedBattles: .routeGrindProxy.rawExpectedBattles,
              legacyExpectedBattles: .routeGrindProxy.legacyExpectedBattles,
              legacyRawExpectedBattles: .routeGrindProxy.legacyRawExpectedBattles,
              cumulativeGrindExp: .routeGrindProxy.cumulativeGrindExp,
              contributingCheckpoints: .routeGrindProxy.contributingCheckpoints,
              worstBossWinRate: .performance.worstBossWinRate,
              storyClearGeometricScore: .performance.storyClearGeometricScore
            })
            | sort_by(.expectedBattles)
          ' inputs/*.json > route-grind-proxy-fixture-summary.json
          cat route-grind-proxy-fixture-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: route-grind-proxy-fixture-summary
          path: route-grind-proxy-fixture-summary.json
          if-no-files-found: error
