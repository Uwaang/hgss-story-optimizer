name: research-v2-exp-scheduler-coordinate-scan
# SCRUM-417 bounded frontier proxy screen

on:
  push:
    branches:
      - research/v2-exp-scheduler-v1

permissions:
  contents: read

jobs:
  frontier-screen:
    if: contains(github.event.head_commit.message, '[research-v2-exp-scheduler-frontier-screen]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Recipient-state regression smoke
        run: node src/cli.mjs exp-scheduler-v1-smoke
      - name: Screen one-coordinate frontier expansions
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs exp-scheduler-v1-frontier-screen \
            --runs=1 \
            --route-grind-proxy-target=0.5 \
            > results/research-v2/frontier-screen.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/frontier-screen.json','utf8'));
          const slim=row=>({
            stateKey:row.stateKey,
            schedule:row.schedule,
            retry:row.expectedRetryFailures,
            geometric:row.geometricScore,
            mean:row.meanWinRate,
            progress:row.battleProgressScore,
            grindProxyBattles:row.grindProxyBattles
          });
          console.log(JSON.stringify({
            assumptions:r.assumptions,
            frontierCount:r.frontierCount,
            frontier:r.frontier.map(slim),
            top25ByGrind:r.top25ByGrind.map(slim)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-exp-scheduler-frontier-screen
          path: hgss_story_sim/results/research-v2/frontier-screen.json
          if-no-files-found: error
