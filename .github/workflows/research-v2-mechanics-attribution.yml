name: research-v2-mechanics-attribution

on:
  push:
    branches:
      - research/v2-rebase

permissions:
  contents: read

jobs:
  attribute:
    if: contains(github.event.head_commit.message, '[research-v2-mechanics-attribution]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: legacy
            dynamic_hp: "0"
            request_switch: "0"
          - label: choice_only
            dynamic_hp: "0"
            request_switch: "1"
          - label: dynamic_only
            dynamic_hp: "1"
            request_switch: "0"
    env:
      HGSS_FETCH_ATTEMPTS: 10
      HGSS_SMART_DYNAMIC_HP_POWER: ${{ matrix.dynamic_hp }}
      HGSS_SMART_REQUEST_AWARE_SWITCH: ${{ matrix.request_switch }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Reprice idx30 saturation
        run: |
          mkdir -p results/research-v2/mechanics-attribution
          node src/cli.mjs route-exp-practical-grind \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1,Chinchou::Lanturn->Lanturn#1,Larvitar::Pupitar->Tyranitar#1" \
            --exp-profile=normal-route --exp-allocator=boss-aware-saturation \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --story-targets=0.5 --red-targets=0.25,0.5 \
            --repair-mode=global-only --lean-repair=true \
            --screen-runs=8 --verify-runs=16 --repair-runs=32 --final-runs=100 \
            --max-repair-rounds=24 \
            > results/research-v2/mechanics-attribution/${{ matrix.label }}.json

      - name: Summarize
        run: |
          LABEL="${{ matrix.label }}" node <<'NODE'
          const fs=require('fs');
          const label=process.env.LABEL;
          const d=JSON.parse(fs.readFileSync('results/research-v2/mechanics-attribution/'+label+'.json','utf8'));
          const s=d.storyFrontier?.[0]||{};
          const r25=s.redFrontier?.find(x=>Number(x.targetWinRate)===0.25)||{};
          const r50=s.redFrontier?.find(x=>Number(x.targetWinRate)===0.5)||{};
          const out={
            label,
            dynamicHp:process.env.HGSS_SMART_DYNAMIC_HP_POWER,
            requestAwareSwitch:process.env.HGSS_SMART_REQUEST_AWARE_SWITCH,
            story:Number(s.storyGrindBattles),
            red25:Number(r25.totalGrindBattles),
            red50:Number(r50.totalGrindBattles),
            storyWorstBossWinRate:Number(s.storyWorstBossWinRate),
            repairConverged:Boolean(s.repairConverged),
            repairRounds:Number(s.repairRounds||0),
            storyPlan:s.storyPlan||{},
          };
          fs.writeFileSync('results/research-v2/mechanics-attribution/'+label+'-summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-mechanics-attribution-${{ matrix.label }}
          path: |
            hgss_story_sim/results/research-v2/mechanics-attribution/${{ matrix.label }}.json
            hgss_story_sim/results/research-v2/mechanics-attribution/${{ matrix.label }}-summary.json
          if-no-files-found: error

  summarize:
    needs: attribute
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-mechanics-attribution-*
          path: hgss_story_sim/results/research-v2/mechanics-attribution-all
          merge-multiple: true
      - run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='results/research-v2/mechanics-attribution-all';
          const rows=fs.readdirSync(dir)
            .filter(f=>f.endsWith('-summary.json'))
            .map(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')))
            .sort((a,b)=>a.label.localeCompare(b.label));
          const both={label:'both',story:400,red25:1082,red50:1438,sourceRun:37894951587};
          const baseline={story:322,red25:1040,red50:1349,sourceRun:37755171480};
          console.log(JSON.stringify({baseline,rows,both},null,2));
          fs.writeFileSync('results/research-v2/mechanics-attribution-summary.json',JSON.stringify({baseline,rows,both},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-mechanics-attribution-summary
          path: hgss_story_sim/results/research-v2/mechanics-attribution-summary.json
