name: research-v2-m2-e4-sequential-highsample

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem

jobs:
  compare:
    if: contains(github.event.head_commit.message, '[research-v2-m2-e4-highsample]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: First E4 high-sample sequential compare
        run: |
          mkdir -p results/m2
          node src/cli.mjs e4-sequential-compare             --chain=first             --team-preset=staged-fallback             --runs=500             > results/m2/first-e4-staged-fallback-500.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('results/m2/first-e4-staged-fallback-500.json','utf8'));
          console.log(JSON.stringify({
            team:d.team,
            runs:d.runs,
            independentProduct:d.independent.productWinRate,
            independentRows:d.independent.rows,
            sequentialClearRate:d.sequential.clearRate,
            sequentialClears:d.sequential.clears,
            delta:d.deltaClearRate,
            sequentialRows:d.sequential.rows.map(r=>({
              boss:r.boss,reached:r.reached,cleared:r.cleared,
              conditionalWinRate:r.conditionalWinRate,failedAt:r.failedAt,
              levels:r.levels
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-e4-highsample-first500
          path: hgss_story_sim/results/m2/first-e4-staged-fallback-500.json
          if-no-files-found: error
