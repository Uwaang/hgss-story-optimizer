name: research-v2-m3-fallback-synergy-depth64

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk
    --route-grind-proxy=false
    --e4-grouped-route-risk=true

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[research-v2-m3-fallback-synergy-depth64]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const members=[
            'Poliwag::Poliwag->Politoed#2',
            'Combee::Combee->Vespiquen#1',
            'Wynaut::Wobbuffet->Wobbuffet#1',
            'Onix::Steelix->Steelix#1',
            'Sneasel::Sneasel->Weavile#1',
          ];
          const starter='Cyndaquil::Cyndaquil->Typhlosion#1';
          const include=[];
          for(let mask=1;mask<(1<<members.length);mask++){
            const keys=[starter];
            for(let i=0;i<members.length;i++) if(mask&(1<<i)) keys.push(members[i]);
            include.push({
              label:'m'+String(mask).padStart(2,'0'),
              size:keys.length,
              prefix:Buffer.from(JSON.stringify(keys),'utf8').toString('base64'),
            });
          }
          process.stdout.write('matrix='+JSON.stringify({include})+'\n');
          NODE

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate fallback subset at 64 runs
        run: |
          node src/cli.mjs completion-aware-explicit-evaluate \
            --prefix-base64="${{ matrix.prefix }}" --runs=64 \
            $SEARCH_ARGS > "results/${{ matrix.label }}.json"
          jq '{teamKeys,runs,metrics}' "results/${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-fallback-synergy-depth64-${{ matrix.label }}
          path: hgss_story_sim/results/${{ matrix.label }}.json
          if-no-files-found: error

  summarize:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m3-fallback-synergy-depth64-*
          path: results
          merge-multiple: true
      - name: Summarize synergy depth
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=fs.readdirSync('results').filter(x=>x.endsWith('.json')).sort();
          const rows=files.map(file=>{
            const d=JSON.parse(fs.readFileSync('results/'+file,'utf8'));
            const members=d.teamKeys.slice(1).map(k=>k.split('::')[1]?.split('->').at(-1)?.split('#')[0]||k);
            return {
              file,
              size:d.teamKeys.length,
              teamKeys:d.teamKeys,
              members,
              retry:Number(d.metrics.retry),
              geometric:Number(d.metrics.geometric),
              mean:Number(d.metrics.mean),
              progress:Number(d.metrics.progress),
            };
          });
          rows.sort((a,b)=>a.size-b.size||a.retry-b.retry||a.file.localeCompare(b.file));
          const bySize={};
          for(const row of rows){
            (bySize[row.size]??=[]).push(row);
          }
          const bestBySize=Object.fromEntries(
            Object.entries(bySize).map(([size,list])=>[
              size,
              [...list].sort((a,b)=>a.retry-b.retry)[0]
            ])
          );
          const full=rows.find(r=>r.size===6);
          const out={
            purpose:'SCRUM-423 fallback lineage synergy-depth audit',
            runs:64,
            fullTeam:full,
            bestBySize,
            rows,
          };
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-fallback-synergy-depth64-summary
          path: results/summary.json
          if-no-files-found: error
