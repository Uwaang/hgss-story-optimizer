name: complete-route-beam5-to6-enumerate-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  enumerate:
    if: contains(github.event.head_commit.message, '[beam5-to6-enumerate-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - name: Download retained 5-member checkpoint
        uses: actions/download-artifact@v4
        with:
          name: complete-route-beam5-bayesian-rescore16-v1
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37116988448
          github-token: ${{ github.token }}
      - name: Enumerate and deduplicate legal 6-member team keys without simulation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=JSON.parse(fs.readFileSync('results/input/selected5-16run-checkpoint.json','utf8'));
          const parents=cp.beam||[];
          const screened=cp.screenedKeys||[];
          if(!parents.length) throw new Error('empty 5-member checkpoint');
          if(!screened.length) throw new Error('checkpoint missing screenedKeys');

          const family=k=>String(k).split('::',1)[0];
          const map=new Map();
          const parentExpansionCounts=[];
          for(const row of parents){
            if((row.teamKeys||[]).length!==5) throw new Error('non-5-member parent');
            const existing=new Set(row.teamKeys);
            const families=new Set(row.teamKeys.map(family));
            let generated=0;
            for(const key of screened){
              if(existing.has(key)) continue;
              if(families.has(family(key))) continue;
              // The screened pool already retained only the required Cyndaquil
              // starter lineage; family uniqueness therefore reproduces the
              // remaining team legality constraint for this fixed checkpoint.
              const teamKeys=[...row.teamKeys,key];
              const canonical=[...teamKeys].sort();
              const teamKey=canonical.join('|');
              generated++;
              if(!map.has(teamKey)) map.set(teamKey,{teamKeys});
            }
            parentExpansionCounts.push(generated);
          }
          const teams=[...map.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([,v])=>v);
          const n04=new Set([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1',
            'Chinchou::Lanturn->Lanturn#1',
            'Sneasel::Sneasel->Sneasel#1'
          ]);
          const exactN04=teams.find(t=>t.teamKeys.length===6&&t.teamKeys.every(k=>n04.has(k)))||null;
          const outCp={
            ...cp,
            stage:'beam-6-enumerated',
            beam:teams.map(t=>({teamKeys:t.teamKeys,evaluation:null}))
          };
          const summary={
            fiveMemberParents:parents.length,
            screenedKeys:screened.length,
            rawParentExpansions:parentExpansionCounts.reduce((a,b)=>a+b,0),
            uniqueSixMemberTeams:teams.length,
            dedupRatio: teams.length / Math.max(1,parentExpansionCounts.reduce((a,b)=>a+b,0)),
            minChildrenPerParent:Math.min(...parentExpansionCounts),
            maxChildrenPerParent:Math.max(...parentExpansionCounts),
            meanChildrenPerParent:parentExpansionCounts.reduce((a,b)=>a+b,0)/parents.length,
            exactN04Present:Boolean(exactN04),
            exactN04TeamKeys:exactN04?.teamKeys||null
          };
          fs.writeFileSync('results/enumerated6-checkpoint.json',JSON.stringify(outCp,null,2));
          fs.writeFileSync('results/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-beam5-to6-enumerate-v1
          path: |
            hgss_story_sim/results/enumerated6-checkpoint.json
            hgss_story_sim/results/summary.json
          if-no-files-found: error
