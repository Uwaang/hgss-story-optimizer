name: research-v2-complete-prefix-recall-audit

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-complete-prefix-recall-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-complete-global-beam2-merge
          path: hgss_story_sim/results/beam2
          repository: Uwaang/hgss-story-optimizer
          run-id: 38072025480
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-complete-global-beam3-merge
          path: hgss_story_sim/results/beam3
          repository: Uwaang/hgss-story-optimizer
          run-id: 38072025480
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-complete-global-beam4-merge
          path: hgss_story_sim/results/beam4
          repository: Uwaang/hgss-story-optimizer
          run-id: 38072025480
          github-token: ${{ github.token }}
      - name: Audit control-prefix recall across actual selected beams
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const controls = {
            dCore: {
              exact: [
                'Cyndaquil::Cyndaquil->Typhlosion#1',
                'Magnemite::Magnemite->Magneton#1',
                'Gastly::Gastly->Gengar#1',
                'Rhyhorn::Rhyhorn->Rhyperior#1'
              ],
              terminal: ['Typhlosion','Magneton','Gengar','Rhyperior']
            },
            bCore: {
              exact: [
                'Cyndaquil::Cyndaquil->Typhlosion#1',
                'Magnemite::Magnemite->Magneton#1',
                'Geodude::Geodude->Golem#1',
                'Abra::Abra->Alakazam#1'
              ],
              terminal: ['Typhlosion','Magneton','Golem','Alakazam']
            }
          };

          function terminal(key) {
            const m = String(key).match(/->([^#]+)#/);
            return m ? m[1] : String(key);
          }
          function key(row) {
            return [...(row.teamKeys||[])].sort().join('|');
          }
          function metric(row) {
            return {
              retry: row.routeExpectedRetryFailures ?? null,
              geometric: row.routeRiskGeometricScore ?? null,
              mean: row.routeRiskMeanWinRate ?? null
            };
          }

          const stages = [2,3,4].map(stage => {
            const doc = JSON.parse(fs.readFileSync(`results/beam${stage}/checkpoint.json`, 'utf8'));
            const beam = doc.beam || [];
            return {
              stage,
              routeProfile: doc.config?.routeProfile,
              selectedCount: beam.length,
              teams: beam.map((row,index)=>({
                rank:index+1,
                key:key(row),
                teamKeys:row.teamKeys,
                terminals:(row.teamKeys||[]).map(terminal),
                metrics:metric(row)
              })),
              controls: Object.fromEntries(Object.entries(controls).map(([name, control]) => {
                const exactSet = new Set(control.exact);
                const terminalSet = new Set(control.terminal);
                const exactCompatible = beam
                  .map((row,index)=>({row,index}))
                  .filter(({row}) => (row.teamKeys||[]).every(k=>exactSet.has(k)))
                  .map(({row,index})=>({rank:index+1,key:key(row),teamKeys:row.teamKeys,metrics:metric(row)}));
                const terminalCompatible = beam
                  .map((row,index)=>({row,index}))
                  .filter(({row}) => (row.teamKeys||[]).every(k=>terminalSet.has(terminal(k))))
                  .map(({row,index})=>({
                    rank:index+1,
                    key:key(row),
                    teamKeys:row.teamKeys,
                    terminals:(row.teamKeys||[]).map(terminal),
                    metrics:metric(row)
                  }));
                const exactTargetRecovered = stage < 4
                  ? exactCompatible.length > 0
                  : exactCompatible.some(x=>x.teamKeys.length===control.exact.length);
                const terminalTargetRecovered = stage < 4
                  ? terminalCompatible.length > 0
                  : terminalCompatible.some(x=>x.terminals.length===control.terminal.length);
                return [name,{
                  exactTargetRecovered,
                  terminalTargetRecovered,
                  exactCompatible,
                  terminalCompatible
                }];
              }))
            };
          });

          const out = {
            schemaVersion:1,
            sourceRun:38072025480,
            routeProfile:'complete',
            controls,
            stages
          };
          fs.writeFileSync('results/complete-prefix-recall-audit.json', JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-complete-prefix-recall-audit
          path: hgss_story_sim/results/complete-prefix-recall-audit.json
          if-no-files-found: error
