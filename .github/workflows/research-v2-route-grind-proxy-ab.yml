name: research-v2-route-grind-proxy-ab

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=true

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[research-v2-route-grind-proxy-ab]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [core5, tyranitar, mismagius, xatu, steelix, rapidash, weavile]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate with practical grind proxy enabled
        run: |
          case "${{ matrix.name }}" in
            core5) EXTRA="" ;;
            tyranitar) EXTRA=',"Larvitar::Pupitar->Tyranitar#1"' ;;
            mismagius) EXTRA=',"Misdreavus::Misdreavus->Mismagius#1"' ;;
            xatu) EXTRA=',"Natu::Natu->Xatu#1"' ;;
            steelix) EXTRA=',"Onix::Steelix->Steelix#1"' ;;
            rapidash) EXTRA=',"Ponyta::Rapidash->Rapidash#1"' ;;
            weavile) EXTRA=',"Sneasel::Sneasel->Weavile#1"' ;;
          esac
          TEAM='["Cyndaquil::Cyndaquil->Typhlosion#1","Abra::Abra->Alakazam#1","Rhyhorn::Rhyhorn->Rhyperior#1","Lapras::Lapras->Lapras#1","Zubat::Golbat->Crobat#1"'"$EXTRA"']'
          PREFIX="$(printf '%s' "$TEAM" | base64 -w0)"
          node src/cli.mjs completion-aware-explicit-evaluate \
            --prefix-base64="$PREFIX" --runs=16 \
            $SEARCH_ARGS > "results/proxy-${{ matrix.name }}.json"
          node --input-type=module - "${{ matrix.name }}" <<'NODE'
          import fs from 'node:fs';
          const name=process.argv[2];
          const d=JSON.parse(fs.readFileSync('results/proxy-'+name+'.json','utf8'));
          const red=(d.evaluation?.rows||[]).find(r=>r.boss==='Red')||null;
          console.log(JSON.stringify({
            name,
            metrics:d.metrics,
            routeGrindProxy:d.evaluation?.routeGrindProxy||null,
            catchUpExp:d.evaluation?.catchUpExp,
            captureExpectedEncounters:d.evaluation?.captureSearch?.expectedEncounters,
            finalTeam:d.evaluation?.finalTeam,
            finalLevels:d.evaluation?.finalLevels,
            red:red?{wins:red.wins,runs:red.runs,battleProgressScore:red.battleProgressScore,averageOpponentFaints:red.averageOpponentFaints}:null
          },null,2));
          NODE
