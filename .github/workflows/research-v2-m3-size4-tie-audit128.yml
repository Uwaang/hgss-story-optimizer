name: research-v2-m3-size4-tie-audit128

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk
    --route-grind-proxy=false
    --e4-grouped-route-risk=true

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[research-v2-m3-size4-tie-audit128]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const T='Cyndaquil::Cyndaquil->Typhlosion#1';
          const teams=[
            ['top1',[T,'Ponyta::Rapidash->Rapidash#1','Horsea::Horsea->Kingdra#1','Seel::Dewgong->Dewgong#1']],
            ['tie-mismagius-xatu',[T,'Misdreavus::Misdreavus->Mismagius#1','Horsea::Horsea->Kingdra#1','Natu::Natu->Xatu#1']],
            ['tie-tyranitar-xatu',[T,'Larvitar::Pupitar->Tyranitar#1','Horsea::Horsea->Kingdra#1','Natu::Natu->Xatu#1']],
            ['tie-mismagius-steelix',[T,'Misdreavus::Misdreavus->Mismagius#1','Horsea::Horsea->Kingdra#1','Onix::Steelix->Steelix#1']],
            ['tie-rapidash-weavile',[T,'Ponyta::Rapidash->Rapidash#1','Horsea::Horsea->Kingdra#1','Sneasel::Sneasel->Weavile#1']],
          ];
          const include=teams.map(([label,keys])=>({
            label,
            team:Buffer.from(JSON.stringify(keys),'utf8').toString('base64')
          }));
          process.stdout.write('matrix='+JSON.stringify({include})+'\n');
          NODE

  evaluate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate detailed size4 team
        run: |
          node src/cli.mjs completion-aware-explicit-evaluate \
            --prefix-base64="${{ matrix.team }}" --runs=128 \
            $SEARCH_ARGS > "results/${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-size4-tie-audit128-${{ matrix.label }}
          path: hgss_story_sim/results/${{ matrix.label }}.json
          if-no-files-found: error

  summarize:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m3-size4-tie-audit128-*
          path: results
          merge-multiple: true
      - name: Compare boss rows and member usage
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=fs.readdirSync('results').filter(x=>x.endsWith('.json')).sort();
          const docs=files.map(file=>({file,d:JSON.parse(fs.readFileSync('results/'+file,'utf8'))}));
          function usageSummary(d){
            return Object.entries(d.evaluation?.memberUsage||{}).map(([key,u])=>{
              const rows=u?.bossUsage||[];
              return {
                key,
                runsUsed:rows.reduce((s,r)=>s+Number(r.runsUsed||0),0),
                winningRunsUsed:rows.reduce((s,r)=>s+Number(r.winningRunsUsed||0),0),
                activeTurns:rows.reduce((s,r)=>s+Number(r.activeTurns||0),0),
              };
            }).sort((a,b)=>b.activeTurns-a.activeTurns||a.key.localeCompare(b.key));
          }
          const rows=docs.map(({file,d})=>({
            file,
            teamKeys:d.teamKeys,
            metrics:d.metrics,
            bosses:(d.evaluation?.rows||[]).map(r=>({
              boss:r.boss,wins:r.wins,losses:r.losses,winRate:r.winRate,
              progress:Number(r.battleProgressScore??r.winRate??0)
            })),
            usage:usageSummary(d),
          }));
          const tieBase=rows.find(r=>r.file.includes('tie-mismagius-xatu'));
          const comparisons=rows.filter(r=>r!==tieBase).map(r=>({
            file:r.file,
            sameBossOutcomeSignature:JSON.stringify(r.bosses.map(x=>[x.boss,x.wins,x.losses,x.progress]))===
              JSON.stringify(tieBase.bosses.map(x=>[x.boss,x.wins,x.losses,x.progress])),
            changedBosses:r.bosses.map((x,i)=>{
              const b=tieBase.bosses[i];
              return {
                boss:x.boss,
                deltaWinRate:Number(x.winRate)-Number(b?.winRate||0),
                deltaProgress:Number(x.progress)-Number(b?.progress||0),
              };
            }).filter(x=>Math.abs(x.deltaWinRate)>1e-12||Math.abs(x.deltaProgress)>1e-12),
          }));
          const out={runs:128,rows,comparisons};
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m3-size4-tie-audit128-summary
          path: results/summary.json
          if-no-files-found: error
