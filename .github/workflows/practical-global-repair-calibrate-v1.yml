name: practical-global-repair-calibrate-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read

jobs:
  calibrate:
    if: contains(github.event.head_commit.message, '[practical-global-repair-calibrate-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: N04-saturation
            allocator: boss-aware-saturation
            known_story: 337
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Chinchou::Lanturn->Lanturn#1,Rhyhorn::Rhyhorn->Rhyperior#1,Sneasel::Sneasel->Sneasel#1,Lapras::Lapras->Lapras#1"
          - id: Previous-saturation
            allocator: boss-aware-saturation
            known_story: 701
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Dratini::Dragonair->Dragonite#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1,Misdreavus::Misdreavus->Misdreavus#1"
          - id: Dewgong-soft
            allocator: boss-aware-soft
            known_story: 660
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Seel::Dewgong->Dewgong#1,Sandshrew::Sandslash->Sandslash#1,Ditto::Ditto->Ditto#1,Wynaut::Wobbuffet->Wobbuffet#1"
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: node --check src/cli.mjs
      - name: Global-only story repair calibration
        shell: bash
        run: |
          mkdir -p results
          START=$(date +%s)
          node src/cli.mjs route-exp-practical-grind             --version=HEARTGOLD --starter=Cyndaquil             --evolution-policy=trade-aware             --team-keys="${{ matrix.team_keys }}"             --exp-profile=normal-route --exp-allocator="${{ matrix.allocator }}"             --entry-level=expected --same-stage-join=map-order             --resources=all --spend-policy=natural             --story-targets=0.5 --red-targets=0.25,0.5             --repair-mode=global-only --skip-red=true             --screen-runs=1 --verify-runs=2 --repair-runs=4 --final-runs=8             --max-repair-rounds=16             > "results/${{ matrix.id }}.json"
          END=$(date +%s)
          node - "${{ matrix.id }}" "${{ matrix.known_story }}" "$((END-START))" <<'NODE'
          const fs=require('fs');
          const [id,known,seconds]=process.argv.slice(2);
          const d=JSON.parse(fs.readFileSync('results/'+id+'.json','utf8'));
          const s=d.storyFrontier?.[0]||{};
          const row={
            id,
            knownHighSampleStoryGrindBattles:Number(known),
            fastStoryGrindBattles:Number(s.storyGrindBattles||0),
            fastStoryWorstBossWinRate:Number(s.storyWorstBossWinRate||0),
            repairConverged:Boolean(s.repairConverged),
            repairRounds:Number(s.repairRounds||0),
            elapsedSeconds:Number(seconds),
            evaluationCacheEntries:Number(d.evaluationCacheEntries||0),
            assumptions:d.assumptions||{}
          };
          fs.writeFileSync('results/'+id+'-summary.json',JSON.stringify(row,null,2));
          console.log(JSON.stringify(row,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: practical-global-repair-calibrate-${{ matrix.id }}
          path: |
            hgss_story_sim/results/${{ matrix.id }}.json
            hgss_story_sim/results/${{ matrix.id }}-summary.json
          if-no-files-found: error

  summarize:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: practical-global-repair-calibrate-*
          path: hgss_story_sim/results/all
          merge-multiple: true
      - name: Summarize
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('results/all').filter(x=>x.endsWith('-summary.json'));
          const rows=files.map(f=>JSON.parse(fs.readFileSync(path.join('results/all',f),'utf8')));
          rows.sort((a,b)=>a.id.localeCompare(b.id));
          console.log(JSON.stringify({rows},null,2));
          NODE
