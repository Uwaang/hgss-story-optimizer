name: research-v2-completion-screen-cap-sweep

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    if: contains(github.event.head_commit.message, '[research-v2-screen-cap-sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-screen-recall-shard-*
          path: hgss_story_sim/results/research-v2/screen
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38064415521
          github-token: ${{ github.token }}
      - name: Sweep family caps on identical current screen evidence
        run: |
          SHARDS="$(find results/research-v2/screen -name 'screen-shard-*.json' -type f | sort | paste -sd, -)"
          for CAP in 36 48 60 72 84 100; do
            node src/cli.mjs route-exp-story-screen-merge \
              --inputs="$SHARDS" --candidate-cap="$CAP" \
              --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
              --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
              --entry-level=expected --same-stage-join=map-order \
              --resources=all --spend-policy=natural \
              --objective=route-risk --route-grind-proxy=false \
              > "results/research-v2/cap-${CAP}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const caps=[36,48,60,72,84,100];
          const targets={
            gyarados:'Magikarp::Gyarados->Gyarados#1',
            blissey:'Happiny::Chansey->Blissey#1',
            donphan:'Phanpy::Donphan->Donphan#1',
            beautifly:'Wurmple::Wurmple->Beautifly#1'
          };
          const rows=caps.map(cap=>{
            const d=JSON.parse(fs.readFileSync(`results/research-v2/cap-${cap}.json`,'utf8'));
            const keys=d.screenedKeys||[];
            const selected=new Set(keys);
            return {
              cap,
              screenedCandidates:d.screenedCandidates,
              screenedCandidateFamilies:d.screenedCandidateFamilies,
              exactRecall:Object.fromEntries(Object.entries(targets).map(([name,key])=>[name,selected.has(key)])),
              blisseyFamilyKeys:keys.filter(k=>/Happiny|Chansey|Blissey/.test(k)),
              gyaradosFamilyKeys:keys.filter(k=>/Magikarp|Gyarados/.test(k))
            };
          });
          const out={schemaVersion:1,sourceRun:38064415521,scannedCandidates:155,rows};
          fs.writeFileSync('results/research-v2/screen-cap-sweep.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-completion-screen-cap-sweep
          path: hgss_story_sim/results/research-v2/screen-cap-sweep.json
          if-no-files-found: error
