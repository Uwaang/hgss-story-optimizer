name: research-v2-moveset-explicit-validate
# Lanturn + Lapras full-route 100-run finalist validation

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-explicit-validate]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Lanturn
            sets: "baseline=Hydro Pump/Thunderbolt/Signal Beam/Thunder Wave;watergun-for-hydro=Water Gun/Thunderbolt/Signal Beam/Thunder Wave;confuse-for-tbolt=Hydro Pump/Confuse Ray/Signal Beam/Thunder Wave"
          - target: Lapras
            sets: "baseline=Hydro Pump/Ice Beam/Dragon Pulse/Body Slam;surf-for-dragon=Hydro Pump/Ice Beam/Surf/Body Slam;brine-for-hydro=Brine/Ice Beam/Dragon Pulse/Body Slam"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Full-route 100-run finalist validation
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-explicit-validate \
            --level=50 --runs=100 --target="${{ matrix.target }}" \
            --sets="${{ matrix.sets }}" \
            > results/research-v2/explicit-full100.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/explicit-full100.json','utf8'));
          console.log(JSON.stringify({
            assumptions:r.assumptions,
            rows:r.rows.map(x=>({
              label:x.label,
              moves:x.moves,
              bannedMoves:x.bannedMoves,
              retry:x.actual.expectedRetryFailures,
              geometric:x.actual.geometricScore,
              mean:x.actual.meanWinRate,
              progress:x.actual.battleProgressScore,
              retryBounds95:x.actual.retryBounds95,
              usage:x.actual.targetUsage?.moveUsesByMove || {},
              bosses:x.actual.bossRows
            }))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-${{ matrix.target }}-explicit-full100
          path: hgss_story_sim/results/research-v2/explicit-full100.json
          if-no-files-found: error
