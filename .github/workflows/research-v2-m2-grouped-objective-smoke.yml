name: research-v2-m2-grouped-objective-smoke

on:
  push:
    branches:
      - research/v2-consolidated

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  HGSS_FETCH_ATTEMPTS: 8
  HGSS_BATTLE_CACHE_NAMESPACE: hgss-battle-cache-v5-p1-enditem

jobs:
  evaluate:
    if: contains(github.event.head_commit.message, '[research-v2-m2-grouped-objective-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: staged-fallback
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Poliwag::Poliwag->Politoed#2,Combee::Combee->Vespiquen#1,Wynaut::Wobbuffet->Wobbuffet#1,Onix::Steelix->Steelix#1,Sneasel::Sneasel->Weavile#1"
            schedule_b64: ""
          - label: coordinate-best
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Aipom::Aipom->Ambipom#1,Rhyhorn::Rhyhorn->Rhyperior#1,Horsea::Seadra->Kingdra#1,Ditto::Ditto->Ditto#1,Wynaut::Wobbuffet->Wobbuffet#1"
            schedule_b64: ""
          - label: scheduler-story-min
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Wooper::Wooper->Quagsire#1"
            schedule_b64: "eyJNYWduZXRvbiI6IlJlZCIsIlF1YWdzaXJlIjoiTGFuY2UiLCJSaHlwZXJpb3IiOiJNaXN0eSJ9"
          - label: scheduler-red25-min
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Wooper::Wooper->Quagsire#1"
            schedule_b64: "eyJRdWFnc2lyZSI6Ikx0LiBTdXJnZSIsIlJoeXBlcmlvciI6Ik1pc3R5In0="
          - label: scheduler-red50-min
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Wooper::Wooper->Quagsire#1"
            schedule_b64: "eyJHZW5nYXIiOiJMYW5jZSIsIlF1YWdzaXJlIjoiTGFuY2UiLCJSaHlwZXJpb3IiOiJNaXN0eSJ9"

    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: Regression smokes
        run: |
          node src/cli.mjs trainer-ai-smoke
          node src/cli.mjs exp-scheduler-v1-smoke
          node src/cli.mjs route-risk-grind-selector-smoke
      - name: Legacy and grouped route evaluation
        env:
          LABEL: ${{ matrix.label }}
          TEAM_KEYS: ${{ matrix.team_keys }}
          SCHEDULE_B64: ${{ matrix.schedule_b64 }}
        run: |
          set -euo pipefail
          mkdir -p results/m2-grouped
          base=(
            src/cli.mjs route-exp-story-evaluate
            --route-profile=complete
            --version=HEARTGOLD
            --starter=Cyndaquil
            --evolution-policy=trade-aware
            --exp-profile=normal-route
            --grind-policy=none
            --exp-allocator=boss-aware-soft
            --entry-level=expected
            --same-stage-join=map-order
            --resources=all
            --spend-policy=natural
            --build-scope=route
            --runs=32
            --team-keys="$TEAM_KEYS"
          )
          if [[ -n "$SCHEDULE_B64" ]]; then
            base+=(--recipient-schedule-base64="$SCHEDULE_B64")
          fi
          node "${base[@]}" > "results/m2-grouped/${LABEL}-legacy.json"
          node "${base[@]}" --e4-grouped-route-risk=true > "results/m2-grouped/${LABEL}-grouped.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const label=process.env.LABEL;
          const legacy=JSON.parse(fs.readFileSync('results/m2-grouped/'+label+'-legacy.json','utf8'));
          const grouped=JSON.parse(fs.readFileSync('results/m2-grouped/'+label+'-grouped.json','utf8'));
          console.log(JSON.stringify({
            label,
            legacyRetry:legacy.performance.routeExpectedRetryFailures,
            groupedRetry:grouped.performance.routeExpectedRetryFailures,
            groupedDiagnostic:grouped.performance.e4GroupedRetryDiagnostic,
            groupedMode:grouped.performance.e4GroupedRouteRiskMode ?? grouped.assumptions?.e4GroupedRouteRisk ?? null,
            firstMoves:grouped.checkpoints.filter(x=>['Will','Koga','Bruno','Karen','Lance'].includes(x.boss)).map(x=>({boss:x.boss,builds:x.playerBuilds||null}))
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-grouped-objective-${{ matrix.label }}
          path: hgss_story_sim/results/m2-grouped/${{ matrix.label }}-*.json
          if-no-files-found: error

  summarize:
    needs: evaluate
    if: always() && needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-m2-grouped-objective-*
          path: hgss_story_sim/results/m2-grouped
          merge-multiple: true
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='results/m2-grouped';
          const labels=[...new Set(fs.readdirSync(dir).filter(x=>x.endsWith('.json')).map(x=>x.replace(/-(legacy|grouped)\.json$/,'')))].sort();
          const rows=labels.map(label=>{
            const a=JSON.parse(fs.readFileSync(dir+'/'+label+'-legacy.json','utf8'));
            const b=JSON.parse(fs.readFileSync(dir+'/'+label+'-grouped.json','utf8'));
            return {
              label,
              legacyRetry:Number(a.performance.routeExpectedRetryFailures),
              groupedRetry:Number(b.performance.routeExpectedRetryFailures),
              ratio:Number(b.performance.routeExpectedRetryFailures)/Math.max(1e-12,Number(a.performance.routeExpectedRetryFailures)),
              diagnostic:b.performance.e4GroupedRetryDiagnostic
            };
          }).sort((a,b)=>a.groupedRetry-b.groupedRetry);
          const out={schemaVersion:1,purpose:'SCRUM-422 opt-in grouped route-risk smoke',rows};
          fs.writeFileSync(dir+'/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-m2-grouped-objective-summary
          path: hgss_story_sim/results/m2-grouped/summary.json
          if-no-files-found: error
