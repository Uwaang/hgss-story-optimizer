name: research-v2-size4-prefix100-diagnostic

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  SEARCH_ARGS: >-
    --route-profile=complete
    --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware
    --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft
    --entry-level=expected --same-stage-join=map-order
    --resources=all --spend-policy=natural
    --objective=route-risk --route-grind-proxy=false

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[research-v2-size4-prefix100-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-promotion64
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 38122401532
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size4-full16-shard-*
          path: hgss_story_sim/results/full16
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 38125738869
          github-token: ${{ github.token }}
      - name: Build top4 plus idx30 diagnostic5 checkpoint
        run: |
          INPUTS="$(find results/full16 -name 'full16-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-rescore-select-merge \
            --checkpoint=results/input/promotion64.json \
            --inputs="$INPUTS" --runs=16 --beam-width=64 \
            $SEARCH_ARGS > results/full16-all64.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('results/full16-all64.json','utf8'));
          const target=[
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1'
          ];
          const beam=(d.beam||[]).slice(0,4).map(r=>({teamKeys:r.teamKeys,evaluation:r.evaluation}));
          beam.push({teamKeys:target,evaluation:null,diagnosticOnly:true});
          const out={...d,stage:'beam-4-prefix100-diagnostic5',beam};
          fs.writeFileSync('results/diagnostic5.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({top4:(d.beam||[]).slice(0,4).map(r=>({
            teamKeys:r.teamKeys,
            retry:r.routeExpectedRetryFailures,
            geometric:r.routeRiskGeometricScore,
            mean:r.routeRiskMeanWinRate
          })),target},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-prefix100-input
          path: hgss_story_sim/results/diagnostic5.json
          if-no-files-found: error

  rescore100:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-prefix100-input
          path: hgss_story_sim/results/input
      - name: Full100 prefix diagnostic
        run: |
          node src/cli.mjs route-exp-story-rescore-shard \
            --input=results/input/diagnostic5.json \
            --runs=100 --shard-count=5 --shard-index=${{ matrix.shard }} \
            $SEARCH_ARGS > "results/prefix100-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-prefix100-shard-${{ matrix.shard }}
          path: hgss_story_sim/results/prefix100-${{ matrix.shard }}.json
          if-no-files-found: error

  summarize:
    needs: rescore100
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-size4-prefix100-input
          path: hgss_story_sim/results/input
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-size4-prefix100-shard-*
          path: hgss_story_sim/results/shards
          merge-multiple: true
      - name: Summarize 100-run rank and hard-wall differences
        run: |
          INPUTS="$(find results/shards -name 'prefix100-*.json' -type f | sort | paste -sd, -)"
          TARGET="Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Rhyhorn::Rhyhorn->Rhyperior#1,Lapras::Lapras->Lapras#1"
          node src/cli.mjs route-exp-story-rescore-select-merge \
            --checkpoint=results/input/diagnostic5.json \
            --inputs="$INPUTS" --runs=100 --beam-width=5 \
            --target-keys="$TARGET" \
            $SEARCH_ARGS > results/summary.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('results/summary.json','utf8'));
          const key=x=>[...(x||[])].sort().join('|');
          const targetKey=key([
            'Cyndaquil::Cyndaquil->Typhlosion#1',
            'Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1',
            'Lapras::Lapras->Lapras#1'
          ]);
          const target=(d.beam||[]).find(r=>key(r.teamKeys)===targetKey);
          const leader=(d.beam||[])[0];
          function metrics(r){
            const rows=(r?.evaluation?.rows||[]).filter(x=>!x.skipped);
            const retry=rows.reduce((s,x)=>{const p=(Number(x.wins||0)+1)/(Number(x.wins||0)+Number(x.losses||0)+Number(x.ties||0)+2);return s+(1-p)/p},0);
            const geometric=rows.length?Math.exp(rows.reduce((s,x)=>{const p=(Number(x.wins||0)+1)/(Number(x.wins||0)+Number(x.losses||0)+Number(x.ties||0)+2);return s+Math.log(p)},0)/rows.length):0;
            const wins=rows.reduce((s,x)=>s+Number(x.wins||0),0);
            const runs=rows.reduce((s,x)=>s+Number(x.runs||0),0);
            return {retry,geometric,mean:runs?wins/runs:0};
          }
          const diffs=[];
          if(target&&leader){
            const tm=new Map((target.evaluation?.rows||[]).filter(x=>!x.skipped).map(x=>[String(x.boss),x]));
            for(const lr of (leader.evaluation?.rows||[]).filter(x=>!x.skipped)){
              const tr=tm.get(String(lr.boss)); if(!tr) continue;
              const lp=(Number(lr.wins||0)+1)/(Number(lr.wins||0)+Number(lr.losses||0)+Number(lr.ties||0)+2);
              const tp=(Number(tr.wins||0)+1)/(Number(tr.wins||0)+Number(tr.losses||0)+Number(tr.ties||0)+2);
              const lretry=(1-lp)/lp, tretry=(1-tp)/tp;
              diffs.push({boss:String(lr.boss),leaderWins:lr.wins,targetWins:tr.wins,leaderRetry:lretry,targetRetry:tretry,targetMinusLeader:tretry-lretry});
            }
            diffs.sort((a,b)=>Math.abs(b.targetMinusLeader)-Math.abs(a.targetMinusLeader));
          }
          console.log(JSON.stringify({
            schemaVersion:1,
            targetSummary:d.fullRescoreSelect?.target,
            ranked:(d.beam||[]).map((r,i)=>({rank:i+1,teamKeys:r.teamKeys,...metrics(r)})),
            largestBossDiffs:diffs.slice(0,10)
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-size4-prefix100-summary
          path: hgss_story_sim/results/summary.json
          if-no-files-found: error
