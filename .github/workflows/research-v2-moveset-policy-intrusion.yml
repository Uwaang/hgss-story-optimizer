name: research-v2-moveset-policy-intrusion

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  ablation:
    if: contains(github.event.head_commit.message, '[research-v2-policy-intrusion]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Policy option intrusion ablation
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-policy-intrusion --level=50 --runs=10 \
            > results/research-v2/moveset-build-v2-policy-intrusion.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/moveset-build-v2-policy-intrusion.json','utf8'));
          console.log(JSON.stringify(r.rows.map(x=>({
            label:x.label,
            moves:x.moves,
            retry:x.actual.expectedRetryFailures,
            geometric:x.actual.geometricScore,
            mean:x.actual.meanWinRate,
            moveUses:x.actual.targetUsage?.moveUsesByMove || {},
            vsControl:{
              retryDelta:x.vsControl.retryDelta,
              geometricDelta:x.vsControl.geometricDelta,
              meanDelta:x.vsControl.meanDelta,
              bossesImproved:x.vsControl.bossesImproved,
              bossesWorsened:x.vsControl.bossesWorsened,
              bossDeltas:x.vsControl.bossDeltas
            }
          })),null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-moveset-policy-intrusion
          path: hgss_story_sim/results/research-v2/moveset-build-v2-policy-intrusion.json
          if-no-files-found: error
