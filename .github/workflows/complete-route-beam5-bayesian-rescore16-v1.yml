name: complete-route-beam5-bayesian-rescore16-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[beam5-bayesian-rescore16-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beam4-completion-aware-parents-v1
          path: hgss_story_sim/results/input
          repository: Uwaang/hgss-story-optimizer
          run-id: 37106088087
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: beam4-completion-aware-child-shard-*
          path: hgss_story_sim/results/children
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37106088087
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: beam4-completion-aware-recovery-child-shard-*
          path: hgss_story_sim/results/children
          merge-multiple: true
          repository: Uwaang/hgss-story-optimizer
          run-id: 37112225313
          github-token: ${{ github.token }}
      - name: Build 4-run posterior 95-percent credible set
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const parentDoc=JSON.parse(fs.readFileSync('results/input/parent-info.json','utf8'));
          const files=fs.readdirSync('results/children').filter(x=>/^beam-5-shard-\d+\.json$/.test(x));
          const map=new Map();
          for(const f of files){
            const d=JSON.parse(fs.readFileSync(path.join('results/children',f),'utf8'));
            for(const r of d.expanded||[]) map.set([...r.teamKeys].sort().join('|'),r);
          }
          const children=[...map.values()];
          if(children.length!==1150) throw new Error('expected 1150 children');

          function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
          function normal(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
          function gamma(shape,rng){if(shape<1)return gamma(shape+1,rng)*Math.pow(Math.max(rng(),1e-15),1/shape);const d=shape-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normal(rng);v=1+c*x;}while(v<=0);v=v*v*v;const u=rng();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
          function beta(a,b,rng){const x=gamma(a,rng),y=gamma(b,rng);return x/(x+y);}
          const active=e=>(e?.rows||[]).filter(r=>!r?.skipped);
          const draws=2000,massTarget=0.95,union=new Map(),parentSelections=[];
          for(let pi=0;pi<parentDoc.parents.length;pi++){
            const parent=parentDoc.parents[pi];
            const comp=children.filter(c=>parent.teamKeys.every(k=>c.teamKeys.includes(k)));
            const params=comp.map(c=>active(c.evaluation).map(r=>[
              Math.max(0,Number(r?.wins||0))+1,
              Math.max(0,Number(r?.losses||0))+Math.max(0,Number(r?.ties||0))+1
            ]));
            const wins=new Array(comp.length).fill(0);
            const rng=mulberry32((0xC0FFEE+pi*0x9E3779B1)>>>0);
            for(let d=0;d<draws;d++){
              let best=-1,bestRisk=Infinity;
              for(let ci=0;ci<comp.length;ci++){
                let risk=0;
                for(const [a,b] of params[ci]){
                  const p=Math.max(1e-12,beta(a,b,rng));risk+=(1-p)/p;
                }
                if(risk<bestRisk){bestRisk=risk;best=ci;}
              }
              wins[best]++;
            }
            const ranked=comp.map((row,i)=>({row,key:[...row.teamKeys].sort().join('|'),probability:wins[i]/draws}))
              .sort((a,b)=>b.probability-a.probability||a.key.localeCompare(b.key));
            let cum=0;const selected=[];
            for(const x of ranked){if(cum>=massTarget&&selected.length)break;selected.push(x);cum+=x.probability;}
            for(const x of selected)union.set(x.key,x.row);
            parentSelections.push({parentKey:parent.key,kind:parent.kind,selectedCount:selected.length,cumulativeBestProbability:cum});
          }
          const selected=[...union.values()];
          const base=JSON.parse(fs.readFileSync('results/input/diagnostic-checkpoint.json','utf8'));
          const checkpoint={...base,stage:'beam-5-bayesian-selected-4run',beam:selected.map(r=>({teamKeys:r.teamKeys,evaluation:r.evaluation}))};
          fs.writeFileSync('results/selected5-checkpoint.json',JSON.stringify(checkpoint,null,2));
          fs.writeFileSync('results/prepare-summary.json',JSON.stringify({sourceChildren:children.length,selectedUniqueChildren:selected.length,draws,massTarget,parentSelections},null,2));
          console.log(JSON.stringify({sourceChildren:children.length,selectedUniqueChildren:selected.length,draws,massTarget,parentSelections},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: beam5-bayesian-selected-4run-v1
          path: |
            hgss_story_sim/results/selected5-checkpoint.json
            hgss_story_sim/results/prepare-summary.json
          if-no-files-found: error

  rescore16:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      HGSS_BATTLE_CACHE_PATH: results/rescore5-cache-${{ matrix.shard }}.json
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: beam5-bayesian-selected-4run-v1
          path: hgss_story_sim/results/input
      - name: Rescore selected 5-member teams at 16 runs
        run: |
          node src/cli.mjs route-exp-story-rescore-shard \
            --input=results/input/selected5-checkpoint.json --runs=16 \
            --shard-count=8 --shard-index=${{ matrix.shard }} \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > "results/rescore5-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: beam5-bayesian-rescore16-shard-${{ matrix.shard }}
          path: hgss_story_sim/results/rescore5-${{ matrix.shard }}.json
          if-no-files-found: error

  select16:
    needs: rescore16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beam4-completion-aware-parents-v1
          path: hgss_story_sim/results/parents
          repository: Uwaang/hgss-story-optimizer
          run-id: 37106088087
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: beam5-bayesian-selected-4run-v1
          path: hgss_story_sim/results/input
      - uses: actions/download-artifact@v4
        with:
          pattern: beam5-bayesian-rescore16-shard-*
          path: hgss_story_sim/results/rescored
          merge-multiple: true
      - name: Recompute posterior 95-percent credible set at 16 runs
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const parentDoc=JSON.parse(fs.readFileSync('results/parents/parent-info.json','utf8'));
          const base=JSON.parse(fs.readFileSync('results/input/selected5-checkpoint.json','utf8'));
          const files=fs.readdirSync('results/rescored').filter(x=>/^rescore5-\d+\.json$/.test(x));
          if(files.length!==8)throw new Error('expected 8 rescore shards');
          const map=new Map();
          for(const f of files){
            const d=JSON.parse(fs.readFileSync(path.join('results/rescored',f),'utf8'));
            for(const r of d.rescored||[])map.set([...r.teamKeys].sort().join('|'),r);
          }
          const children=[...map.values()];
          if(children.length!==base.beam.length)throw new Error('rescore coverage mismatch '+children.length+' vs '+base.beam.length);

          function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
          function normal(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
          function gamma(shape,rng){if(shape<1)return gamma(shape+1,rng)*Math.pow(Math.max(rng(),1e-15),1/shape);const d=shape-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normal(rng);v=1+c*x;}while(v<=0);v=v*v*v;const u=rng();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
          function beta(a,b,rng){const x=gamma(a,rng),y=gamma(b,rng);return x/(x+y);}
          const active=e=>(e?.rows||[]).filter(r=>!r?.skipped);
          const pointRetry=e=>active(e).reduce((s,r)=>{const w=Number(r?.wins||0),l=Number(r?.losses||0),t=Number(r?.ties||0),p=(w+1)/(w+l+t+2);return s+(1-p)/p;},0);
          const draws=4000,massTarget=0.95,union=new Map(),parentSelections=[];
          for(let pi=0;pi<parentDoc.parents.length;pi++){
            const parent=parentDoc.parents[pi];
            const comp=children.filter(c=>parent.teamKeys.every(k=>c.teamKeys.includes(k)));
            if(!comp.length){parentSelections.push({parentKey:parent.key,kind:parent.kind,compatibleCount:0,selectedCount:0});continue;}
            const params=comp.map(c=>active(c.evaluation).map(r=>[
              Math.max(0,Number(r?.wins||0))+1,
              Math.max(0,Number(r?.losses||0))+Math.max(0,Number(r?.ties||0))+1
            ]));
            const wins=new Array(comp.length).fill(0);
            const rng=mulberry32((0xB16B00B5+pi*0x9E3779B1)>>>0);
            for(let d=0;d<draws;d++){
              let best=-1,bestRisk=Infinity;
              for(let ci=0;ci<comp.length;ci++){
                let risk=0;for(const[a,b]of params[ci]){const p=Math.max(1e-12,beta(a,b,rng));risk+=(1-p)/p;}
                if(risk<bestRisk){bestRisk=risk;best=ci;}
              }
              wins[best]++;
            }
            const ranked=comp.map((row,i)=>({row,key:[...row.teamKeys].sort().join('|'),probability:wins[i]/draws,pointRetry:pointRetry(row.evaluation)}))
              .sort((a,b)=>b.probability-a.probability||a.pointRetry-b.pointRetry||a.key.localeCompare(b.key));
            let cum=0;const selected=[];
            for(const x of ranked){if(cum>=massTarget&&selected.length)break;selected.push(x);cum+=x.probability;}
            for(const x of selected)union.set(x.key,x.row);
            parentSelections.push({parentKey:parent.key,kind:parent.kind,compatibleCount:comp.length,selectedCount:selected.length,cumulativeBestProbability:cum,top:ranked.slice(0,10).map(x=>({teamKeys:x.row.teamKeys,probability:x.probability,pointRetry:x.pointRetry}))});
          }
          const selected=[...union.values()];
          const exactN04=new Set([
            'Cyndaquil::Cyndaquil->Typhlosion#1','Abra::Abra->Alakazam#1',
            'Rhyhorn::Rhyhorn->Rhyperior#1','Lapras::Lapras->Lapras#1',
            'Chinchou::Lanturn->Lanturn#1','Sneasel::Sneasel->Sneasel#1'
          ]);
          const n04Five=selected.filter(r=>r.teamKeys.length===5&&r.teamKeys.every(k=>exactN04.has(k))).map(r=>r.teamKeys);
          const checkpoint={...base,stage:'beam-5-bayesian-selected-16run',beam:selected.map(r=>({teamKeys:r.teamKeys,evaluation:r.evaluation}))};
          fs.writeFileSync('results/selected5-16run-checkpoint.json',JSON.stringify(checkpoint,null,2));
          const out={source4RunSelected:base.beam.length,rescoredChildren:children.length,draws,massTarget,selectedUniqueChildren:selected.length,n04FiveMemberPrefixes:n04Five,parentSelections};
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-beam5-bayesian-rescore16-v1
          path: |
            hgss_story_sim/results/selected5-16run-checkpoint.json
            hgss_story_sim/results/summary.json
          if-no-files-found: error
