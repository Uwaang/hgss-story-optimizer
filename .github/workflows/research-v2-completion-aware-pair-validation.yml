name: research-v2-completion-aware-pair-validation

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-completion-pair16]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - control: idx30-core
            prefix: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiQWJyYTo6QWJyYS0+QWxha2F6YW0jMSIsIlJoeWhvcm46OlJoeWhvcm4tPlJoeXBlcmlvciMxIiwiTGFwcmFzOjpMYXByYXMtPkxhcHJhcyMxIl0=
            added_key: Phanpy::Donphan->Donphan#1
          - control: idx168-d-core
            prefix: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiTWFnbmVtaXRlOjpNYWduZW1pdGUtPk1hZ25ldG9uIzEiLCJHYXN0bHk6Okdhc3RseS0+R2VuZ2FyIzEiLCJSaHlob3JuOjpSaHlob3JuLT5SaHlwZXJpb3IjMSJd
            added_key: Magikarp::Gyarados->Gyarados#1
          - control: idx217-a-core
            prefix: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiR2VvZHVkZTo6R2VvZHVkZS0+R29sZW0jMSIsIlBpbmVjbzo6UGluZWNvLT5Gb3JyZXRyZXNzIzEiLCJNYXJlZXA6Ok1hcmVlcC0+QW1waGFyb3MjMSJd
            added_key: Wurmple::Wurmple->Beautifly#1
          - control: idx83-b-core
            prefix: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiTWFnbmVtaXRlOjpNYWduZW1pdGUtPk1hZ25ldG9uIzEiLCJHZW9kdWRlOjpHZW9kdWRlLT5Hb2xlbSMxIiwiQWJyYTo6QWJyYS0+QWxha2F6YW0jMSJd
            added_key: Happiny::Chansey->Blissey#1
    env:
      HGSS_BATTLE_CACHE_PATH: results/completion-pair16-${{ matrix.control }}-cache.json
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate parent vs selected completion at 16 runs per boss
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs completion-aware-prefix-probe \
            --prefix-base64="${{ matrix.prefix }}" \
            --added-key="${{ matrix.added_key }}" \
            --runs=16 \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil --evolution-policy=trade-aware \
            --exp-profile=normal-route --grind-policy=none --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --objective=route-risk --route-grind-proxy=false \
            > "results/research-v2/pair16-${{ matrix.control }}.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const control=process.env.CONTROL;
          const r=JSON.parse(fs.readFileSync(`results/research-v2/pair16-${control}.json`,'utf8'));
          if (!r.bestChild || r.legalChildCount !== 1) {
            throw new Error('targeted pair validation expected exactly one legal child');
          }
          console.log(JSON.stringify({
            control,
            runs:r.runs,
            requestedAddedKey:r.requestedAddedKey,
            parentMetrics:r.parentMetrics,
            bestChild:r.bestChild,
            improvement:r.improvement,
            battleCache:r.battleCache
          },null,2));
          NODE
        env:
          CONTROL: ${{ matrix.control }}
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-completion-pair16-${{ matrix.control }}
          path: hgss_story_sim/results/research-v2/pair16-${{ matrix.control }}.json
          if-no-files-found: error

  summarize:
    if: contains(github.event.head_commit.message, '[research-v2-completion-pair16]')
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-completion-pair16-*
          path: hgss_story_sim/results/research-v2/pair16
          merge-multiple: true
      - name: Summarize validated completion gaps
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='results/research-v2/pair16';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort();
          const rows=files.map(file=>{
            const r=JSON.parse(fs.readFileSync(`${dir}/${file}`,'utf8'));
            return {
              control:file.replace(/^pair16-/,'').replace(/\.json$/,''),
              runs:r.runs,
              requestedAddedKey:r.requestedAddedKey,
              parentMetrics:r.parentMetrics,
              childMetrics:r.bestChild?.metrics ?? null,
              improvement:r.improvement
            };
          });
          const positive=rows.filter(x=>
            Number(x.improvement?.retry||0)>0 &&
            Number(x.improvement?.geometric||0)>0 &&
            Number(x.improvement?.mean||0)>0
          ).map(x=>x.control);
          const out={schemaVersion:1,runsPerBoss:16,rows,positiveControls:positive,positiveCount:positive.length};
          fs.writeFileSync('results/research-v2/completion-pair16-summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-completion-pair16-summary
          path: hgss_story_sim/results/research-v2/completion-pair16-summary.json
          if-no-files-found: error
