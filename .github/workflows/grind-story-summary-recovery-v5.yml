name: grind-story-summary-recovery-v5

on:
  push:
    branches:
      - recovery/grind-story-summary-v4

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    if: contains(github.event.head_commit.message, '[grind-story-summary-recovery-v5]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4

      - name: Download original and recovered artifacts sequentially
        run: |
          set -euo pipefail
          mkdir -p results/all results/recovered /tmp/artifacts

          download_list () {
            local listfile="$1"
            local dest="$2"
            local expected="$3"
            local count
            count=$(wc -l < "$listfile")
            echo "artifact count=$count expected=$expected"
            test "$count" -eq "$expected"
            local n=0
            while IFS=$'\t' read -r id name; do
              n=$((n+1))
              zip="/tmp/artifacts/${name}.zip"
              ok=0
              for attempt in 1 2 3 4 5; do
                if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zip"; then
                  ok=1
                  break
                fi
                delay=$((attempt*3))
                echo "download retry name=$name attempt=$attempt sleep=${delay}s"
                sleep "$delay"
              done
              test "$ok" -eq 1
              unzip -oq "$zip" -d "$dest"
              rm -f "$zip"
              if (( n % 25 == 0 )); then echo "downloaded $n/$expected"; fi
              sleep 0.12
            done < "$listfile"
          }

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/37348845991/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|test("^grind-aware-story-screen-v2-[0-9]+$")) | [.id,.name] | @tsv' \
            > /tmp/orig.tsv
          download_list /tmp/orig.tsv results/all 239

          shard3_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/37381342600/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="grind-aware-story-screen-v2-3") | .id' | head -n1)
          test -n "$shard3_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${shard3_id}/zip" > /tmp/artifacts/shard3.zip
          unzip -oq /tmp/artifacts/shard3.zip -d results/all

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/37571340435/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name|test("^grind-story-timeout-v3-[0-9]+$")) | [.id,.name] | @tsv' \
            > /tmp/recovery.tsv
          download_list /tmp/recovery.tsv results/recovered 241

          orig_count=$(find results/all -maxdepth 1 -type f -name 'shard-*.json' | wc -l)
          rec_count=$(find results/recovered -maxdepth 1 -type f -name 'state-*.json' | wc -l)
          echo "final downloaded shards=$orig_count recovered=$rec_count"
          test "$orig_count" -eq 240
          test "$rec_count" -eq 241

      - name: Merge recovered states and build final 720-state summary
        run: |
          set -euo pipefail
          mkdir -p results/final
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const allDir='results/all',recDir='results/recovered';
          const shardFiles=fs.readdirSync(allDir).filter(x=>/^shard-\d+\.json$/.test(x));
          const indices=shardFiles.map(f=>Number(f.match(/shard-(\d+)\.json/)[1])).sort((a,b)=>a-b);
          const missing=Array.from({length:240},(_,i)=>i).filter(i=>!indices.includes(i));
          if(shardFiles.length!==240 || missing.length) throw new Error('expected 240 shards, got '+shardFiles.length+' missing='+missing.join(','));

          const shards=shardFiles.map(f=>JSON.parse(fs.readFileSync(path.join(allDir,f),'utf8')));
          const recovered=fs.readdirSync(recDir).filter(x=>/^state-\d+\.json$/.test(x))
            .map(f=>JSON.parse(fs.readFileSync(path.join(recDir,f),'utf8')));
          if(recovered.length!==241) throw new Error('expected 241 recovered states, got '+recovered.length);

          const recMap=new Map(recovered.map(r=>[r.index+'|'+r.allocator,r]));
          let replaced=0;
          for(const s of shards){
            s.rows=(s.rows||[]).map(r=>{
              const rr=recMap.get(s.index+'|'+r.allocator);
              if(r.error && rr){
                replaced++;
                const {ordinal,index,teamKeys,sources,...clean}=rr;
                return clean;
              }
              return r;
            });
          }
          if(replaced!==241) throw new Error('expected 241 replacements, got '+replaced);

          const rows=shards.flatMap(s=>(s.rows||[]).map(r=>({
            index:s.index,teamKeys:s.teamKeys,sources:s.sources,...r
          })));
          if(rows.length!==720) throw new Error('expected 720 states, got '+rows.length);

          const ok=rows.filter(r=>!r.error&&r.repairConverged&&Number.isFinite(r.storyGrindBattles));
          const errors=rows.filter(r=>r.error);
          const nonconverged=rows.filter(r=>!r.error&&!r.repairConverged);
          ok.sort((a,b)=>a.storyGrindBattles-b.storyGrindBattles||a.elapsedSeconds-b.elapsedSeconds);

          const byAllocator={};
          for(const a of ['boss-aware-soft','boss-aware-saturation','balanced']){
            const v=ok.filter(r=>r.allocator===a).sort((x,y)=>x.storyGrindBattles-y.storyGrindBattles);
            byAllocator[a]={
              count:v.length,
              min:v[0]?.storyGrindBattles??null,
              median:v.length?v[Math.floor(v.length/2)].storyGrindBattles:null,
              p90:v.length?v[Math.floor(v.length*0.9)].storyGrindBattles:null,
              max:v.at(-1)?.storyGrindBattles??null
            };
          }

          const out={
            schemaVersion:5,
            purpose:'complete story-grind screen after targeted timeout recovery',
            sourceRuns:{original:37348845991,shard3:37381342600,recovery:37571340435},
            expectedStates:720,observedStates:rows.length,recoveredStates:recovered.length,replacedStates:replaced,
            convergedStates:ok.length,errorStates:errors.length,nonconvergedStates:nonconverged.length,
            byAllocator,top50:ok.slice(0,50),errors,nonconverged,all:rows
          };
          fs.writeFileSync('results/final/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            convergedStates:out.convergedStates,errorStates:out.errorStates,nonconvergedStates:out.nonconvergedStates,
            byAllocator:out.byAllocator,
            top20:out.top50.slice(0,20).map(r=>({
              index:r.index,allocator:r.allocator,story:r.storyGrindBattles,
              sources:r.sources,teamKeys:r.teamKeys
            }))
          },null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: grind-story-summary-recovery-v5
          path: hgss_story_sim/results/final/summary.json
          if-no-files-found: error
