name: final-pareto-practical-grind-baseline-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read

jobs:
  practical:
    if: contains(github.event.head_commit.message, '[final-pareto-grind-baseline-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        team: [N04, PreviousComplete, DewgongLeader]
        allocator: [boss-aware-soft, boss-aware-saturation, balanced]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HGSS_FETCH_ATTEMPTS: 6
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Resolve team keys
        id: team
        shell: bash
        run: |
          case "${{ matrix.team }}" in
            N04)
              echo 'keys=Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Chinchou::Lanturn->Lanturn#1,Rhyhorn::Rhyhorn->Rhyperior#1,Sneasel::Sneasel->Sneasel#1,Lapras::Lapras->Lapras#1' >> "$GITHUB_OUTPUT"
              ;;
            PreviousComplete)
              echo 'keys=Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Dratini::Dragonair->Dragonite#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1,Misdreavus::Misdreavus->Misdreavus#1' >> "$GITHUB_OUTPUT"
              ;;
            DewgongLeader)
              echo 'keys=Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Seel::Dewgong->Dewgong#1,Sandshrew::Sandslash->Sandslash#1,Ditto::Ditto->Ditto#1,Wynaut::Wobbuffet->Wobbuffet#1' >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Practical grind frontier
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-practical-grind \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="${{ steps.team.outputs.keys }}" \
            --exp-profile=normal-route --exp-allocator="${{ matrix.allocator }}" \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --story-targets=0.5 --red-targets=0.25,0.5 \
            --screen-runs=4 --verify-runs=32 --repair-runs=64 --final-runs=128 \
            --max-repair-rounds=24 \
            > "results/${{ matrix.team }}__${{ matrix.allocator }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: final-pareto-grind-${{ matrix.team }}-${{ matrix.allocator }}
          path: hgss_story_sim/results/*.json
          if-no-files-found: error

  summarize:
    needs: practical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-pareto-grind-*
          path: hgss_story_sim/results/all
          merge-multiple: true
      - name: Summarize practical grind baseline
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('results/all').filter(x=>x.endsWith('.json'));
          if(files.length!==9) throw new Error('expected 9 results, got '+files.length);
          const rows=files.map(f=>{
            const d=JSON.parse(fs.readFileSync(path.join('results/all',f),'utf8'));
            const [team,allocator]=f.replace(/\.json$/,'').split('__');
            const story=d.storyFrontier?.[0]||null;
            return {
              team,allocator,
              storyTarget:Number(story?.storyTargetWinRate||0),
              storyGrindBattles:Number(story?.storyGrindBattles||0),
              storyGrindExp:Number(story?.storyGrindExp||0),
              storyWorstBossWinRate:Number(story?.storyWorstBossWinRate||0),
              repairConverged:Boolean(story?.repairConverged),
              redBaseline:story?.redBaseline||null,
              red25:story?.redFrontier?.find(x=>Math.abs(Number(x.targetWinRate)-0.25)<1e-9)||null,
              red50:story?.redFrontier?.find(x=>Math.abs(Number(x.targetWinRate)-0.5)<1e-9)||null,
              storyPlan:story?.storyPlan||{},
              repairHistory:story?.repairHistory||[]
            };
          });
          const rank50=[...rows].sort((a,b)=>{
            const aa=a.red50?.achievedWinRate>=0.5?0:1;
            const bb=b.red50?.achievedWinRate>=0.5?0:1;
            if(aa!==bb)return aa-bb;
            return Number(a.red50?.totalGrindBattles??1e15)-Number(b.red50?.totalGrindBattles??1e15) ||
              b.storyWorstBossWinRate-a.storyWorstBossWinRate;
          });
          const out={
            storyRequirement:'all modeled pre-Red checkpoints >= 50% after repair',
            redTargets:[0.25,0.5],
            rows,
            rankingByRed50TotalGrind:rank50.map((r,i)=>({
              rank:i+1,team:r.team,allocator:r.allocator,
              repairConverged:r.repairConverged,
              storyGrindBattles:r.storyGrindBattles,
              storyWorstBossWinRate:r.storyWorstBossWinRate,
              red25TotalGrind:r.red25?.totalGrindBattles??null,
              red25WinRate:r.red25?.achievedWinRate??null,
              red50TotalGrind:r.red50?.totalGrindBattles??null,
              red50WinRate:r.red50?.achievedWinRate??null,
              red50FinalLevels:r.red50?.finalLevels??null
            }))
          };
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: final-pareto-practical-grind-baseline-v1
          path: hgss_story_sim/results/summary.json
          if-no-files-found: error
