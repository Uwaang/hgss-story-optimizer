name: research-v2-moveset-shortlist-validate
# trigger: Bruno 2 1000-run decision-boundary validation

on:
  push:
    branches:
      - research/v2-moveset-calibration-v1

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[research-v2-moveset-shortlist]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Regression smoke
        run: |
          node src/cli.mjs tutor-smoke
          node src/cli.mjs move-score-smoke
          node src/cli.mjs evolution-legality-smoke
      - name: Actual-battle shortlist validation
        run: |
          mkdir -p results/research-v2
          node src/cli.mjs moveset-build-v2-shortlist-validate --level=50 --runs=1000 \
            --labels="no-eruption-control,eruption-fire-core" \
            --bosses="Bruno 2" \
            > results/research-v2/moveset-build-v2-shortlist-validate.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('results/research-v2/moveset-build-v2-shortlist-validate.json','utf8'));
          console.log(JSON.stringify(r.rows.map(x=>({
            label:x.label,
            moves:x.moves,
            bannedMoves:x.bannedMoves,
            retry:x.actual.expectedRetryFailures,
            geometric:x.actual.geometricScore,
            mean:x.actual.meanWinRate,
            retryBounds95:x.actual.retryBounds95,
            targetBuild:x.actual.targetBuild,
            moveUses:x.actual.targetUsage?.moveUsesByMove || {},
            bossRows:x.actual.bossRows
          })),null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-moveset-shortlist-validate
          path: hgss_story_sim/results/research-v2/moveset-build-v2-shortlist-validate.json
          if-no-files-found: error
