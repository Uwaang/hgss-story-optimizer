name: complete-route-final3-1000-v1

on:
  push:
    branches:
      - exp/progression-safe-screening-v1

permissions:
  contents: read

jobs:
  validate1000:
    if: contains(github.event.head_commit.message, '[final3-1000-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: N04
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Chinchou::Lanturn->Lanturn#1,Rhyhorn::Rhyhorn->Rhyperior#1,Sneasel::Sneasel->Sneasel#1,Lapras::Lapras->Lapras#1"
          - id: DewgongLeader
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Seel::Dewgong->Dewgong#1,Sandshrew::Sandslash->Sandslash#1,Ditto::Ditto->Ditto#1,Wynaut::Wobbuffet->Wobbuffet#1"
          - id: PreviousComplete
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Abra::Abra->Alakazam#1,Dratini::Dragonair->Dragonite#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1,Misdreavus::Misdreavus->Misdreavus#1"
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HGSS_FETCH_ATTEMPTS: 6
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate complete route at 1000 runs
        run: |
          mkdir -p results
          node src/cli.mjs route-exp-story-evaluate \
            --route-profile=complete \
            --version=HEARTGOLD --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="${{ matrix.team_keys }}" \
            --exp-profile=normal-route --grind-policy=none \
            --exp-allocator=boss-aware-soft \
            --entry-level=expected --same-stage-join=map-order \
            --resources=all --spend-policy=natural \
            --route-grind-proxy=false \
            --runs=1000 \
            > "results/final3-${{ matrix.id }}-1000.json"
      - uses: actions/upload-artifact@v4
        with:
          name: final3-${{ matrix.id }}-1000
          path: hgss_story_sim/results/final3-${{ matrix.id }}-1000.json
          if-no-files-found: error

  summarize:
    needs: validate1000
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final3-*-1000
          path: hgss_story_sim/results/final
          merge-multiple: true
      - name: Compute comparable route metrics and Pareto front
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('results/final').filter(x=>/^final3-.*-1000\.json$/.test(x)).sort();
          if(files.length!==3) throw new Error('expected 3 result files, got '+files.length);
          const idFrom=f=>f.match(/^final3-(.*)-1000\.json$/)[1];
          const rows=files.map(f=>{
            const d=JSON.parse(fs.readFileSync(path.join('results/final',f),'utf8'));
            const bosses=d.bosses||[];
            const ps=bosses.filter(b=>!b.skipped).map(b=>{
              const w=Number(b.wins||0), l=Number(b.losses||0);
              return (w+1)/(w+l+2);
            });
            const retry=ps.reduce((s,p)=>s+(1-p)/p,0);
            const geometric=ps.length?Math.exp(ps.reduce((s,p)=>s+Math.log(p),0)/ps.length):0;
            const totalRuns=bosses.filter(b=>!b.skipped).reduce((s,b)=>s+Number(b.wins||0)+Number(b.losses||0),0);
            const totalWins=bosses.filter(b=>!b.skipped).reduce((s,b)=>s+Number(b.wins||0),0);
            return {
              id:idFrom(f),
              team:(d.team||[]).map(x=>x.terminalSpecies||x.species),
              teamKeys:(d.team||[]).map(x=>x.key),
              retry,geometric,mean:totalRuns?totalWins/totalRuns:0,
              critical:Object.fromEntries(['Clair','Will','Karen','Lance','Blue','Will 2','Koga 2','Bruno 2','Karen 2','Lance 2','Red'].map(name=>{
                const b=bosses.find(x=>x.boss===name);
                return [name,b?{wins:Number(b.wins||0),losses:Number(b.losses||0),winRate:Number(b.winRate||0)}:null];
              })),
              bosses:bosses.map(b=>({boss:b.boss,wins:Number(b.wins||0),losses:Number(b.losses||0),winRate:Number(b.winRate||0)}))
            };
          });
          rows.sort((a,b)=>a.retry-b.retry||b.geometric-a.geometric||b.mean-a.mean||a.id.localeCompare(b.id));
          rows.forEach((r,i)=>r.rank=i+1);
          const dominates=(a,b)=>a.retry<=b.retry&&a.geometric>=b.geometric&&a.mean>=b.mean&&(a.retry<b.retry||a.geometric>b.geometric||a.mean>b.mean);
          const pareto=rows.filter((b,i)=>!rows.some((a,j)=>i!==j&&dominates(a,b))).map(x=>x.id);
          const out={runsPerCheckpoint:1000,ranking:rows,pareto};
          fs.writeFileSync('results/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: complete-route-final3-1000-v1
          path: hgss_story_sim/results/summary.json
          if-no-files-found: error
