name: route-exp-rematch-diagnostic

on:
  push:
    branches:
      - design/route-exp-budget-model

jobs:
  rematch:
    if: contains(github.event.head_commit.message, '[rematch-eval]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: highgrind-winner
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Geodude::Geodude->Golem#1,Slowpoke::Slowpoke->Slowbro#1,Pineco::Pineco->Forretress#1,Mareep::Mareep->Ampharos#1,Rhyhorn::Rhyhorn->Rhyperior#1"
            member_levels: "63,75,71,66,70,75"
          - label: quagsire-soft
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1"
            member_levels: "64,72,73,68,73,73"
          - label: quagsire-balanced
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Geodude::Geodude->Golem#1,Abra::Abra->Alakazam#1,Wooper::Quagsire->Quagsire#1,Rhyhorn::Rhyhorn->Rhyperior#1"
            member_levels: "71,70,71,71,71,70"
          - label: natural-winner
            team_keys: "Cyndaquil::Cyndaquil->Typhlosion#1,Magnemite::Magnemite->Magneton#1,Magikarp::Magikarp->Gyarados#1,Gastly::Gastly->Gengar#1,Rhyhorn::Rhyhorn->Rhyperior#1,Larvitar::Pupitar->Tyranitar#1"
            member_levels: "42,50,50,46,54,45"
    defaults:
      run:
        working-directory: hgss_story_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Evaluate Elite Four rematch at fixed post-Blue levels
        run: |
          mkdir -p results
          node src/cli.mjs equal-level-story-evaluate \
            --version=HEARTGOLD \
            --starter=Cyndaquil \
            --evolution-policy=trade-aware \
            --team-keys="${{ matrix.team_keys }}" \
            --member-levels="${{ matrix.member_levels }}" \
            --bosses="Will 2,Koga 2,Bruno 2,Karen 2,Lance 2" \
            --runs=1000 \
            > "results/rematch-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rematch-${{ matrix.label }}
          path: hgss_story_sim/results/rematch-${{ matrix.label }}.json
          if-no-files-found: error
