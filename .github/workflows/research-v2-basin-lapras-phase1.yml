      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: research-v2-basin-lapras-promotion2
          path: hgss_story_sim/results/base
      - uses: actions/download-artifact@v4
        with:
          pattern: research-v2-basin-lapras-rare64-2-*
          path: hgss_story_sim/results/rare
          merge-multiple: true
      - name: Select grind-aware size2 beam16
        run: |
          INPUTS="$(find results/rare -name 'rare64-2-*.json' -type f | sort | paste -sd, -)"
          node src/cli.mjs route-exp-story-selective-rescore-merge \
            --checkpoint=results/base/promotion2.json --inputs="$INPUTS" \
            --runs=64 --max-low-wins=0 --beam-width=16 --selection=beam \
            $SEARCH_ARGS > results/beam2.json
          jq '{beamCount:(.beam|length),selectiveRescore,beam:[.beam[]|{teamKeys,proxy:.evaluation.routeGrindProxy.expectedBattles}]}' results/beam2.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-basin-lapras-beam2
          path: hgss_story_sim/results/beam2.json
          if-no-files-found: error

