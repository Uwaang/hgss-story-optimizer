name: research-v2-idx30-prefix-depth-compare

on:
  push:
    branches:
      - research/v2-completion-aware-global-search-v2

permissions:
  contents: read

jobs:
  evaluate:
    if: contains(github.event.head_commit.message, '[research-v2-idx30-prefix-depth]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: idx30-pair-alakazam
            team: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiQWJyYTo6QWJyYS0+QWxha2F6YW0jMSJd
          - label: idx30-pair-rhyperior
            team: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiUmh5aG9ybjo6Umh5aG9ybi0+Umh5cGVyaW9yIzEiXQ==
          - label: idx30-pair-lapras
            team: WyJDeW5kYXF1aWw6OkN5bmRhcXVpbC0+VHlwaGxvc2lvbiMxIiwiTGFwcmFzOjpMYXByYXMtPkxhcHJhcyMxIl0=
          - label: idx30-pair-lanturn
